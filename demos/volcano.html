<title>Volcano Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Vulkanplanet: eigene Seite, teilt keinen Code mit dem Gasplaneten. */
  :root {
    color-scheme: dark;
    --bg: #050608;
    --panel: rgba(14, 15, 19, 0.92);
    --line: #2a2c34;
    --text: #ece8e1;
    --muted: #9c978f;
    --accent: #ec8f4e;
    --focus: #f3cf9c;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); overflow: hidden; }
  #app { height: 100%; display: grid; grid-template-columns: 1fr 340px; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hud { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 1px 3px #000; }

  #fps { color: var(--accent); }
  #busy { position: absolute; left: 16px; bottom: 16px; font: 12px var(--mono); color: var(--accent); pointer-events: none; }
  #status { position: absolute; left: 16px; right: 16px; bottom: 16px; max-width: 560px; padding: 12px 14px; background: #2a1512; border: 1px solid #7a3326; border-radius: 6px; }
  aside {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .head { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .help { position: sticky; top: 0; z-index: 1; margin: 0 0 12px; padding: 10px 12px; height: 9.5em; overflow-y: auto; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: #0b0c10; color: var(--muted); font-size: 12.5px; }
  .help b { color: var(--text); font-weight: 500; }
  .fx { display: block; margin-top: 6px; font: 11.5px/1.45 var(--mono); color: #e3c29a; }
  h2 { margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid var(--line); font: 600 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
  .note { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding-block: 5px; }
  .row label { font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .row-select { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  .seed { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
  .seed input { min-width: 0; font: 13px var(--mono); color: var(--text); background: #1b1c22; border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button, select { font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; cursor: pointer; }
  button.hot { border-color: #8a4a22; background: #2b1a10; }
  select { width: 100%; }
  #lang { font: 600 12px var(--mono); letter-spacing: 0.08em; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--muted); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .help { height: 7.5em; }
  }
</style>

<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Real-time view: procedural planet with volcanoes whose smoke rises as millions of particles"></canvas>

</div>

<script type="module">
// ---------------------------------------------------------------------------
// Vulkanplanet: hochaufgelöster Zufallsplanet + Vulkane, deren Rauch als Millionen Partikel aufsteigt.
// Idee und Vorgaben: elias-nero-tron. Eigene Schiene, teilt keinen Code mit dem Gasplaneten.
//
// Was hier gerechnet wird (alles WebGPU, keine Bilddateien):
//  1. Gelände: 3D-Gradientenrauschen mit analytischen Ableitungen, Domain Warping, Erosions-fBm,
//     Ridged Multifractal (Musgrave). Gebacken wird nur Höhe, Feuchte und Normale (Würfelkarte bis 4096²).
//     Farben, Meeresspiegel, Klima, Rauheit und Glanz entstehen beim Zeichnen: diese Regler wirken sofort.
//  2. Vulkane: Kegel, Krater, Caldera, Schneekappe mit Rinnen analytisch beim Zeichnen, scharf bei jedem Zoom.
//  3. Rauch als Partikel (Lagrange): jedes Teilchen ist eine weiche, beleuchtete Quellwolke.
//     Aufstieg mit w = W·√(1 − z/z*) bis zur eigenen Einschichthöhe z* (Mastin 2009: H = 2,00·V^0,241 km),
//     Säule weitet sich wie b = b₀ + 6/5·α·z (Morton, Taylor & Turner 1956), oben Schirmwolke als
//     Schwerestrom u_r = ⅔·k^(3/2)·r^(−1/2) (Woods & Kienle 1994, Volumenstrom nach Costa et al. 2013),
//     danach Transport durch den Wind und Absinken. Kleine Ausbrüche: dünne Fahnen, mittlere: Knubbel, große: Pilz.
//  4. Licht: Rayleigh + Mie (Chapman-Näherung, Schüler 2012), GGX-Glanz mit Rauheit pro Material,
//     Rauchschatten auf dem Boden über eine Schattenkarte in Sonnenrichtung, Partikel in
//     gewichteter reihenfolgeunabhängiger Transparenz (McGuire & Bavoil 2013).
// Status: nur im Software-Renderer geprüft.
// ---------------------------------------------------------------------------

let lang = (() => { try { const v = localStorage.getItem('fgp-lang'); if (v === 'de' || v === 'en') return v; } catch {} return (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en'; })();
const t = (de, en) => (lang === 'de' ? de : en);
const Q = new URLSearchParams(location.search);
const H = new URLSearchParams(location.hash.slice(1));
const OFFSCREEN = H.has('offscreen');

const S = {
  seed: Number(Q.get('seed')) || 12567890, res: 2048, style: 0, sea: 0.0, cont: 1.3, warp: 0.9, mount: 0.55, erosion: 1.2, relief: 1.2, climate: 0.0, moist: 0.0,
  radius: 6371, atm: 100, exag: 2, haze: 0.6,
  vCount: 12, vSize: 25, vMer: 7.6, vAct: 0.6, vSeed: 1,
  sCount: 1, sSize: 60, sMer: 9.3, superOn: true,
  windU: 18, circ: 1.0, shear: 1.0, strat: 0.6, turb: 0.5, preU: 6, preDir: 30,
  count: 1 << 20, opacity: 1.0, life: 10, spread: 0.12, settle: 0.15, warm: 8,
  lapse: 300, spin: 0.3, sunAz: 115, sunEl: 12, exposure: 0.8, nebula: 1.0, stars: 1.0, glow: 1.0, tilt: 0,
  scale: 1.0, auto: true,
};
const DEF = { ...S };
// Werte auch über die Adresse: #res=1024&vCount=20 (für Tests und Links)
for (const [k, v] of H) if (k in S && k !== 'seed') S[k] = typeof S[k] === 'boolean' ? v === 'true' : Number(v);
const COUNTS = [1 << 18, 1 << 20, 1 << 22, 1 << 23, 1 << 24, 1 << 25];

// ---------------------------------------------------------------------------
// Regler. Jede Zeile: [Schlüssel, Name, min, max, Schritt, Erklärung, Formel, Art, Format]
// Art: undefined = sofort · 'shape' = Gelände neu backen (beim Ziehen schnelle Vorschau) · 'heavy' = beim Loslassen
// ---------------------------------------------------------------------------
const fmtKm = (v) => (v >= 100 ? Math.round(v) : v.toFixed(v < 10 ? 1 : 0)) + ' km';
const pct = (km) => ((km / S.radius) * 100).toFixed(km / S.radius < 0.01 ? 2 : 1) + ' % R';
const merTxt = (lg) => `10^${lg.toFixed(1)} kg/s · H≈${plumeHeight(10 ** lg).toFixed(0)} km`;
const lapseTxt = (v) => (v >= 3600 ? (v / 3600).toFixed(1) + ' h/s' : v >= 60 ? (v / 60).toFixed(v < 600 ? 1 : 0) + ' min/s' : v + ' s/s');
const sections = () => [
  [t('Planet', 'Planet'), t('Nur die Form wird gebacken (beim Ziehen als schnelle Vorschau). Farben, Meer, Klima und Glanz rechnet jedes Bild neu: sofort.', 'Only the shape is baked (a fast preview while dragging). Colours, sea, climate and gloss are computed every frame: instant.'), [
    ['res', t('Auflösung', 'Resolution'), 'select', [[512, '512² × 6'], [1024, '1024² × 6'], [2048, '2048² × 6'], [4096, '4096² × 6']],
      t('Texel pro Würfelseite. 2048 ≈ 5 km pro Texel bei Erdgröße, 4096 ≈ 2,5 km. Beim Hineinzoomen kommt darunter Rauschdetail pro Pixel dazu.', 'Texels per cube face. 2048 ≈ 5 km per texel at Earth size, 4096 ≈ 2.5 km. Zooming in adds per-pixel noise detail below that.'), null, 'heavy'],
    ['style', t('Farbwelt', 'Colour style'), 'select', [[0, t('Erdähnlich', 'Earth-like')], [1, t('Fremdwelt (Zufallsfarben)', 'Alien (random colours)')], [2, t('Vulkanwelt (Lavameere)', 'Volcanic world (lava seas)')]],
      t('Farbtabelle für Biome. Vulkanwelt: statt Wasser glühende Lava unter erstarrter Kruste.', 'Biome colour table. Volcanic world: glowing lava under a solid crust instead of water.')],
    ['sea', t('Meeresspiegel', 'Sea level'), -0.6, 0.6, 0.005, t('Wasserlinie im Höhenfeld, sofort. Die Küste wird aus der gefilterten Höhe berechnet, deshalb bleibt sie beim Zoomen glatt.', 'Water line in the height field, instant. The coast is computed from the filtered height, so it stays smooth when zooming.'), 'Wasser, wo h(p) < Meeresspiegel'],
    ['climate', t('Klima', 'Climate'), -0.6, 0.6, 0.01, t('Verschiebt die Temperatur: kalt = Eis, Tundra, Schneekappen; warm = Wüste, Dschungel.', 'Shifts temperature: cold = ice, tundra, snow caps; warm = desert, jungle.'), 'T = 1 − |φ/90°|^1,3 − Γ·h + ΔT'],
    ['moist', t('Feuchte', 'Moisture'), -0.6, 0.6, 0.01, t('Wüste ↔ Wald. Subtropische Trockengürtel bei 30° bleiben.', 'Desert ↔ forest. Subtropical dry belts at 30° remain.')],
    ['relief', 'Relief', 0, 4, 0.01, t('Überhöhung der Normalen (nur Licht).', 'Normal exaggeration (lighting only).'), 'n = normalize(n·p̂ + k·n_t)'],
    ['cont', t('Kontinent-Skala', 'Continent scale'), 0.4, 4, 0.01, t('Grundfrequenz des Geländes. Klein = wenige große Kontinente.', 'Base frequency of the terrain. Small = few large continents.'), 'q = p·f₀', 'shape'],
    ['warp', t('Verwirbelung', 'Domain warp'), 0, 2.5, 0.01, t('Domain Warping: die Koordinaten werden durch ein zweites Rauschfeld verschoben. Macht Küsten und Gebirgszüge organisch.', 'Domain warping: coordinates are displaced by a second noise field. Makes coasts and ranges organic.'), 'h(p) = f(p + k·w(p))', 'shape'],
    ['mount', t('Gebirge', 'Mountains'), 0, 1.5, 0.01, t('Ridged Multifractal (Musgrave): scharfe Grate.', 'Ridged multifractal (Musgrave): sharp ridges.'), 's = (1 − |n|)²·w,  w = clamp(2s, 0, 1)', 'shape'],
    ['erosion', t('Erosion', 'Erosion'), 0, 4, 0.01, t('Oktaven werden durch den aufsummierten Gradienten gedämpft: steile Hänge glatt, Täler mit Detail.', 'Octaves are damped by the accumulated gradient: steep slopes smooth, valleys detailed.'), 'h += aᵢ·nᵢ / (1 + k·|Σ∇n|²)', 'shape'],
    ['radius', t('Planetenradius', 'Planet radius'), 1000, 20000, 10, t('Maßstab für alles in km. Erde 6371 km, Mars 3390 km.', 'Scale for everything in km. Earth 6371 km, Mars 3390 km.'), null, null, (v) => fmtKm(v)],
  ]],
  [t('Atmosphäre', 'Atmosphere'), null, [
    ['atm', t('Atmosphärendicke', 'Atmosphere thickness'), 20, 300, 1, t('Obergrenze der Luftschicht (Erde ~100 km). Skalenhöhe H = Dicke/11,8 → Schichtung N → Säulenhöhe: dickere Luft = höhere Säulen.', 'Top of the air layer (Earth ~100 km). Scale height H = thickness/11.8 → stratification N → plume height: thicker air = taller plumes.'), 'N ∝ H^(−1/2),  H_Säule ∝ N^(−3/4) ∝ H^(3/8)', null, (v) => fmtKm(v) + ' · ' + pct(v)],
    ['haze', t('Dunst', 'Haze'), 0, 2, 0.01, t('Stärke der Rayleigh- und Mie-Streuung (1 = Erde).', 'Strength of Rayleigh and Mie scattering (1 = Earth).')],
    ['exag', t('Höhen-Überhöhung', 'Vertical exaggeration'), 1, 8, 0.1, t('Rauch und Luft in der Höhe gestreckt, damit man aus 1000–5000 km die Säulen sieht. 1 = maßstabsgetreu.', 'Smoke and air stretched vertically so columns read from 1000–5000 km. 1 = true scale.'), 'r = 1 + k·z/R', null, (v) => v.toFixed(1) + '×'],
  ]],
  [t('Vulkane', 'Volcanoes'), null, [
    ['vCount', t('Anzahl', 'Count'), 0, 48, 1, t('Normale Vulkane, per Seed verteilt. Sie brechen periodisch aus.', 'Regular volcanoes, placed by seed. They erupt periodically.'), null, null, (v) => String(v)],
    ['vSize', t('Größe (Basisradius)', 'Size (base radius)'), 5, 300, 1, t('Radius des Kegels. Ätna ~20 km, Mauna Loa ~60 km, Olympus Mons ~300 km. Streuung ×0,5–1,5.', 'Radius of the cone. Etna ~20 km, Mauna Loa ~60 km, Olympus Mons ~300 km. Varies ×0.5–1.5.'), null, null, (v) => fmtKm(v) + ' · ' + pct(v)],
    ['vMer', t('Eruptionsrate', 'Eruption rate'), 5, 9.5, 0.05, t('Massenstrom (kg/s, log). Klein: dünne Fahne, die der Wind umlegt. Mittel: Knubbelwolken. Groß: Pilz mit Schirm.', 'Mass eruption rate (kg/s, log). Small: thin plume bent by the wind. Medium: knobbly clouds. Large: mushroom with umbrella.'), 'H = 2,00 km · (Ṁ/ρ)^0,241,  ρ = 2500 kg/m³', null, merTxt],
    ['vAct', t('Aktivität', 'Activity'), 0, 1, 0.01, t('Anteil der Zeit, in der jeder Vulkan ausbricht (Pulse von 6–48 h).', 'Share of time each volcano erupts (pulses of 6–48 h).'), null, null, (v) => Math.round(v * 100) + ' %'],
  ]],
  [t('Supervulkan', 'Supervolcano'), t('Caldera statt Kegel. VEI 8: > 1000 km³ Auswurf.', 'Caldera instead of a cone. VEI 8: > 1000 km³ ejecta.'), [
    ['sCount', t('Anzahl', 'Count'), 0, 4, 1, t('Yellowstone, Toba, Campi Flegrei.', 'Yellowstone, Toba, Campi Flegrei.'), null, null, (v) => String(v)],
    ['sSize', t('Caldera-Durchmesser', 'Caldera diameter'), 10, 200, 1, t('Yellowstone 70 km, Toba 100 km, Campi Flegrei 13 km.', 'Yellowstone 70 km, Toba 100 km, Campi Flegrei 13 km.'), 'b₀ = D/4', null, (v) => fmtKm(v) + ' · ' + pct(v)],
    ['sMer', t('Eruptionsrate', 'Eruption rate'), 8, 11, 0.05, t('Pinatubo 1991: ~10⁹ kg/s. Toba: ~10¹⁰–10¹¹ kg/s.', 'Pinatubo 1991: ~10⁹ kg/s. Toba: ~10¹⁰–10¹¹ kg/s.'), 'H = 2,00·V^0,241·(H_s/8,5 km)^(3/8)', null, merTxt],
  ]],
  [t('Wind', 'Wind'), t('Trägt den Rauch. Oben und unten weht es verschieden: daraus entstehen Schichten.', 'Carries the smoke. It blows differently high and low: that makes the layers.'), [
    ['windU', t('Zirkulation', 'Circulation'), 0, 60, 0.5, t('Passat am Äquator, Westwinde bei 45°, polare Ostwinde, Hadley-Rückstrom. Der Jet nimmt bis zur Tropopause zu.', 'Trade winds at the equator, westerlies at 45°, polar easterlies, Hadley return flow. The jet grows up to the tropopause.'), 'u(φ,z) = U·(−0,4 + 1,4·e^(−((|φ|−45°)/15°)²) + 2s·jet·z/z_T)', null, (v) => v.toFixed(0) + ' m/s'],
    ['shear', t('Höhenscherung', 'Vertical shear'), 0, 3, 0.01, t('Thermischer Wind: Westwind wird mit der Höhe stärker. Säulen neigen sich.', 'Thermal wind: westerlies strengthen with height. Columns lean.'), '∂u/∂z = −(g/fT)·∂T/∂y'],
    ['strat', t('Stratosphären-Ostwind', 'Stratospheric easterly'), 0, 1.5, 0.01, t('Über der Tropopause Ostwind (Pinatubos Wolke zog in 3 Wochen westwärts um die Erde).', 'Easterly above the tropopause (Pinatubo’s cloud circled the Earth westward in 3 weeks).')],
    ['turb', t('Wirbel', 'Eddies'), 0, 1.5, 0.01, t('Divergenzfreie Wirbel aus einer Stromfunktion ψ.', 'Divergence-free eddies from a stream function ψ.'), 'v = r̂ × ∇ψ'],
    ['preU', t('Grundwind', 'Prevailing wind'), 0, 60, 0.5, t('Zusätzlicher Wind in eine feste Richtung.', 'Extra wind in one fixed direction.'), 'v = U·(cos θ·ê_Ost + sin θ·ê_Nord)', null, (v) => v.toFixed(0) + ' m/s'],
    ['preDir', t('Windrichtung', 'Wind direction'), -180, 180, 1, t('0° = nach Osten, 90° = nach Norden, 180° = nach Westen.', '0° = toward east, 90° = toward north, 180° = toward west.'), null, null, (v) => v + '°'],
    ['circ', t('Zellen-Anteil', 'Cell share'), 0, 1, 0.01, t('0 = nur Grundwind, 1 = volle globale Zirkulation.', '0 = prevailing wind only, 1 = full global circulation.')],
  ]],
  [t('Rauch', 'Smoke'), t('Jedes Teilchen ist eine weiche Quellwolke mit eigenem Licht und Schatten.', 'Each particle is a soft puff with its own light and shadow.'), [
    ['count', t('Teilchen', 'Particles'), 'select', COUNTS.map((c) => [c, c >= 1 << 20 ? `${c / (1 << 20)} M` : `${c / 1024} k`]), t('Mehr Teilchen = dichtere, feinere Wolken. Handy ~1 M, starke Grafikkarte bis 32 M.', 'More particles = denser, finer clouds. Phone ~1 M, strong GPU up to 32 M.'), null, 'heavy'],
    ['opacity', t('Dichte', 'Opacity'), 0.05, 3, 0.01, t('Deckkraft pro Quellwolke. Sie verdünnt sich, während die Wolke wächst (Masse bleibt, Fläche wächst).', 'Opacity per puff. It thins as the puff grows (mass stays, area grows).'), 'α = 1 − e^(−κ·m/(π r²))'],
    ['spread', t('Ausbreitung', 'Spreading'), 0, 4, 0.01, t('Turbulente Diffusion: wie schnell eine Quellwolke nach dem Aufstieg wächst.', 'Turbulent diffusion: how fast a puff grows after rising.'), 'r² = r₀² + 4K·t'],
    ['life', t('Lebensdauer', 'Lifetime'), 1, 72, 0.5, t('Wie lange ein Teilchen in der Luft bleibt, bevor es ausfällt oder sich auflöst. Länger = längere Fahnen.', 'How long a particle stays aloft before it falls out or dissolves. Longer = longer plumes.'), null, null, (v) => v + ' h'],
    ['settle', t('Absinken', 'Settling'), 0, 2, 0.01, t('Fallgeschwindigkeit der Asche nach dem Aufstieg.', 'Settling speed of ash after rising.'), 'w_s = (ρ_p − ρ)·g·d² / 18μ', null, (v) => v.toFixed(2) + ' m/s'],
    ['warm', t('Vorlauf', 'Warm-up'), 0, 48, 1, t('So viele Stunden werden beim Start vorgerechnet.', 'This many hours are pre-computed at start.'), null, null, (v) => v + ' h'],
  ]],
  [t('Zeit und Licht', 'Time and light'), null, [
    ['lapse', t('Zeitraffer', 'Time lapse'), 10, 7200, 10, t('Simulierte Zeit pro echter Sekunde (Wind, Aufstieg, Ausbrüche).', 'Simulated time per real second (wind, rise, eruptions).'), null, null, lapseTxt],
    ['spin', t('Drehung', 'Spin'), 0, 5, 0.01, t('Drehung des Planeten in Grad pro Sekunde, unabhängig vom Zeitraffer. Sterne und Nebel drehen nicht mit.', 'Planet rotation in degrees per second, independent of time lapse. Stars and nebula do not turn with it.'), null, null, (v) => v.toFixed(2) + '°/s'],
    ['tilt', t('Blickneigung', 'View tilt'), 0, 80, 1, t('Kippt den Blick zum Horizont: Säulen von der Seite, Weltraum dahinter. Auch: rechte Maustaste oder Umschalt + Ziehen.', 'Tilts the view to the horizon: columns from the side, space behind. Also: right mouse or Shift + drag.'), null, null, (v) => v + '°'],
    ['sunAz', t('Sonne (Richtung)', 'Sun (azimuth)'), -180, 180, 1, t('Flache Sonne an der Tag-Nacht-Grenze: lange Schatten, Säulen plastisch.', 'Low sun at the terminator: long shadows, sculpted columns.'), null, null, (v) => v + '°'],
    ['sunEl', t('Sonne (Höhe)', 'Sun (elevation)'), -80, 80, 1, null, null, null, (v) => v + '°'],
    ['exposure', t('Belichtung', 'Exposure'), 0.2, 4, 0.01, null],
    ['glow', t('Glut', 'Glow'), 0, 4, 0.01, t('Leuchten von Krater, Lava und Säulenbasis.', 'Glow of crater, lava and column base.')],
    ['nebula', t('Nebel', 'Nebula'), 0, 3, 0.01, t('Fest im Raum: dreht nur mit der Kamera.', 'Fixed in space: turns only with the camera.')],
    ['stars', t('Sterne', 'Stars'), 0, 3, 0.01, null],
  ]],
  [t('Grafikkarte', 'Graphics'), t('Kostet nur GPU-Zeit, ändert die Physik nicht.', 'Costs only GPU time, does not change the physics.'), [
    ['auto', t('Automatik 60 fps', 'Auto 60 fps'), 'check', null, t('Senkt die Render-Auflösung, solange die Bildrate unter 50 fps liegt.', 'Lowers the render resolution while the frame rate is below 50 fps.')],
    ['scale', t('Render-Auflösung', 'Render resolution'), 0.35, 2, 0.05, t('Faktor auf die Bildschirmauflösung (über 1 = Supersampling).', 'Factor on screen resolution (above 1 = supersampling).'), null, null, (v) => v.toFixed(2) + '×'],
  ]],
];

const help = document.getElementById('help');
let onChange = () => {};
let paused = false;
function buildUI() {
  const box = document.getElementById('controls');

// Vulkanphysik auf der CPU (pro Vulkan und Bild, billig)
// ---------------------------------------------------------------------------
const scaleHeight = () => S.atm / 11.8;                      // km, Erde: 100 km → 8,5 km
const bruntN = () => 0.02 * Math.sqrt(8.5 / scaleHeight());  // 1/s, isotherm: N² = g²/(c_p T) ∝ 1/H
// Mastin et al. 2009: H = 2,00·V^0,241 (V = DRE-Volumenstrom m³/s), MTT: H ∝ N^(−3/4)
function plumeHeight(mer) { return Math.min(2.0 * Math.pow(Math.max(mer, 1) / 2500, 0.241) * Math.pow(scaleHeight() / 8.5, 0.375), 0.92 * S.atm); }
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function randDir(r) { const z = r() * 2 - 1, a = r() * Math.PI * 2, s = Math.sqrt(1 - z * z); return [s * Math.cos(a), z, s * Math.sin(a)]; }

let volcs = [];
function genVolcanoes() {
  const r = mulberry((S.seed * 7919) ^ (S.vSeed * 104729));
  volcs = [];
  for (let i = 0; i < S.vCount; i++) {
    const Rb = S.vSize * (0.5 + r());
    const shield = r() < 0.3;
    // Stratovulkan: Hangneigung ~15–30°, Schildvulkan ~5°
    volcs.push({ dir: randDir(r), Rb, Hc: shield ? Math.min(0.08 * Rb, 9) : Math.min(0.2 * Rb, 5), rc: (shield ? 0.08 : 0.07) * Rb, type: shield ? 1 : 0,
      merJ: -0.3 + (r() - 0.5) * 1.4, period: (6 + r() * 42) * 3600, phase: r(), super: false });
  }
  for (let i = 0; i < S.sCount; i++) {
    const rc = S.sSize / 2;
    volcs.push({ dir: randDir(r), Rb: rc * 2.2, Hc: 1.2, rc, type: 2, merJ: (r() - 0.5) * 0.4, period: 0, phase: 0, super: true });
  }
}

const NOISE = /* wgsl */`

fn pcg3d(a: vec3u) -> vec3u {

fn grad3(i: vec3f) -> vec3f {

// Gradientenrauschen, quintisch interpoliert
fn noise(x: vec3f) -> f32 {

  let va = dot(grad3(i), f);

  let vc = dot(grad3(i + vec3f(0, 1, 0)), f - vec3f(0, 1, 0));
  let vd = dot(grad3(i + vec3f(1, 1, 0)), f - vec3f(1, 1, 0));

  let vf = dot(grad3(i + vec3f(1, 0, 1)), f - vec3f(1, 0, 1));
  let vg = dot(grad3(i + vec3f(0, 1, 1)), f - vec3f(0, 1, 1));

// Dasselbe mit analytischem Gradienten: (Wert, ∂/∂x, ∂/∂y, ∂/∂z)
fn noised(x: vec3f) -> vec4f {

  let gc = grad3(i + vec3f(0, 1, 0));    let gd = grad3(i + vec3f(1, 1, 0));
  let ge = grad3(i + vec3f(0, 0, 1));    let gf = grad3(i + vec3f(1, 0, 1));
  let gg = grad3(i + vec3f(0, 1, 1));    let gh = grad3(i + vec3f(1, 1, 1));
  let va = dot(ga, f);                   let vb = dot(gb, f - vec3f(1, 0, 0));
  let vc = dot(gc, f - vec3f(0, 1, 0));  let vd = dot(gd, f - vec3f(1, 1, 0));
  let ve = dot(ge, f - vec3f(0, 0, 1));  let vf = dot(gf, f - vec3f(1, 0, 1));
  let vg = dot(gg, f - vec3f(0, 1, 1));  let vh = dot(gh, f - vec3f(1, 1, 1));
  let k1 = vb - va; let k2 = vc - va; let k3 = ve - va;
  let k4 = va - vb - vc + vd; let k5 = va - vc - ve + vg; let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;
  let v = va + k1 * u.x + k2 * u.y + k3 * u.z + k4 * u.x * u.y + k5 * u.y * u.z + k6 * u.z * u.x + k7 * u.x * u.y * u.z;
  let g = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga) + u.x * u.y * (ga - gb - gc + gd)
        + u.y * u.z * (ga - gc - ge + gg) + u.z * u.x * (ga - gb - ge + gf) + u.x * u.y * u.z * (-ga + gb + gc - gd + ge - gf - gg + gh)
        + du * vec3f(k1 + k4 * u.y + k6 * u.z + k7 * u.y * u.z,

  return vec4f(v, g);

fn fbm(p0: vec3f, oct: i32) -> f32 {

const WIND = /* wgsl */`
struct WindP { a: vec4f, b: vec4f, c: vec4f }   // a: U, Zellen, Scherung, Strat.; b: Wirbel, Grundwind, Richtung, Tropopause km; c: Zeit s
fn eastOf(p: vec3f) -> vec3f { let e = vec3f(-p.z, 0.0, p.x); let l = length(e); return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5); }
fn windCirc(p: vec3f, zkm: f32, W: WindP) -> vec3f {
  let e = eastOf(p); let n = cross(e, p);

  var u = -0.4 + 1.4 * jet + 2.0 * W.a.z * jet * zt;       // thermischer Wind bis zur Tropopause
  let above = max(zkm - W.b.w, 0.0) / W.b.w;

  return (u * e + v * n) * (W.a.x * W.a.y) + pre;
}
fn wind(p: vec3f, zkm: f32, W: WindP) -> vec3f {

// Partikel: Aufstieg, Schirm, Wind, Absinken, Neugeburt an den Schloten
const PART = NOISE + WIND + VOLC + /* wgsl */`
struct PU { a: vec4f, b: vec4f, c: vec4f, wind: WindP }
// a: dt, Zeit, R km, Anzahl Vulkane · b: Teilchen, Zufall, Lebensdauer s, – · c: Absinken m/s, Summe Gewichte, Zurücksetzen, –
@group(0) @binding(0) var<uniform> U: PU;
@group(0) @binding(1) var<storage, read_write> P: array<vec4f>;   // Richtung xyz, Höhe km (< 0: tot)
@group(0) @binding(2) var<storage, read_write> M: array<vec4f>;   // Alter s, Lebensdauer s, Vulkan, Einschichthöhe z* km
@group(0) @binding(3) var<storage, read> V: array<Volc>;
@group(0) @binding(4) var<storage, read> CW: array<f32>;          // kumulierte Emissionsgewichte
fn rnd4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u)); let g = pcg3d(h ^ vec3u(0x85ebca6bu));
  return vec4f(vec3f(h >> vec3u(8u)) / 16777216.0, f32(g.x >> 8u) / 16777216.0);
}
@compute @workgroup_size(256)
fn update(@builtin(global_invocation_id) gid: vec3u) {
  let id = gid.x;
  if (id >= u32(U.b.x)) { return; }
  let dt = U.a.x; let R = U.a.z; let nv = u32(U.a.w);
  var p = P[id]; var m = M[id];
  if (U.c.z > 0.5) { P[id] = vec4f(0.0, 0.0, 0.0, -1.0); M[id] = vec4f(0.0, rnd4(id, 7u).x * U.b.z, 0.0, 0.0); return; }
  m.x += dt;
  let vid = u32(m.z);
  if (m.x >= m.y || vid >= nv) {
    // Neugeburt an einem Schlot, gewählt nach Emissionsgewicht (∝ Massenstrom)
    let r = rnd4(id, bitcast<u32>(U.b.y));
    if (U.c.y <= 0.0 || nv == 0u) { P[id] = vec4f(0.0, 0.0, 0.0, -1.0); M[id] = vec4f(0.0, 120.0 + r.y * 1800.0, 0.0, 0.0); return; }
    let x = r.x * U.c.y;

    loop { if (i + 1u >= nv || CW[i] >= x) { break; } i++; }
    let v = V[i];
    let e = eastOf(v.p.xyz); let n = cross(e, v.p.xyz);
    let th = r.z * 2.0 * PI; let rho = sqrt(r.w);
    let dir = normalize(v.p.xyz + (cos(th) * e + sin(th) * n) * rho * v.f.x / R);
    let life = U.b.z * mix(0.4, 1.6, r.y) * select(1.0, 2.0, v.q.z > 1.5);
    // eigene Einschichthöhe: die meisten nahe der Spitze (Schirm), einige tiefer (Fahne entlang der Säule)
    let zs = v.e.y * (0.5 + 0.5 * pow(fract(r.x * 97.13 + r.y * 13.7), 0.5));
    P[id] = vec4f(dir, 0.05);
    M[id] = vec4f(0.0, life, f32(i) + 0.5, zs);
    return;
  }
  if (p.w < 0.0) { M[id] = m; return; }
  let v = V[vid];
  let dir = p.xyz; let z = p.w;
  let h = rnd4(id, bitcast<u32>(m.y));
  let e0 = eastOf(v.p.xyz); let n0 = cross(e0, v.p.xyz);

  let rho = sqrt(h.w);

  var w = 0.0;
  // Säule: Auftrieb bis z*, Radius wächst wie b = b₀ + 0,12·z (MTT, α = 0,1)
  if (f < 0.98) {
    w = W * sqrt(max(1.0 - f, 0.0)) + 0.3;
    vel += ldir * rho * 0.12 * w;
  }
  // Schirm: radialer Schwerestrom um den Schlot
  let uw = smoothstep(0.7, 0.97, f);
  let dv = (dir - v.p.xyz * dot(dir, v.p.xyz)) * R;
  let rr = length(dv);
  let rdir = select(ldir, dv / max(rr, 1e-4), rr > 0.05);
  let ur = min((2.0 / 3.0) * pow(v.f.z, 1.5) / sqrt(max(rr, v.f.x + 0.12 * zs) * 1000.0), 0.8 * W);
  // über dem Schlot bleibt eine überschießende Kuppel stehen (kein Loch in der Mitte)
  vel += rdir * ur * uw * smoothstep(v.f.w, 0.5 * v.f.w, rr) * smoothstep(0.0, v.f.x + 0.12 * zs, rr) * max(v.e.w, 0.15);
  // Turbulenz: kleine Wirbel, im Aufstieg stärker (Knubbel)
  let tn = noised(dir * (R / 25.0) + vec3f(0.0, z * 0.2, U.a.y * 3e-4)).yzw;
  vel += cross(dir, tn) * (0.15 * W * (1.0 - uw) + 2.0);
  w += tn.x * 0.1 * W * (1.0 - uw);
  // Absinken nach dem Aufstieg
  w -= U.c.x * (0.3 + 1.4 * h.x) * uw;
  let tang = vel - dir * dot(vel, dir);
  let d2 = normalize(dir + tang * dt / (R * 1000.0));
  let z2 = z + w * dt / 1000.0;
  if (z2 < 0.0) { m.x = m.y; }
  P[id] = vec4f(d2, max(z2, 0.0));
  M[id] = m;
}
`;

// Gemeinsame Uniforms für Planet, Partikel und Zusammensetzen
const RU_DECL = /* wgsl */`
struct RU {
  cam: vec4f, right: vec4f, up: vec4f, fwd: vec4f, sunW: vec4f, sunP: vec4f,
  rot: vec4f, geo: vec4f, atm: vec4f, look: vec4f, part: vec4f, res: vec4f, shx: vec4f, shy: vec4f,
  pal: array<vec4f, 12>,
}
// cam: xyz, tan(fov/2) · right: xyz, Seitenverh. · up: xyz, Belichtung · fwd: xyz, Kameraabstand · sunW: xyz, Sonnenstärke
// sunP: Sonne im Planetensystem, Pixelwinkel · rot: cos θ, sin θ, Zeit s, Sim-Zeit s · geo: R km, Dicke km, Überhöhung, Anzahl Vulkane
// atm: H_R km, H_M km, Relief, Glut · look: Meer, Klima, Feuchte, Dunst · part: Dichte, Ausbreitung km²/s, Farbwelt, –
// res: Breite, Höhe, Bild, Textur-N · shx/shy: Achsen der Schattenkarte (Welt)
@group(0) @binding(0) var<uniform> G: RU;
const BR = vec3f(5.8e-6, 13.5e-6, 33.1e-6);   // Rayleigh-Streuung 1/m (Meereshöhe, Erde)
const BM = 21e-6;                              // Mie-Streuung 1/m
const LAVA = vec3f(1.0, 0.33, 0.06);
fn toPl(w: vec3f) -> vec3f { return vec3f(G.rot.x * w.x + G.rot.y * w.z, w.y, -G.rot.y * w.x + G.rot.x * w.z); }
fn toW(p: vec3f) -> vec3f { return vec3f(G.rot.x * p.x - G.rot.y * p.z, p.y, G.rot.y * p.x + G.rot.x * p.z); }
fn sphere(o: vec3f, d: vec3f, r: f32) -> vec2f {
  let b = dot(o, d); let c = dot(o, o) - r * r; let h = b * b - c;
  if (h < 0.0) { return vec2f(-1.0); }
  let s = sqrt(h); return vec2f(-b - s, -b + s);
}
// Chapman-Näherung (Schüler 2012): relative Luftsäule entlang eines schrägen Strahls
fn chapman(X: f32, h: f32, cz: f32) -> f32 {
  let c = sqrt(X + h);
  if (cz >= 0.0) { return c / (c * cz + 1.0) * exp(-h); }
  let x0 = sqrt(1.0 - cz * cz) * (X + h);
  return 2.0 * sqrt(x0) * exp(min(X - x0, 60.0)) - c / (1.0 - c * cz) * exp(-h);
}
fn sunTrans(altkm: f32, cz: f32) -> vec3f {
  let R = G.geo.x; let k = G.look.w;
  let tr = BR * k * G.atm.x * 1000.0 * chapman(R / G.atm.x, altkm / G.atm.x, cz);
  let tm = BM * k * 1.11 * G.atm.y * 1000.0 * chapman(R / G.atm.y, altkm / G.atm.y, cz);
  return exp(-(tr + vec3f(tm)));
}
fn tonemap(c0: vec3f, fc: vec2f) -> vec3f {
  let x = c0 * G.up.w * 0.6;
  let m = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
  let dith = (fract(sin(dot(fc, vec2f(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
  return pow(m, vec3f(1.0 / 2.2)) + dith;
}
`;

// Planet: Hintergrund, Boden mit Farben/Glanz beim Zeichnen, Atmosphäre → HDR

@group(0) @binding(1) var hmT: texture_cube<f32>;

@group(0) @binding(3) var smp: sampler;
@group(0) @binding(4) var nebT: texture_cube<f32>;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {

}
fn starColor(x: f32) -> vec3f {

fn stars(d: vec3f) -> vec3f {
  let a = abs(d);

  else if (a.y >= a.z) { uv = d.xz / a.y; face = select(3.0, 2.0, d.y > 0.0); }
  else { uv = d.xy / a.z; face = select(5.0, 4.0, d.z > 0.0); }

    let gsz = 90.0 * pow(2.2, f32(l));

    let h2 = rnd3(vec3f(cell.y + 17.0, cell.x - 3.0, face * 11.0 + f32(l) * 71.0));

}

// Vulkan-Gelände (analytisch): Kegel, Krater, Caldera; Rinnen für Schnee und Lava
struct Cone { h: f32, g: vec3f, basalt: f32, glow: f32, gully: f32 }
fn coneH(r: f32, v: Volc) -> f32 {
  let x = r / v.p.w; let rc = v.q.y;
  if (v.q.z > 1.5) {
    let rim = v.q.x * exp(-pow((r - rc) / (0.3 * rc), 2.0));
    let floorD = -0.9 * v.q.x * (1.0 - smoothstep(0.75 * rc, rc, r));
    return rim + floorD + 0.3 * v.q.x * max(1.0 - x, 0.0);

  var h = select(v.q.x * (exp(-3.2 * x) - exp(-3.2)) / (1.0 - exp(-3.2)), v.q.x * (1.0 - x * x), v.q.z > 0.5);
  h = select(h, 0.0, x >= 1.0);

}
fn cones(n: vec3f) -> Cone {
  var o: Cone; o.h = 0.0; o.g = vec3f(0.0); o.basalt = 0.0; o.glow = 0.0; o.gully = 0.0;
  let R = G.geo.x;

}

fn shadowAt(pw: vec3f) -> f32 {

fn ggx(n: vec3f, v: vec3f, l: vec3f, rough: f32, f0: f32) -> f32 {

fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {

`;

@fragment

fn vsShadow(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> SO {

fn fsDepth(i: SO) {
  if (dot(i.uv, i.uv) > 0.6 || i.a < 0.15) { discard; }
}
@fragment
fn fsShadow(i: SO) -> @location(0) vec4f {
  let r2 = dot(i.uv, i.uv);
  if (r2 > 1.0) { discard; }
  return vec4f(-log(1.0 - min(i.a * pow(1.0 - r2, 1.2), 0.95)), 0.0, 0.0, 0.0);

`;

// Zusammensetzen: Planet (HDR) hinter den Partikeln (OIT), Tonemapping

@group(0) @binding(1) var hdrT: texture_2d<f32>;

@group(0) @binding(3) var revT: texture_2d<f32>;
@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  return vec4f(p * 2.0 - 1.0, 0.0, 1.0);
}
@fragment
fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let ip = vec2i(fc.xy);

  let acc = textureLoad(accT, ip, 0);

    const oh = hm, on = nrm;
    hm = h2; nrm = n2; texN = N; planetBG = null;
    if (oh) oh.destroy(); if (on) on.destroy();
    busyEl.textContent = '';
    return true;
  }
  async function bakeNebula() {
    const N = 1024;
    if (!neb) neb = cubeTex(N, 'rgba16float', 1);
    const r = mulberry(S.seed ^ 0x5bd1e995);
    const hue = r() * Math.PI * 2;
    const hsv = (h, s, v) => { const f = (n) => { const k = (n + h / (Math.PI / 3)) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5), f(3), f(1)]; };
    const gal = randDir(r);
    const d = new Float32Array(24);
    d.set([N, 0.55, 0, 0, r() * 100, r() * 100, r() * 100, 0, ...gal, 0, ...hsv(hue, 0.75, 0.5), 0, ...hsv(hue + 1.3 + r(), 0.7, 0.45), 0, ...hsv(hue + 3.2, 0.5, 0.6), 0]);
    device.queue.writeBuffer(nebU, 0, d);
    const bg = device.createBindGroup({ layout: nebPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: nebU } }, { binding: 1, resource: neb.createView({ dimension: '2d-array' }) }] });
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass(); pass.setPipeline(nebPipe); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(N / 8, N / 8, 6); pass.end();
    device.queue.submit([enc.finish()]);
  }
  let pal = palette(mulberry(S.seed));

  // --- Partikel
  let pBuf = null, mBuf = null, count = 0, partBG = null, smokeBG = null, resetFlag = true;
  function makeParticles() {
    count = Math.min(S.count, maxCount);
    if (pBuf) { pBuf.destroy(); mBuf.destroy(); }
    pBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.STORAGE });
    mBuf = device.createBuffer({ size: count * 16, usage: GPUBufferUsage.STORAGE });
    partBG = device.createBindGroup({ layout: partPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: partU } }, { binding: 1, resource: { buffer: pBuf } }, { binding: 2, resource: { buffer: mBuf } },
      { binding: 3, resource: { buffer: volcBuf } }, { binding: 4, resource: { buffer: cwBuf } }] });
    smokeBG = null; resetFlag = true;
  }

  // --- Vulkane pro Bild
  let simT = 0, superT = 0, spinA = 0, visT = 0, frameNo = 0;
  const vdata = new Float32Array(MAXV * 16), cw = new Float32Array(MAXV);
  let totalW = 0;
  function updateVolcanoes() {
    const Nb = bruntN();
    vdata.fill(0); totalW = 0;
    volcs.slice(0, MAXV).forEach((v, i) => {
      let act = 0, onset = 0, mer;
      if (v.super) {
        mer = Math.pow(10, S.sMer + v.merJ);
        onset = superT;
        act = S.superOn ? Math.min(1, Math.max(0, (simT - superT) / 1800)) : 0;
      } else {
        const x = (((simT / v.period + v.phase) % 1) + 1) % 1;
        const duty = S.vAct;
        onset = simT - x * v.period;
        act = duty <= 0 ? 0 : x < duty ? Math.min(1, (x * v.period) / 1800, ((duty - x) * v.period) / 3600) : 0;
        mer = Math.pow(10, S.vMer + v.merJ);
      }
      const merNow = mer * Math.max(act, 1e-3);
      const W = Math.min(250, Math.max(5, 30 * Math.pow(merNow / 1e8, 0.25)));
      const Hfull = plumeHeight(merNow);
      const Hh = Math.max(0.5, Math.min(Hfull, (W * Math.max(simT - onset, 0)) / 1000 + 0.5));
      const b0 = v.super ? v.rc * 0.5 : Math.max(0.3, v.rc * 0.5);
      const q = (136 * Math.pow(merNow, 0.75)) / Math.pow(Nb, 1.25);            // Costa et al. 2013, m³/s
      const k = Math.cbrt((3 * 0.2 * Nb * q) / (2 * Math.PI));                    // Woods & Kienle 1994
      const Rmax = Math.min(2500, Math.max(20, (((2 / 3) * Math.pow(k, 1.5)) / 4) ** 2 / 1000));
      // Emissionsgewicht: sublinear im Massenstrom, damit kleine Vulkane sichtbar bleiben
      const wgt = act > 0 ? Math.pow(merNow, 0.45) : 0;
      totalW += wgt; cw[i] = totalW;
      vdata.set([...v.dir, v.Rb, v.Hc, v.rc, v.type, wgt, act > 0 ? merNow : 0, Hh, W, act, b0, 0, k, Rmax], i * 16);
      v.now = { act, H: Hh, mer: merNow };
    });
    device.queue.writeBuffer(volcBuf, 0, vdata);
    device.queue.writeBuffer(cwBuf, 0, cw);
  }
  const pdata = new Float32Array(7 * 4);
  function stepParticles(dt) {
    pdata.set([dt, simT, S.radius, Math.min(volcs.length, MAXV), count, (Math.random() * 1e9) | 0, S.life * 3600, 0, S.settle, totalW, resetFlag ? 1 : 0, 0,
      S.windU, S.circ, S.shear, S.strat, S.turb, S.preU, (S.preDir * Math.PI) / 180, 0.12 * S.atm, simT, S.atm, 0, 0]);
    // Zufall als Bitmuster weitergeben
    new Uint32Array(pdata.buffer, 5 * 4, 1)[0] = (Math.random() * 4294967295) >>> 0;
    device.queue.writeBuffer(partU, 0, pdata);
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass(); pass.setPipeline(partPipe); pass.setBindGroup(0, partBG);
    pass.dispatchWorkgroups(Math.ceil(count / 256)); pass.end();
    device.queue.submit([enc.finish()]);
    resetFlag = false;
  }
  async function advance(seconds, report) {
    const n = Math.ceil(seconds / 120);
    for (let i = 0; i < n; i++) {
      updateVolcanoes(); stepParticles(seconds / n); simT += seconds / n;
      if (i % 10 === 9) { if (report) report(i / n); await device.queue.onSubmittedWorkDone(); }
    }
    await device.queue.onSubmittedWorkDone();
  }

  // --- Kamera
  const cam = { yaw: 0.6, pitch: 0.18, alt: 9000 };
  const ptrs = new Map(); let pinch = 0;
  const zoom = (f) => { cam.alt = Math.min(60000, Math.max(20, cam.alt * f)); };
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); });
  const end = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoom(pinch / dd); pinch = dd; return; }
    if (e.shiftKey || (e.buttons & 2)) {
      S.tilt = Math.max(0, Math.min(80, S.tilt - (e.clientY - p[1]) * 0.25));
      const el = document.getElementById('c-tilt'); if (el) { el.value = S.tilt; el.dispatchEvent(new Event('input')); }
      return;
    }
    const k = 0.005 * Math.min(1, (cam.alt / S.radius) * 0.8 + 0.02);
    cam.yaw -= (e.clientX - p[0]) * k; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + (e.clientY - p[1]) * k));
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });

  // --- Änderungen: sofort, Vorschau oder schwer
  let bakeBusy = false, bakeWant = 0;
  async function runBake() {
    if (bakeBusy) return;
    bakeBusy = true;
    while (bakeWant) { const N = bakeWant; bakeWant = 0; await bake(N); }
    bakeBusy = false;
  }
  onChange = (key, kind) => {
    if (key === 'clear') { resetFlag = true; return; }
    if (key === 'erupt') { S.superOn = true; superT = simT; return; }
    if (['vCount', 'vSize', 'sCount', 'sSize', 'vSeed'].includes(key)) genVolcanoes();
    if (key === 'style') pal = palette(mulberry(S.seed));
    if (key === 'count') makeParticles();
    if (key === 'seed') { pal = palette(mulberry(S.seed)); genVolcanoes(); bakeNebula(); bakeWant = 256; runBake().then(() => { bakeWant = S.res; runBake(); }); }
    if (key === 'res') { bakeWant = S.res; runBake(); }
    if (kind === 'preview') { if (!bakeWant || bakeWant === 256) { bakeWant = 256; runBake(); } }
    if (kind === 'shape') { bakeWant = S.res; runBake(); }
  };

  genVolcanoes();
  makeParticles();
  await bakeNebula();
  await bake(256);
  if (S.res > 256) await bake(S.res);
  busyEl.textContent = t('Vorlauf …', 'Warm-up …');
  await advance(S.warm * 3600, (f) => { busyEl.textContent = `${t('Vorlauf', 'Warm-up')} ${Math.round(f * 100)} %`; });
  busyEl.textContent = '';

  // --- Zeichnen
  function targets(w, h) {
    if (size[0] === w && size[1] === h) return;
    for (const x of [hdr, accT, revT]) if (x) x.destroy();
    const mk2 = (f) => device.createTexture({ size: [w, h], format: f, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
    hdr = mk2(HDR); accT = mk2(HDR); revT = mk2('r8unorm');
    size = [w, h]; compBG = null;
  }
  const rdata = new Float32Array(26 * 4);
  function writeRender(w, h) {
    const dist = 1 + cam.alt / S.radius;
    const cy = Math.cos(cam.pitch);
    const eye = [Math.sin(cam.yaw) * cy * dist, Math.sin(cam.pitch) * dist, Math.cos(cam.yaw) * cy * dist];
    const fwd = eye.map((x) => -x / dist);
    const right = [-fwd[2], 0, fwd[0]].map((x, _, a) => x / Math.hypot(...a));
    const up = [right[1] * fwd[2] - right[2] * fwd[1], right[2] * fwd[0] - right[0] * fwd[2], right[0] * fwd[1] - right[1] * fwd[0]];
    const ti = ((S.tilt * Math.PI) / 180) * Math.min(1, Math.asin(Math.min(1, 1 / dist)) / 0.9);
    for (let k = 0; k < 3; k++) { const f = fwd[k], u = up[k]; fwd[k] = f * Math.cos(ti) + u * Math.sin(ti); up[k] = u * Math.cos(ti) - f * Math.sin(ti); }
    const tanH = Math.tan(0.5 * 0.75);
    const az = (S.sunAz * Math.PI) / 180, el = (S.sunEl * Math.PI) / 180;
    const sunW = [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
    const c = Math.cos(spinA), s = Math.sin(spinA);
    const sunP = [c * sunW[0] + s * sunW[2], sunW[1], -s * sunW[0] + c * sunW[2]];
    // Achsen der Schattenkarte senkrecht zur Sonne
    const hx = Math.abs(sunW[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    let sx = [hx[1] * sunW[2] - hx[2] * sunW[1], hx[2] * sunW[0] - hx[0] * sunW[2], hx[0] * sunW[1] - hx[1] * sunW[0]];
    const ls = Math.hypot(...sx); sx = sx.map((x) => x / ls);
    const sy = [sunW[1] * sx[2] - sunW[2] * sx[1], sunW[2] * sx[0] - sunW[0] * sx[2], sunW[0] * sx[1] - sunW[1] * sx[0]];
    const HR = scaleHeight(), HM = HR * 0.14;
    rdata.set([...eye, tanH, ...right, w / h, ...up, S.exposure, ...fwd, dist, ...sunW, 22, ...sunP, (2 * tanH) / h,
      c, s, visT, simT, S.radius, S.atm, S.exag, Math.min(volcs.length, MAXV), HR, HM, S.relief, S.glow,
      S.sea, S.climate, S.moist, S.haze, S.opacity, S.spread * 0.02, S.style, S.nebula, w, h, S.stars, texN, ...sx, 0, ...sy, 0], 0);
    pal.forEach((col, i) => rdata.set([...col, 1], 56 + i * 4));
    device.queue.writeBuffer(renU, 0, rdata);
  }
  function drawTo(enc, view, w, h) {
    targets(w, h);
    planetBG ??= device.createBindGroup({ layout: planetPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: renU } }, { binding: 1, resource: hm.createView({ dimension: 'cube' }) }, { binding: 2, resource: nrm.createView({ dimension: 'cube' }) },
      { binding: 3, resource: smp }, { binding: 4, resource: neb.createView({ dimension: 'cube' }) }, { binding: 5, resource: { buffer: volcBuf } }, { binding: 6, resource: shTex.createView() }] });
    smokeBG ??= device.createBindGroup({ layout: smokePipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: renU } }, { binding: 1, resource: { buffer: pBuf } }, { binding: 2, resource: { buffer: mBuf } }, { binding: 3, resource: { buffer: volcBuf } },
      { binding: 4, resource: shDepth.createView() }] });
    compBG ??= device.createBindGroup({ layout: compPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: renU } }, { binding: 1, resource: hdr.createView() }, { binding: 2, resource: accT.createView() }, { binding: 3, resource: revT.createView() }] });
    const shadowBG = device.createBindGroup({ layout: shadowPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: renU } }, { binding: 1, resource: { buffer: pBuf } }, { binding: 2, resource: { buffer: mBuf } }, { binding: 3, resource: { buffer: volcBuf } }] });
    let rp = enc.beginRenderPass({ colorAttachments: [{ view: shTex.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }] });
    rp.setPipeline(shadowPipe); rp.setBindGroup(0, shadowBG); rp.draw(6, count); rp.end();
    const depthBG = device.createBindGroup({ layout: depthPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: renU } }, { binding: 1, resource: { buffer: pBuf } }, { binding: 2, resource: { buffer: mBuf } }, { binding: 3, resource: { buffer: volcBuf } }] });
    rp = enc.beginRenderPass({ colorAttachments: [], depthStencilAttachment: { view: shDepth.createView(), depthClearValue: 1, depthLoadOp: 'clear', depthStoreOp: 'store' } });
    rp.setPipeline(depthPipe); rp.setBindGroup(0, depthBG); rp.draw(6, count); rp.end();
    rp = enc.beginRenderPass({ colorAttachments: [{ view: hdr.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    rp.setPipeline(planetPipe); rp.setBindGroup(0, planetBG); rp.draw(3); rp.end();
    rp = enc.beginRenderPass({ colorAttachments: [
      { view: accT.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] },
      { view: revT.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [1, 1, 1, 1] }] });
    rp.setPipeline(smokePipe); rp.setBindGroup(0, smokeBG); rp.draw(6, count); rp.end();
    rp = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    rp.setPipeline(compPipe); rp.setBindGroup(0, compBG); rp.draw(3); rp.end();
  }
  // Ohne Fenster (Tests): in eine Textur rechnen und zurücklesen, keine Swapchain
  async function capture(w, h) {
    updateVolcanoes();
    writeRender(w, h);
    const tex = device.createTexture({ size: [w, h], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const bpr = Math.ceil((w * 4) / 256) * 256;
    const buf = device.createBuffer({ size: bpr * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = device.createCommandEncoder();
    drawTo(enc, tex.createView(), w, h);
    enc.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: bpr }, [w, h]);
    device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const src = new Uint8Array(buf.getMappedRange());
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const c2 = cv.getContext('2d'); const img = c2.createImageData(w, h);
    const bgra = format.startsWith('bgra');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * bpr + x * 4, o = (y * w + x) * 4;
      img.data[o] = src[i + (bgra ? 2 : 0)]; img.data[o + 1] = src[i + 1]; img.data[o + 2] = src[i + (bgra ? 0 : 2)]; img.data[o + 3] = 255;
    }
    buf.unmap(); buf.destroy(); tex.destroy();
    c2.putImageData(img, 0, 0);
    return cv.toDataURL('image/png');
  }
  const api = window.volcanoPlanet = { S, cam, ready: true, frames: 0, capture,
    advance: (h) => advance(h * 3600),
    spin: (a) => { spinA = a; }, trigger: () => onChange('erupt'), rebake: () => bake(S.res), regen: () => genVolcanoes(),
    set: (k, v) => { S[k] = v; onChange(k, k === 'res' || k === 'count' ? 'heavy' : ['cont', 'warp', 'mount', 'erosion'].includes(k) ? 'shape' : undefined); },
    look: (i, alt) => { const d = volcs[i].dir, c = Math.cos(spinA), s = Math.sin(spinA); const w = [c * d[0] - s * d[2], d[1], s * d[0] + c * d[2]];
      cam.yaw = Math.atan2(w[0], w[2]); cam.pitch = Math.asin(w[1]); if (alt) cam.alt = alt; return volcs[i]; },
    volcs: () => volcs.map((v) => ({ super: v.super, Rb: v.Rb, now: v.now })) };
  if (OFFSCREEN) return;

  let last = performance.now(), acc = 0, frames = 0, autoScale = 1;
  const frame = (now) => {
    const dtR = Math.min((now - last) / 1000, 0.1); last = now;
    acc += dtR; frames++; frameNo++; api.frames = frameNo;
    if (acc > 0.5) {
      const fps = frames / acc;
      document.getElementById('fps').textContent = `${Math.round(fps)} fps` + (S.auto && autoScale < 0.99 ? ` · ${Math.round(autoScale * 100)} %` : '');
      if (S.auto && fps < 50) autoScale = Math.max(0.3, autoScale * Math.sqrt(fps / 58));
      else if (S.auto && fps > 58) autoScale = Math.min(1, autoScale * 1.05);
      if (!S.auto) autoScale = 1;
      acc = 0; frames = 0;
    }
    if (!paused) {
      const dtS = dtR * S.lapse;
      const n = Math.min(4, Math.ceil(dtS / 120));
      for (let i = 0; i < n; i++) { updateVolcanoes(); stepParticles(dtS / n); simT += dtS / n; }
      visT += dtR;
      spinA += (dtR * S.spin * Math.PI) / 180;
    } else updateVolcanoes();
    const dpr = Math.min(devicePixelRatio || 1, 2) * S.scale * autoScale;
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    writeRender(w, h);
    const enc = device.createCommandEncoder();
    drawTo(enc, ctx.getCurrentTexture().createView(), w, h);
    device.queue.submit([enc.finish()]);
    if (frameNo % 15 === 1) {
      const sv = volcs.find((v) => v.super && v.now && v.now.act > 0);
      const active = volcs.filter((v) => v.now && v.now.act > 0).length;
      const d = Math.floor(simT / 86400), hh = Math.floor((simT % 86400) / 3600);
      factsEl.textContent = `${t('Höhe', 'Altitude')} ${Math.round(cam.alt).toLocaleString()} km · ${t('Tag', 'day')} ${d} ${hh}h · ${active} ${t('aktiv', 'active')} · ${(count / (1 << 20)).toFixed(count < 1 << 20 ? 2 : 0)} M ${t('Teilchen', 'particles')}` +
        (sv ? ` · ${t('Supervulkan', 'supervolcano')} ${sv.now.H.toFixed(0)} km` : '');
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
start().catch((e) => fail(String((e && e.stack) || e)));
</script>
