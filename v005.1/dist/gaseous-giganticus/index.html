// Würfelfläche/Pixel -> Richtung, gleiche Flächenlage wie im Original
fn fijToXyz(f: u32, i: f32, j: f32, d: f32) -> vec3f {
  let a = (i - d * 0.5) / d; let b = -(j - d * 0.5) / d; let c = (j - d * 0.5) / d;
  var v: vec3f;
  switch f {
    case 0u: { v = vec3f(a, b, 0.5); }
    case 1u: { v = vec3f(0.5, b, -a); }
    case 2u: { v = vec3f(-a, b, -0.5); }
    case 3u: { v = vec3f(-0.5, b, a); }
    case 4u: { v = vec3f(a, 0.5, c); }
    default: { v = vec3f(a, -0.5, -c); }
  }
  return normalize(v);
}
// Umkehrung: Richtung -> Index in einem Würfelfeld der Kantenlänge d
fn xyzToIdx(p: vec3f, d: f32) -> u32 {
  let ap = abs(p);
  var f = 0u; var a = 0.0; var jj = 0.0;
  if (ap.z >= ap.x && ap.z >= ap.y) {
    let s = 0.5 / ap.z;
    if (p.z > 0.0) { f = 0u; a = p.x * s; } else { f = 2u; a = -p.x * s; }
    jj = -p.y * s;
  } else if (ap.x >= ap.y) {
    let s = 0.5 / ap.x;
    if (p.x > 0.0) { f = 1u; a = -p.z * s; } else { f = 3u; a = p.z * s; }
    jj = -p.y * s;
  } else {
    let s = 0.5 / ap.y;
    a = p.x * s;
    if (p.y > 0.0) { f = 4u; jj = p.z * s; } else { f = 5u; jj = -p.z * s; }
  }
  let i = u32(clamp(floor(a * d + d * 0.5), 0.0, d - 1.0));
  let j = u32(clamp(floor(jj * d + d * 0.5), 0.0, d - 1.0));
  return (f * u32(d) + j) * u32(d) + i;

fn mod289v(x: vec4f) -> vec4f { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn mod289s(x: f32) -> f32 { return x - floor(x * (1.0 / 289.0)) * 289.0; }
fn permv(x: vec4f) -> vec4f { return mod289v(((x * 34.0) + 10.0) * x); }
fn perms(x: f32) -> f32 { return mod289s(((x * 34.0) + 10.0) * x); }
fn tis(r: vec4f) -> vec4f { return 1.79284291400159 - 0.85373472095314 * r; }

  i0.y += isYZ.x + isYZ.y;

  i0.z += isYZ.z;
  i0.w += 1.0 - isYZ.z;

`,fe=`fn pcg(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn rnd(a: u32) -> f32 { return f32(pcg(a)) / 4294967295.0; }

@compute @workgroup_size(256)
fn initParticles(@builtin(global_invocation_id) g: vec3u) {

  let sd = i * 2u + u32(u.seed) * 7919u;
  let z = 1.0 - 2.0 * rnd(sd);
  let ph = 6.28318530718 * rnd(sd + 1u);
  let s = sqrt(max(0.0, 1.0 - z * z));
  let p = vec3f(s * cos(ph), z, s * sin(ph));

  let xo = cos(lon) * cl * 0.5 * cl + 0.5;

  let py = i32(clamp(yo * u.imgH, 0.0, u.imgH - 1.0));

  parts[i] = vec4f(normalize(pt.xyz + vel), pt.w);
