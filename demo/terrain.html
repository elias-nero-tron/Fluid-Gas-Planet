<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clouds over Terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Vorschau "Wolken über Gelände": eigene Seite, teilt keinen Code mit dem Gasplaneten. */
  :root {
    color-scheme: dark;
    --bg: #07080b;
    --panel: rgba(16, 17, 22, 0.9);
    --line: #2a2c34;
    --text: #ece8e1;
    --muted: #9c978f;
    --accent: #e0a36a;
    --focus: #f3cf9c;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); overflow: hidden; }
  #app { height: 100%; display: grid; grid-template-columns: 1fr 330px; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hud { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; }
  .hud h1 { margin: 0; font: 600 26px/1.05 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
  .hud p { margin: 2px 0 0; font: 12px var(--mono); color: var(--muted); }
  #fps { color: var(--accent); }
  #status { position: absolute; left: 16px; right: 16px; bottom: 16px; max-width: 520px; padding: 12px 14px; background: #2a1512; border: 1px solid #7a3326; border-radius: 6px; }
  aside {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .head { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .help { position: sticky; top: 0; z-index: 1; margin: 0 0 12px; padding: 10px 12px; height: 9.5em; overflow-y: auto; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: #0d0e12; color: var(--muted); font-size: 12.5px; }
  .help b { color: var(--text); font-weight: 500; }
  .fx { display: block; margin-top: 6px; font: 11.5px/1.45 var(--mono); color: #d9c7a6; }
  h2 { margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid var(--line); font: 600 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
  .note { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding-block: 5px; }
  .row label { font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  .row-select { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  button, select { font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; cursor: pointer; }
  select { width: 100%; }
  #lang { font: 600 12px var(--mono); letter-spacing: 0.08em; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--muted); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .help { height: 7.5em; }
  }
</style>

<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Real-time preview: clouds forming over terrain"></canvas>
    <div class="hud">
      <h1 id="t-title">Clouds over Terrain</h1>
      <p><span id="fps">– fps</span> · <span id="t-hint">drag to rotate, scroll or pinch to zoom</span></p>
    </div>
    <div id="status" hidden></div>
  </div>
  <aside>
    <div class="head"><button id="lang" type="button">DE</button></div>
    <p class="help" id="help"></p>
    <div id="controls"></div>
    <p class="note" id="t-foot"></p>
  </aside>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Vorschau: Wolken, die aus dem Gelände entstehen (orographische Hebung).
// Idee von elias-nero-tron: Kontinente unter der Atmosphäre. Diese Seite ist eine eigene
// Schiene und teilt keinen Code mit dem Gasplaneten. Status: nur im Software-Renderer geprüft.
//
// Physik in einem Satz: Wind, der einen Hang hinaufweht, hebt Luft an, sie kühlt ab, Wasserdampf
// kondensiert: w = u · ∇h. Wolken liegen wirklich in einer Höhe über dem Boden (eigene Kugelschale),
// deshalb verschieben sie sich beim Drehen gegen das Gelände (Parallaxe) und werfen versetzte Schatten.
// ---------------------------------------------------------------------------

let lang = (() => { try { const v = localStorage.getItem('fgp-lang'); if (v === 'de' || v === 'en') return v; } catch {} return (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en'; })();
const t = (de, en) => (lang === 'de' ? de : en);

const S = { world: 0, cover: 0.35, orog: 1.0, hood: 0.6, wind: 1.0, height: 0.02, relief: 1.0, sun: 40, spin: 1, speed: 1 };
const DEF = { ...S };

const controls = () => [
  ['world', t('Welt', 'World'), 'select', [[0, t('Mars-ähnlich (trocken)', 'Mars-like (dry)')], [1, t('Ozeanwelt (erfunden)', 'Ocean world (fictional)')]],
    t('Mars-ähnlich: Vulkane, Tiefebenen im Norden, ein großes Becken, ein Canyon, Polkappen. Ozeanwelt: erfundene Kontinente mit Meer, mehr Feuchte.',
      'Mars-like: volcanoes, northern lowlands, a big basin, a canyon, polar caps. Ocean world: made-up continents with sea, more moisture.')],
  ['cover', t('Grundbewölkung', 'Base cover'), 0, 1, 0.01, t('Wolken, die überall aus Feuchte und Turbulenz entstehen, unabhängig vom Gelände.', 'Clouds that form everywhere from moisture and turbulence, independent of terrain.'),
    'd = smoothstep(0,45, 0,75, Deckung·Rauschen + Hebung + Pol)'],
  ['orog', t('Hebungswolken', 'Lift clouds'), 0, 3, 0.01,
    t('Orographische Wolken: wo der Wind einen Hang hinaufweht, steigt Luft auf und kondensiert. Sie hängen an der Luvseite von Bergen und Vulkanen und ziehen leewärts ab.',
      'Orographic clouds: where wind blows up a slope, air rises and condenses. They cling to the windward side of mountains and volcanoes and trail off downwind.'),
    'w = max(0, u·∇h),  Hebung = k·w(p − u·τ)'],
  ['hood', t('Polhaube', 'Polar hood'), 0, 2, 0.01, t('Wolkenhaube über den kalten Polen (wie die Polhaube auf dem Mars im Winter).', 'Cloud hood over the cold poles (like the Martian polar hood in winter).')],
  ['wind', t('Wind', 'Wind'), 0, 3, 0.01, t('Stärke der Ost-West-Winde. Sie tragen die Wolken und bestimmen, auf welcher Bergseite gehoben wird.', 'Strength of east–west winds. They carry the clouds and decide which side of a mountain gets lifted.'),
    'u(φ) = U·(cos 3φ − 0,3)·ê_Ost'],
  ['height', t('Wolkenhöhe', 'Cloud height'), 0, 0.08, 0.001,
    t('Abstand der Wolkenschicht vom Boden (in Planetenradien). Das ist echte Höhe: Die Wolken verschieben sich beim Drehen gegen den Boden, ihre Schatten fallen versetzt. (Mars: ~0,01, übertrieben für die Sichtbarkeit.)',
      'Distance of the cloud layer above the ground (in planet radii). This is real height: clouds shift against the ground when you rotate, their shadows fall offset. (Mars: ~0.01, exaggerated for visibility.)'),
    'r_Wolke = 1 + H'],
  ['relief', 'Relief', 0, 3, 0.01, t('Überhöhung des Geländes für Licht und Hebung.', 'Exaggeration of the terrain for lighting and lift.')],
  ['sun', t('Sonnenstand', 'Sun angle'), -180, 180, 1, t('Flacher Sonnenstand zeigt Schatten und Relief am besten.', 'A low sun shows shadows and relief best.')],
  ['spin', t('Drehung', 'Spin'), 0, 4, 0.05, t('Sichtbare Eigendrehung.', 'Visible spin.')],
  ['speed', t('Zeitraffer', 'Time lapse'), 0, 6, 0.05, t('Wie schnell Wind und Wolken sich entwickeln.', 'How fast wind and clouds evolve.')],
];

const help = document.getElementById('help');
function buildUI() {
  const box = document.getElementById('controls');
  box.innerHTML = '';
  const h2 = document.createElement('h2'); h2.textContent = t('Vorschau', 'Preview'); box.append(h2);
  const note = document.createElement('p'); note.className = 'note';
  note.textContent = t('Wolken entstehen hier aus Gelände und Wind, nicht aus einer Bilddatei. Eigene Schiene, getrennt vom Gasplaneten.',
    'Clouds form here from terrain and wind, not from an image. A separate track, apart from the gas giant.');
  box.append(note);
  for (const [key, label, a, b, c, d, f] of controls()) {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.textContent = label; lab.htmlFor = 'c-' + key;
    const hint = a === 'select' ? c : d;
    const formula = a === 'select' ? null : f;
    const show = () => { help.innerHTML = `<b>${label}.</b> ${hint}${formula ? `<code class="fx">${formula}</code>` : ''}`; };
    row.addEventListener('pointerenter', show); row.addEventListener('focusin', show);
    lab.addEventListener('dblclick', () => { S[key] = DEF[key]; buildUI(); });
    if (a === 'select') {
      row.classList.add('row-select');
      const sel = document.createElement('select'); sel.id = 'c-' + key;
      for (const [v, txt] of b) { const o = document.createElement('option'); o.value = v; o.textContent = txt; sel.append(o); }
      sel.value = String(S[key]);
      sel.addEventListener('change', () => { S[key] = Number(sel.value); applyWorld(); buildUI(); });
      row.append(lab, sel);
    } else {
      const out = document.createElement('output');
      const inp = document.createElement('input'); inp.type = 'range'; inp.id = 'c-' + key; inp.min = a; inp.max = b; inp.step = c; inp.value = S[key];
      out.textContent = Number(S[key]).toFixed(c < 0.01 ? 3 : 2);
      inp.addEventListener('input', () => { S[key] = Number(inp.value); out.textContent = Number(inp.value).toFixed(c < 0.01 ? 3 : 2); });
      row.append(lab, out, inp);
    }
    box.append(row);
  }
  help.innerHTML = t('Fahre über einen Regler, um zu sehen, was er bewirkt und welche Formel dahintersteht.', 'Hover a control to see what it does and which formula is behind it.');
  document.getElementById('t-title').textContent = t('Wolken über Gelände', 'Clouds over Terrain');
  document.getElementById('t-hint').textContent = t('ziehen zum Drehen, Mausrad oder zwei Finger zum Zoomen', 'drag to rotate, scroll or pinch to zoom');
  document.getElementById('t-foot').innerHTML = t(
    'Vorschau aus <a href="https://github.com/elias-nero-tron/Fluid-Gas-Planet">Fluid Gas Planet</a>, Idee: elias-nero-tron. Status: ungeprüft auf echter Hardware.',
    'Preview from <a href="https://github.com/elias-nero-tron/Fluid-Gas-Planet">Fluid Gas Planet</a>, idea: elias-nero-tron. Status: not yet verified on real hardware.');
  document.getElementById('lang').textContent = lang === 'de' ? 'EN' : 'DE';
  document.documentElement.lang = lang;
}
function applyWorld() {
  if (S.world === 1) Object.assign(S, { cover: 0.5, orog: 1.2, hood: 0.3, height: 0.015 });
  else Object.assign(S, { cover: 0.35, orog: 1.0, hood: 0.6, height: 0.02 });
}
document.getElementById('lang').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; try { localStorage.setItem('fgp-lang', lang); } catch {} buildUI(); });
buildUI();

const WGSL = /* wgsl */`
struct U { inv: mat4x4f, cam: vec4f, sun: vec4f, a: vec4f, b: vec4f, rot: vec4f };
// a: x Zeit, y Welt, z Grundbewölkung, w Hebungswolken
// b: x Polhaube, y Wind, z Wolkenhöhe, w Relief
// rot: x cos, y sin der Eigendrehung
@group(0) @binding(0) var<uniform> u: U;

struct VO { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let xy = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  return VO(vec4f(xy, 0.0, 1.0), xy);
}

fn hash(p: vec3f) -> f32 {
  var q = fract(p * 0.3183099 + vec3f(0.71, 0.113, 0.419));
  q *= 17.0;
  return fract(q.x * q.y * q.z * (q.x + q.y + q.z));
}
// Wertrauschen, glatt interpoliert
fn noise(x: vec3f) -> f32 {
  let i = floor(x); let f = fract(x);
  let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3f(1, 0, 0)), w.x), mix(hash(i + vec3f(0, 1, 0)), hash(i + vec3f(1, 1, 0)), w.x), w.y),
             mix(mix(hash(i + vec3f(0, 0, 1)), hash(i + vec3f(1, 0, 1)), w.x), mix(hash(i + vec3f(0, 1, 1)), hash(i + vec3f(1, 1, 1)), w.x), w.y), w.z) * 2.0 - 1.0;
}
fn fbm(p: vec3f, oct: i32) -> f32 {
  var s = 0.0; var a = 0.5; var q = p;
  for (var i = 0; i < oct; i++) { s += a * noise(q); q = q * 2.03 + vec3f(1.7, 9.2, 3.1); a *= 0.5; }
  return s;
}
fn dome(p: vec3f, c: vec3f, r: f32) -> f32 { let d = acos(clamp(dot(p, normalize(c)), -1.0, 1.0)) / r; return exp(-d * d); }

// Geländehöhe (Einheit: willkürlich, ~ −1..2)
fn height(p: vec3f, oct: i32) -> f32 {
  if (u.a.y > 0.5) {
    // Ozeanwelt: Kontinente aus niederfrequentem Rauschen, Meeresspiegel 0
    return fbm(p * 1.6 + vec3f(4.0), oct) * 1.6 + 0.08 + 0.5 * max(fbm(p * 5.0, 3), 0.0) * smoothstep(0.0, 0.3, fbm(p * 1.6 + vec3f(4.0), 3));
  }
  // Mars-ähnlich: Hochland im Süden, Tiefebene im Norden, Vulkane, Becken, Canyon
  var h = fbm(p * 2.2, oct) * 0.5;
  h += 0.45 * (1.0 - smoothstep(-0.35, 0.25, p.y + 0.25 * fbm(p * 1.3, 3)));
  h += 1.8 * dome(p, vec3f(-0.35, 0.33, 0.87), 0.12);            // großer Schildvulkan
  h += 0.9 * dome(p, vec3f(-0.15, 0.05, 0.99), 0.07);            // Vulkankette
  h += 0.9 * dome(p, vec3f(-0.05, -0.03, 1.0), 0.07);
  h += 0.9 * dome(p, vec3f(0.05, -0.12, 0.99), 0.07);
  let hb = dome(p, vec3f(0.6, -0.7, -0.4), 0.28);                   // großes Einschlagbecken mit Rand
  h += -1.1 * hb + 0.35 * dome(p, vec3f(0.6, -0.7, -0.4), 0.38) * (1.0 - hb);
  // Canyon: Rinne entlang des Äquators über ~60° Länge
  let lon = atan2(p.x, p.z);
  let cy = (p.y + 0.12) / 0.02;
  h -= 0.8 * exp(-cy * cy) * smoothstep(0.0, 0.15, lon - 0.2) * smoothstep(1.3, 1.1, lon);
  return h;
}

fn east(p: vec3f) -> vec3f { let e = cross(vec3f(0, 1, 0), p); let l = length(e); return select(vec3f(1, 0, 0), e / l, l > 1e-4); }
fn windU(p: vec3f) -> f32 { let lat = asin(clamp(p.y, -1.0, 1.0)); return u.b.y * (cos(3.0 * lat) - 0.3) * 0.12; }

// Punkt um die Polachse drehen (Wind = Drehung um die Achse, abhängig von der Breite)
fn advectBack(p: vec3f, ang: f32) -> vec3f { let c = cos(ang); let s = sin(ang); return vec3f(c * p.x - s * p.z, p.y, s * p.x + c * p.z); }

fn gradH(p: vec3f, oct: i32) -> vec3f {
  let e1 = east(p); let e2 = cross(p, e1); let eps = 0.004;
  let gx = height(normalize(p + e1 * eps), oct) - height(normalize(p - e1 * eps), oct);
  let gy = height(normalize(p + e2 * eps), oct) - height(normalize(p - e2 * eps), oct);
  return (e1 * gx + e2 * gy) / (2.0 * eps);
}

// Wolkendichte auf der Wolkenschale. Zwei Phasen, die versetzt neu starten und überblenden
// (Neyret 2003): so wird das Rauschen vom Wind mitgenommen, ohne sich endlos zu verzerren.
fn cloud(p: vec3f) -> f32 {
  let T = 24.0;
  let tt = u.a.x;
  let U0 = windU(p) / max(sqrt(1.0 - p.y * p.y), 0.2);
  var base = 0.0;
  for (var k = 0; k < 2; k++) {
    let ph = fract(tt / T + f32(k) * 0.5);
    let w = 1.0 - abs(2.0 * ph - 1.0);
    let q = advectBack(p, -U0 * ph * T);
    base += w * (fbm(q * 5.0 + vec3f(f32(k) * 31.0, 0.0, 0.0), 5) * 0.5 + 0.5);
  }
  // Hebung: am Hang, wo der Wind bergauf weht; etwas stromab versetzt (Kondensation braucht Zeit).
  let up = advectBack(p, U0 * 1.5);
  let lift = max(0.0, dot(east(up) * windU(up), gradH(up, 3))) * u.b.w;
  let lat = abs(p.y);
  let pole = u.b.x * smoothstep(0.55, 0.85, lat) * (0.6 + 0.4 * noise(p * 9.0 + vec3f(tt * 0.05)));
  let wet = select(1.0, 1.4, u.a.y > 0.5);
  let d = u.a.z * base * wet + u.a.w * lift * 2.2 * (0.6 + 0.8 * base) + pole;
  return smoothstep(0.45, 0.75, d);
}

fn sphere(o: vec3f, d: vec3f, r: f32) -> vec2f {
  let b = dot(o, d); let c = dot(o, o) - r * r; let h = b * b - c;
  if (h < 0.0) { return vec2f(-1.0); }
  let s = sqrt(h); return vec2f(-b - s, -b + s);
}

fn toBody(v: vec3f) -> vec3f { return vec3f(u.rot.x * v.x + u.rot.y * v.z, v.y, -u.rot.y * v.x + u.rot.x * v.z); }

fn groundColor(p: vec3f, h: f32) -> vec3f {
  let lat = abs(p.y);
  if (u.a.y > 0.5) {
    if (h < 0.0) { return mix(vec3f(0.01, 0.05, 0.12), vec3f(0.02, 0.12, 0.2), smoothstep(-0.5, 0.0, h)); }
    var c = mix(vec3f(0.12, 0.2, 0.06), vec3f(0.35, 0.28, 0.16), smoothstep(0.1, 0.6, h + 0.3 * (1.0 - lat)));
    c = mix(c, vec3f(0.85), smoothstep(0.75, 0.9, lat + h * 0.15));
    return c;
  }
  var c = mix(vec3f(0.36, 0.14, 0.06), vec3f(0.62, 0.36, 0.2), smoothstep(-0.4, 0.6, h + 0.2 * fbm(p * 12.0, 3)));
  c = mix(c, vec3f(0.22, 0.12, 0.08), smoothstep(0.1, 0.5, fbm(p * 3.5 + vec3f(5.0), 3)) * 0.6);
  c = mix(c, vec3f(0.9, 0.88, 0.86), smoothstep(0.9, 0.95, lat + 0.03 * fbm(p * 20.0, 2)));
  return c;
}

@fragment fn fs(v: VO) -> @location(0) vec4f {
  let wp = u.inv * vec4f(v.ndc, 1.0, 1.0);
  let dw = normalize(wp.xyz / wp.w - u.cam.xyz);
  let o = toBody(u.cam.xyz); let d = toBody(dw); let sun = toBody(normalize(u.sun.xyz));
  let rc = 1.0 + u.b.z;
  var col = vec3f(0.0);
  // Sterne
  let sp = floor(dw * 300.0);
  col += vec3f(0.8, 0.85, 1.0) * step(0.9985, hash(sp)) * 0.8;

  let hg = sphere(o, d, 1.0);
  let hc = sphere(o, d, rc);
  var cloudA = 0.0; var cloudC = vec3f(0.0);
  if (hc.x > 0.0) {
    // Wolkenschale vor dem Boden
    let pc = normalize(o + d * hc.x);
    cloudA = cloud(pc);
    let ndl = dot(pc, sun);
    let lit = smoothstep(-0.15, 0.4, ndl);
    let wc = select(vec3f(0.95, 0.92, 0.9), vec3f(0.97, 0.98, 1.0), u.a.y > 0.5);
    cloudC = wc * (0.12 + 0.95 * lit);
  }
  if (hg.x > 0.0) {
    let p = normalize(o + d * hg.x);
    let h = height(p, 7);
    let g = gradH(p, 6);
    var n = normalize(p - g * 0.06 * u.b.w);
    var alb = groundColor(p, h);
    var spec = 0.0;
    if (u.a.y > 0.5 && h < 0.0) {
      n = p;
      let hv = normalize(sun - d);
      spec = pow(max(dot(n, hv), 0.0), 120.0) * 0.8;
    }
    var light = max(dot(n, sun), 0.0);
    // Wolkenschatten: dort, wo der Sonnenstrahl vom Boden die Wolkenschale trifft
    let hs = sphere(p, sun, rc);
    if (hs.y > 0.0 && dot(p, sun) > -0.1) { light *= 1.0 - 0.75 * cloud(normalize(p + sun * hs.y)); }
    col = alb * light * 1.6 + vec3f(spec) * light;
    // dünner Dunst in Blickrichtung
    let haze = select(vec3f(0.55, 0.35, 0.22), vec3f(0.35, 0.55, 0.9), u.a.y > 0.5);
    let mu = max(dot(-d, p), 0.0);
    col = mix(col, haze * smoothstep(-0.2, 0.5, dot(p, sun)), pow(1.0 - mu, 4.0) * 0.5);
  }
  if (hc.x > 0.0) { col = mix(col, cloudC, cloudA * 0.92); }
  // Atmosphärensaum
  let tc = max(-dot(o, d), 0.0);
  let cp = o + d * tc;
  let alt = length(cp) - 1.0;
  if (hg.x < 0.0) {
    let rim = select(vec3f(0.85, 0.5, 0.3), vec3f(0.35, 0.6, 1.0), u.a.y > 0.5);
    col += rim * exp(-max(alt, 0.0) / 0.03) * smoothstep(-0.3, 0.4, dot(normalize(cp), sun)) * 0.8;
  }
  let x = col * 1.1;
  let m = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
  return vec4f(pow(m, vec3f(1.0 / 2.2)), 1.0);
}
`;

const canvas = document.getElementById('view');
const statusEl = document.getElementById('status');
const fail = (m) => { statusEl.hidden = false; statusEl.innerHTML = m; };

// Kleine Matrizen-Helfer (spaltenweise, wie WGSL)
function perspective(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2); return [t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, f / (n - f), -1, 0, 0, (n * f) / (n - f), 0]; }
function lookAt(e, c, up) {
  const z = norm(sub(e, c)), x = norm(cross(up, z)), y = cross(z, x);
  return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, e), -dot(y, e), -dot(z, e), 1];
}
function mul(a, b) { const o = new Array(16).fill(0); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k]; return o; }
function inv(m) {
  const a = m, o = new Array(16);
  o[0] = a[5]*a[10]*a[15]-a[5]*a[11]*a[14]-a[9]*a[6]*a[15]+a[9]*a[7]*a[14]+a[13]*a[6]*a[11]-a[13]*a[7]*a[10];
  o[4] = -a[4]*a[10]*a[15]+a[4]*a[11]*a[14]+a[8]*a[6]*a[15]-a[8]*a[7]*a[14]-a[12]*a[6]*a[11]+a[12]*a[7]*a[10];
  o[8] = a[4]*a[9]*a[15]-a[4]*a[11]*a[13]-a[8]*a[5]*a[15]+a[8]*a[7]*a[13]+a[12]*a[5]*a[11]-a[12]*a[7]*a[9];
  o[12] = -a[4]*a[9]*a[14]+a[4]*a[10]*a[13]+a[8]*a[5]*a[14]-a[8]*a[6]*a[13]-a[12]*a[5]*a[10]+a[12]*a[6]*a[9];
  o[1] = -a[1]*a[10]*a[15]+a[1]*a[11]*a[14]+a[9]*a[2]*a[15]-a[9]*a[3]*a[14]-a[13]*a[2]*a[11]+a[13]*a[3]*a[10];
  o[5] = a[0]*a[10]*a[15]-a[0]*a[11]*a[14]-a[8]*a[2]*a[15]+a[8]*a[3]*a[14]+a[12]*a[2]*a[11]-a[12]*a[3]*a[10];
  o[9] = -a[0]*a[9]*a[15]+a[0]*a[11]*a[13]+a[8]*a[1]*a[15]-a[8]*a[3]*a[13]-a[12]*a[1]*a[11]+a[12]*a[3]*a[9];
  o[13] = a[0]*a[9]*a[14]-a[0]*a[10]*a[13]-a[8]*a[1]*a[14]+a[8]*a[2]*a[13]+a[12]*a[1]*a[10]-a[12]*a[2]*a[9];
  o[2] = a[1]*a[6]*a[15]-a[1]*a[7]*a[14]-a[5]*a[2]*a[15]+a[5]*a[3]*a[14]+a[13]*a[2]*a[7]-a[13]*a[3]*a[6];
  o[6] = -a[0]*a[6]*a[15]+a[0]*a[7]*a[14]+a[4]*a[2]*a[15]-a[4]*a[3]*a[14]-a[12]*a[2]*a[7]+a[12]*a[3]*a[6];
  o[10] = a[0]*a[5]*a[15]-a[0]*a[7]*a[13]-a[4]*a[1]*a[15]+a[4]*a[3]*a[13]+a[12]*a[1]*a[7]-a[12]*a[3]*a[5];
  o[14] = -a[0]*a[5]*a[14]+a[0]*a[6]*a[13]+a[4]*a[1]*a[14]-a[4]*a[2]*a[13]-a[12]*a[1]*a[6]+a[12]*a[2]*a[5];
  o[3] = -a[1]*a[6]*a[11]+a[1]*a[7]*a[10]+a[5]*a[2]*a[11]-a[5]*a[3]*a[10]-a[9]*a[2]*a[7]+a[9]*a[3]*a[6];
  o[7] = a[0]*a[6]*a[11]-a[0]*a[7]*a[10]-a[4]*a[2]*a[11]+a[4]*a[3]*a[10]+a[8]*a[2]*a[7]-a[8]*a[3]*a[6];
  o[11] = -a[0]*a[5]*a[11]+a[0]*a[7]*a[9]+a[4]*a[1]*a[11]-a[4]*a[3]*a[9]-a[8]*a[1]*a[7]+a[8]*a[3]*a[5];
  o[15] = a[0]*a[5]*a[10]-a[0]*a[6]*a[9]-a[4]*a[1]*a[10]+a[4]*a[2]*a[9]+a[8]*a[1]*a[6]-a[8]*a[2]*a[5];
  const det = a[0]*o[0]+a[1]*o[4]+a[2]*o[8]+a[3]*o[12];
  return o.map((x) => x / det);
}
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(...a) || 1; return a.map((x) => x / l); };

async function start() {
  if (!navigator.gpu) { fail(t('<b>WebGPU fehlt in diesem Browser.</b> Nimm Chrome oder Edge ab 113, Safari ab 26 oder Firefox ab 141.', '<b>This browser has no WebGPU.</b> Use Chrome or Edge 113+, Safari 26+ or Firefox 141+.')); return; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { fail(t('<b>Keine WebGPU-Grafikkarte gefunden.</b>', '<b>No WebGPU graphics adapter found.</b>')); return; }
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  const module = device.createShaderModule({ code: WGSL });
  module.getCompilationInfo().then((i) => { const e = i.messages.filter((m) => m.type === 'error'); if (e.length) fail('<b>Shader:</b> ' + e.map((m) => `${m.lineNum}: ${m.message}`).join('<br>')); });
  const pipe = device.createRenderPipeline({ layout: 'auto', vertex: { module, entryPoint: 'vs' }, fragment: { module, entryPoint: 'fs', targets: [{ format }] } });
  const ubuf = device.createBuffer({ size: 16 * 4 + 5 * 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bg = device.createBindGroup({ layout: pipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubuf } }] });

  const cam = { yaw: 0.35, pitch: 0.25, dist: 3.2 };
  const ptrs = new Map(); let pinch = 0;
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); });
  const end = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) cam.dist = Math.min(8, Math.max(1.15, cam.dist * pinch / dd)); pinch = dd; return; }
    cam.yaw -= (e.clientX - p[0]) * 0.006; cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + (e.clientY - p[1]) * 0.006));
  });
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); cam.dist = Math.min(8, Math.max(1.15, cam.dist * Math.exp(e.deltaY * 0.001))); }, { passive: false });

  let time = 0, spin = 0, last = performance.now(), acc = 0, frames = 0;
  const data = new Float32Array(16 + 20);
  const frame = (now) => {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    acc += dt; frames++;
    if (acc > 0.5) { document.getElementById('fps').textContent = `${Math.round(frames / acc)} fps`; acc = 0; frames = 0; }
    time += dt * S.speed; spin += dt * 0.05 * S.spin;
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    const cy = Math.cos(cam.pitch);
    const eye = [Math.sin(cam.yaw) * cy * cam.dist, Math.sin(cam.pitch) * cam.dist, Math.cos(cam.yaw) * cy * cam.dist];
    const m = inv(mul(perspective(0.6, w / h, 0.02, 50), lookAt(eye, [0, 0, 0], [0, 1, 0])));
    const a = (S.sun * Math.PI) / 180;
    data.set(m, 0);
    data.set([...eye, 1, Math.sin(a), 0.25, Math.cos(a), 0, time, S.world, S.cover, S.orog, S.hood, S.wind, S.height, S.relief, Math.cos(spin), Math.sin(spin), 0, 0], 16);
    device.queue.writeBuffer(ubuf, 0, data);
    const enc = device.createCommandEncoder();
    const rp = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    rp.setPipeline(pipe); rp.setBindGroup(0, bg); rp.draw(3); rp.end();
    device.queue.submit([enc.finish()]);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
start().catch((e) => fail(String(e)));
</script>
