<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volcano Planet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Vulkanplanet: eigene Seite, teilt keinen Code mit dem Gasplaneten. */
  :root {
    color-scheme: dark;
    --bg: #050608;
    --panel: rgba(14, 15, 19, 0.92);
    --line: #2a2c34;
    --text: #ece8e1;
    --muted: #9c978f;
    --accent: #ec8f4e;
    --focus: #f3cf9c;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); overflow: hidden; }
  #app { height: 100%; display: grid; grid-template-columns: 1fr 340px; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hud { position: absolute; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); pointer-events: none; text-shadow: 0 1px 3px #000; }
  .hud h1 { margin: 0; font: 600 26px/1.05 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
  .hud p { margin: 2px 0 0; font: 12px var(--mono); color: var(--muted); }
  #fps { color: var(--accent); }
  #busy { position: absolute; left: 16px; bottom: 16px; font: 12px var(--mono); color: var(--accent); pointer-events: none; }
  #status { position: absolute; left: 16px; right: 16px; bottom: 16px; max-width: 560px; padding: 12px 14px; background: #2a1512; border: 1px solid #7a3326; border-radius: 6px; }
  aside {
    background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
    padding-inline: 16px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  }
  .head { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .help { position: sticky; top: 0; z-index: 1; margin: 0 0 12px; padding: 10px 12px; height: 9.5em; overflow-y: auto; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: #0b0c10; color: var(--muted); font-size: 12.5px; }
  .help b { color: var(--text); font-weight: 500; }
  .fx { display: block; margin-top: 6px; font: 11.5px/1.45 var(--mono); color: #e3c29a; }
  h2 { margin: 14px 0 4px; padding-top: 10px; border-top: 1px solid var(--line); font: 600 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase; }
  .note { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; padding-block: 5px; }
  .row label { font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  .row input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .row-select { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
  .seed { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
  .seed input { min-width: 0; font: 13px var(--mono); color: var(--text); background: #1b1c22; border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button, select { font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; cursor: pointer; }
  button.hot { border-color: #8a4a22; background: #2b1a10; }
  select { width: 100%; }
  #lang { font: 600 12px var(--mono); letter-spacing: 0.08em; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  a { color: var(--muted); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 58% 42%; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    .help { height: 7.5em; }
  }
</style>

<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Real-time view: procedural planet with volcanoes pumping ash into a 3D atmosphere"></canvas>
    <div class="hud">
      <h1 id="t-title">Volcano Planet</h1>
      <p><span id="fps">– fps</span> · <span id="facts"></span></p>
      <p id="t-hint">drag to rotate, scroll or pinch to zoom</p>
    </div>
    <div id="busy"></div>
    <div id="status" hidden></div>
  </div>
  <aside>
    <div class="head"><span id="ver" class="note"></span><button id="lang" type="button">DE</button></div>
    <p class="help" id="help"></p>
    <div id="controls"></div>
    <p class="note" id="t-foot"></p>
  </aside>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// Vulkanplanet: hochaufgelöster Zufallsplanet + Vulkane, die Asche in eine echte 3D-Atmosphäre pumpen.
// Idee und Vorgaben: elias-nero-tron. Eigene Schiene, teilt keinen Code mit dem Gasplaneten.
//
// Was hier gerechnet wird (alles WebGPU, keine Bilddateien):
//  1. Gelände: 3D-Gradientenrauschen mit analytischen Ableitungen, Domain Warping, Erosions-fBm
//     (Oktaven gedämpft durch den aufsummierten Gradienten), Ridged Multifractal (Musgrave) für Gebirge.
//     Einmal in eine Würfelkarte gebacken (bis 4096² pro Seite, mit Mipmaps), Biome aus Temperatur × Feuchte.
//  2. Vulkane: analytisch beim Zeichnen (Kegel, Krater, Caldera), dadurch scharf bei jedem Zoom.
//  3. Eruptionssäule: Mastin (2009) H = 2,00·V^0,241 km, Auftriebsstrahl-Theorie (Morton, Taylor & Turner 1956)
//     b = b₀ + 6/5·α·z, vertikale Massenverteilung nach Suzuki (1983), vom Wind geneigt (bent-over plume).
//  4. Schirmwolke: Schwerestrom auf der Höhe neutralen Auftriebs, R(t) ∝ t^(2/3) (Woods & Kienle 1994),
//     Volumenstrom nach Costa et al. (2013). Daraus eine radiale Ausbreitungsgeschwindigkeit.
//  5. Transport: 3D-Gitter (Länge × Breite × Höhe) über der ganzen Kugel, semi-Lagrange-Advektion mit
//     Wind aus Zirkulationszellen, thermischem Wind (Scherung bis zur Tropopause), Stratosphären-Ostwind,
//     divergenzfreien Wirbeln (Curl einer Stromfunktion) und einem frei drehbaren Grundwind.
//     Grobe Asche sinkt schnell, feine Asche/Sulfat bleibt lange: Schichten entstehen durch Scherung.
//  6. Licht: Raymarching mit Beer–Lambert, Rayleigh + Mie (Chapman-Näherung nach Schüler 2012 für den
//     Sonnenweg), Henyey–Greenstein, Powder-Term, Mehrfachstreuung nach Wrenninge (2013), Ascheschatten,
//     Glut von unten. Feinstruktur über zweiphasiges Fließrauschen (Neyret 2003).
// Status: nur im Software-Renderer geprüft.
// ---------------------------------------------------------------------------

let lang = (() => { try { const v = localStorage.getItem('fgp-lang'); if (v === 'de' || v === 'en') return v; } catch {} return (navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en'; })();
const t = (de, en) => (lang === 'de' ? de : en);
const Q = new URLSearchParams(location.search);
const H = new URLSearchParams(location.hash.slice(1));
const OFFSCREEN = H.has('offscreen');

const S = {
  seed: Number(Q.get('seed')) || 12567890, res: 2048, style: 0, sea: 0.0, cont: 1.3, warp: 0.9, mount: 0.55, erosion: 1.2, relief: 1.0, climate: 0.0, moist: 0.0,
  radius: 6371, atm: 100, exag: 4,
  vCount: 12, vSize: 50, vMer: 8.2, vAct: 0.55, vSeed: 1,
  sCount: 1, sSize: 60, sMer: 9.7, superOn: true,
  windU: 20, circ: 1.0, shear: 1.0, strat: 0.6, turb: 0.5, preU: 8, preDir: 30,
  fallC: 0.4, lifeF: 10, kappa: 1.0, detail: 1.0, grid: 1, warm: 12,
  lapse: 1800, spin: 1.0, sunAz: 115, sunEl: 12, exposure: 0.7, nebula: 1.0, stars: 1.0, glow: 1.0,
  steps: 96, scale: 1.0, tilt: 0, debug: 0, auto: true,
};
const DEF = { ...S };
// Werte auch über die Adresse: #res=1024&vCount=20 (für Tests und Links)
for (const [k, v] of H) if (k in S && k !== 'seed') S[k] = typeof S[k] === 'boolean' ? v === 'true' : Number(v);
const GRIDS = [[256, 128, 24], [512, 256, 40], [768, 384, 48], [1024, 512, 64]];

// ---------------------------------------------------------------------------
// Regler. Jede Zeile: [Schlüssel, Name, min, max, Schritt, Erklärung, Formel, schwer?]
// „schwer“ = wird erst beim Loslassen angewandt (Neu-Backen, Neu-Anlegen).
// ---------------------------------------------------------------------------
const fmtKm = (v) => (v >= 100 ? Math.round(v) : v.toFixed(v < 10 ? 1 : 0)) + ' km';
const pct = (km) => ((km / S.radius) * 100).toFixed(km / S.radius < 0.01 ? 2 : 1) + ' % R';
const merTxt = (lg) => `10^${lg.toFixed(1)} kg/s · H≈${plumeHeight(10 ** lg).toFixed(0)} km`;
const lapseTxt = (v) => (v >= 3600 ? (v / 3600).toFixed(v >= 36000 ? 0 : 1) + ' h/s' : Math.round(v / 60) + ' min/s');
const sections = () => [
  [t('Planet', 'Planet'), t('Gelände wird einmal in eine Würfelkarte gebacken. Änderungen hier backen neu, sobald du loslässt.', 'Terrain is baked once into a cube map. Changes here re-bake when you let go.'), [
    ['res', t('Auflösung', 'Resolution'), 'select', [[512, '512² × 6'], [1024, '1024² × 6'], [2048, '2048² × 6'], [4096, '4096² × 6']],
      t('Texel pro Würfelseite. 2048 ≈ 5 km pro Texel bei Erdgröße, 4096 ≈ 2,5 km (braucht ~0,8 GB Grafikspeicher). Oktaven wachsen mit: log₂N + 2.',
        'Texels per cube face. 2048 ≈ 5 km per texel at Earth size, 4096 ≈ 2.5 km (needs ~0.8 GB of GPU memory). Octaves grow with it: log₂N + 2.'), null, true],
    ['style', t('Farbwelt', 'Colour style'), 'select', [[0, t('Erdähnlich', 'Earth-like')], [1, t('Fremdwelt (Zufallsfarben)', 'Alien (random colours)')], [2, t('Vulkanwelt (Basalt)', 'Volcanic world (basalt)')]],
      t('Farbtabelle für Biome. Der Seed variiert die Töne.', 'Biome colour table. The seed varies the tones.'), null, true],
    ['sea', t('Meeresspiegel', 'Sea level'), -0.5, 0.5, 0.01, t('Höhe der Wasserlinie im Rauschfeld. Höher = mehr Ozean, Inseln statt Kontinente.', 'Height of the water line in the noise field. Higher = more ocean, islands instead of continents.'), 'Wasser, wo h(p) < Meeresspiegel', true],
    ['cont', t('Kontinent-Skala', 'Continent scale'), 0.4, 4, 0.01, t('Grundfrequenz des Geländes. Klein = wenige große Kontinente.', 'Base frequency of the terrain. Small = few large continents.'), 'q = p·f₀', true],
    ['warp', t('Verwirbelung', 'Domain warp'), 0, 2.5, 0.01, t('Domain Warping: die Koordinaten werden durch ein zweites Rauschfeld verschoben. Macht Küsten und Gebirgszüge organisch statt blasig.', 'Domain warping: coordinates are displaced by a second noise field. Makes coasts and ranges organic instead of blobby.'), 'h(p) = f(p + k·w(p)),  w = (fbm₁, fbm₂, fbm₃)', true],
    ['mount', t('Gebirge', 'Mountains'), 0, 1.5, 0.01, t('Ridged Multifractal (Musgrave): scharfe Grate, deren Oktaven nur dort wachsen, wo die vorige Oktave hoch war.', 'Ridged multifractal (Musgrave): sharp ridges whose octaves only grow where the previous octave was high.'), 's = (1 − |n|)²·w,  w = clamp(2s, 0, 1)', true],
    ['erosion', t('Erosion', 'Erosion'), 0, 4, 0.01, t('Oktaven werden durch den aufsummierten Gradienten gedämpft: steile Hänge bleiben glatt, Täler und Ebenen bekommen Detail, wie Abtragung.', 'Octaves are damped by the accumulated gradient: steep slopes stay smooth, valleys and plains get detail, like erosion.'), 'h += aᵢ·nᵢ / (1 + k·|Σ∇n|²)', true],
    ['climate', t('Klima', 'Climate'), -0.6, 0.6, 0.01, t('Verschiebt die Temperatur: kalt = Eis und Tundra, warm = Wüste und Dschungel.', 'Shifts temperature: cold = ice and tundra, warm = desert and jungle.'), 'T = 1 − |φ/90°|^1,3 − Γ·h + ΔT', true],
    ['moist', t('Feuchte', 'Moisture'), -0.6, 0.6, 0.01, t('Verschiebt die Feuchte (Wüste ↔ Wald). Subtropische Trockengürtel bei 30° bleiben.', 'Shifts moisture (desert ↔ forest). Subtropical dry belts at 30° remain.'), null, true],
    ['relief', 'Relief', 0, 4, 0.01, t('Überhöhung der Normalen (nur Licht, sofort).', 'Normal exaggeration (lighting only, instant).'), 'n = normalize(n·p̂ + k·n_t)'],
    ['radius', t('Planetenradius', 'Planet radius'), 1000, 20000, 10, t('Maßstab für alles in km: Vulkangrößen, Säulenhöhen und Wind beziehen sich darauf. Erde 6371 km, Mars 3390 km.', 'Scale for everything in km: volcano sizes, plume heights and wind refer to it. Earth 6371 km, Mars 3390 km.'), null, false, (v) => fmtKm(v)],
  ]],
  [t('Atmosphäre', 'Atmosphere'), null, [
    ['atm', t('Atmosphärendicke', 'Atmosphere thickness'), 20, 300, 1, t('Obergrenze der Luftschicht (Erde ~100 km, Kármán-Linie). Bestimmt die Skalenhöhe H = Dicke/11,8, damit die Schichtung N und so die Säulenhöhe: dickere Luft = schwächere Schichtung = höhere Säulen.', 'Top of the air layer (Earth ~100 km, Kármán line). Sets the scale height H = thickness/11.8, therefore stratification N and plume height: thicker air = weaker stratification = taller plumes.'), 'N ∝ H^(−1/2),  H_Säule ∝ N^(−3/4) ∝ H^(3/8)', true, (v) => fmtKm(v) + ' · ' + pct(v)],
    ['exag', t('Höhen-Überhöhung', 'Vertical exaggeration'), 1, 12, 0.1, t('Atmosphäre und Rauch werden in der Höhe gestreckt, damit man aus 1000–5000 km die 3D-Form sieht. 1 = maßstabsgetreu.', 'Atmosphere and smoke are stretched vertically so the 3D shape reads from 1000–5000 km. 1 = true scale.'), 'r = 1 + k·z/R', false, (v) => v.toFixed(1) + '×'],
  ]],
  [t('Vulkane', 'Volcanoes'), t('Kegel, Krater und Säulen werden analytisch gezeichnet, scharf bei jedem Zoom.', 'Cones, craters and columns are drawn analytically, sharp at any zoom.'), [
    ['vCount', t('Anzahl', 'Count'), 0, 48, 1, t('Normale Vulkane, per Seed verteilt. Sie brechen periodisch aus.', 'Regular volcanoes, placed by seed. They erupt periodically.'), null, true, (v) => String(v)],
    ['vSize', t('Größe (Basisradius)', 'Size (base radius)'), 5, 300, 1, t('Radius des Vulkankegels. Ätna ~20 km, Mauna Loa ~60 km, Olympus Mons ~300 km. Einzelne Vulkane streuen ×0,5–1,5.', 'Radius of the cone. Etna ~20 km, Mauna Loa ~60 km, Olympus Mons ~300 km. Individual volcanoes vary ×0.5–1.5.'), null, true, (v) => fmtKm(v) + ' · ' + pct(v)],
    ['vMer', t('Eruptionsrate', 'Eruption rate'), 5, 9.5, 0.05, t('Massenstrom (kg/s, log). Daraus die Säulenhöhe nach Mastin et al. (2009), gemessen an 34 echten Ausbrüchen.', 'Mass eruption rate (kg/s, log). Gives plume height by Mastin et al. (2009), fitted to 34 real eruptions.'), 'H = 2,00 km · (Ṁ/ρ)^0,241,  ρ = 2500 kg/m³', false, merTxt],
    ['vAct', t('Aktivität', 'Activity'), 0, 1, 0.01, t('Anteil der Zeit, in der jeder Vulkan ausbricht. Pulse von 6–48 h lösen einzelne Aschepakete ab, die der Wind wegträgt.', 'Share of time each volcano erupts. Pulses of 6–48 h shed separate ash puffs the wind carries away.'), null, false, (v) => Math.round(v * 100) + ' %'],
  ]],
  [t('Supervulkan', 'Supervolcano'), t('Caldera statt Kegel. VEI 8: > 1000 km³ Auswurf.', 'Caldera instead of a cone. VEI 8: > 1000 km³ ejecta.'), [
    ['sCount', t('Anzahl', 'Count'), 0, 4, 1, t('Supervulkane (Yellowstone, Toba, Campi Flegrei).', 'Supervolcanoes (Yellowstone, Toba, Campi Flegrei).'), null, true, (v) => String(v)],
    ['sSize', t('Caldera-Durchmesser', 'Caldera diameter'), 10, 200, 1, t('Yellowstone 70 km, Toba 100 km, Campi Flegrei 13 km. Die Säule startet mit diesem Radius.', 'Yellowstone 70 km, Toba 100 km, Campi Flegrei 13 km. The column starts with this radius.'), 'b₀ = D/4', true, (v) => fmtKm(v) + ' · ' + pct(v)],
    ['sMer', t('Eruptionsrate', 'Eruption rate'), 8, 11, 0.05, t('Pinatubo 1991: ~10⁹ kg/s. Toba: ~10¹⁰–10¹¹ kg/s. Die Säule ist durch die Atmosphärendicke begrenzt.', 'Pinatubo 1991: ~10⁹ kg/s. Toba: ~10¹⁰–10¹¹ kg/s. The column is capped by the atmosphere thickness.'), 'H = 2,00·V^0,241·(H_s/8,5 km)^(3/8)', false, merTxt],
  ]],
  [t('Wind', 'Wind'), t('Bestimmt, wohin die Asche zieht. Oben und unten weht es verschieden: daraus entstehen Schichten.', 'Decides where the ash goes. It blows differently high and low: that makes the layers.'), [
    ['windU', t('Zirkulation', 'Circulation'), 0, 60, 0.5, t('Globale Zellen: Passat (Ost) am Äquator, Westwinde bei 45°, polare Ostwinde, Hadley-Rückstrom. Der Jet nimmt bis zur Tropopause zu.', 'Global cells: trade winds (easterly) at the equator, westerlies at 45°, polar easterlies, Hadley return flow. The jet grows up to the tropopause.'), 'u(φ,z) = U·(−0,4 + 1,4·e^(−((|φ|−45°)/15°)²) + 2s·jet·z/z_T)', false, (v) => v.toFixed(0) + ' m/s'],
    ['shear', t('Höhenscherung', 'Vertical shear'), 0, 3, 0.01, t('Thermischer Wind: der Westwind wird mit der Höhe stärker. Säulen neigen sich, Schichten reißen auseinander.', 'Thermal wind: westerlies strengthen with height. Columns lean, layers tear apart.'), '∂u/∂z = −(g/fT)·∂T/∂y'],
    ['strat', t('Stratosphären-Ostwind', 'Stratospheric easterly'), 0, 1.5, 0.01, t('Über der Tropopause dreht der Wind auf Ost (wie Pinatubos Wolke, die in 3 Wochen westwärts um die Erde zog). Oberer Schirm und unterer Rauch ziehen gegeneinander.', 'Above the tropopause the wind turns easterly (like Pinatubo’s cloud, which circled the Earth westward in 3 weeks). Upper umbrella and lower smoke move opposite ways.')],
    ['turb', t('Wirbel', 'Eddies'), 0, 1.5, 0.01, t('Divergenzfreie Wirbel aus einer Stromfunktion ψ (Curl-Noise auf der Kugel). Verbiegen die Aschefahnen.', 'Divergence-free eddies from a stream function ψ (curl noise on the sphere). Bend the ash plumes.'), 'v = r̂ × ∇ψ'],
    ['preU', t('Grundwind', 'Prevailing wind'), 0, 60, 0.5, t('Zusätzlicher Wind in eine feste Richtung, überall gleich.', 'Extra wind in one fixed direction, the same everywhere.'), 'v = U·(cos θ·ê_Ost + sin θ·ê_Nord)', false, (v) => v.toFixed(0) + ' m/s'],
    ['preDir', t('Windrichtung', 'Wind direction'), -180, 180, 1, t('0° = nach Osten, 90° = nach Norden, 180° = nach Westen.', '0° = toward east, 90° = toward north, 180° = toward west.'), null, false, (v) => v + '°'],
    ['circ', t('Zellen-Anteil', 'Cell share'), 0, 1, 0.01, t('0 = nur Grundwind, 1 = volle globale Zirkulation.', '0 = prevailing wind only, 1 = full global circulation.')],
  ]],
  [t('Asche', 'Ash'), null, [
    ['kappa', t('Dichte', 'Opacity'), 0.05, 5, 0.01, t('Massen-Extinktion κ in m²/g (vulkanische Asche ~0,3–1). Beer–Lambert entlang des Sehstrahls.', 'Mass extinction κ in m²/g (volcanic ash ~0.3–1). Beer–Lambert along the view ray.'), 'T = exp(−∫κ·c ds)'],
    ['detail', t('Feinstruktur', 'Fine structure'), 0, 2, 0.01, t('Rauschen, das mit dem Wind fließt (zwei Phasen, überblendet), gestreckt in der Waagerechten: Schichten und Fetzen feiner als das Gitter.', 'Noise that flows with the wind (two phases, cross-faded), stretched horizontally: layers and shreds finer than the grid.'), 'c′ = c·max(0, 1 + k·(n(x − u·τ) − ½))'],
    ['fallC', t('Absinken grobe Asche', 'Coarse ash settling'), 0, 2, 0.01, t('Fallgeschwindigkeit der groben Fraktion. Feine Asche/Sulfat sinkt 40× langsamer.', 'Settling speed of the coarse fraction. Fine ash/sulfate settles 40× slower.'), 'w_s = (ρ_p − ρ)·g·d² / 18μ', false, (v) => v.toFixed(2) + ' m/s'],
    ['lifeF', t('Lebensdauer feine Asche', 'Fine ash lifetime'), 0.5, 60, 0.5, t('Wie lange der feine Schleier bleibt (Sulfat-Aerosol in der Stratosphäre: Monate).', 'How long the fine veil lasts (stratospheric sulfate aerosol: months).'), 'c(t) = c₀·e^(−t/τ)', false, (v) => v + ' d'],
    ['grid', t('Rauch-Gitter', 'Smoke grid'), 'select', GRIDS.map((g, i) => [i, `${g[0]}×${g[1]}×${g[2]}`]), t('Länge × Breite × Höhe des 3D-Transportgitters über der ganzen Kugel.', 'Longitude × latitude × height of the 3D transport grid over the whole sphere.'), null, true],
    ['warm', t('Vorlauf', 'Warm-up'), 0, 72, 1, t('So viele Stunden werden beim Start vorgerechnet, damit die Asche schon unterwegs ist.', 'This many hours are pre-computed at start so the ash is already on its way.'), null, false, (v) => v + ' h'],
  ]],
  [t('Zeit und Licht', 'Time and light'), null, [
    ['lapse', t('Zeitraffer', 'Time lapse'), 60, 43200, 60, t('Simulierte Zeit pro echter Sekunde. Die Physik bleibt gleich, nur schneller.', 'Simulated time per real second. The physics stays the same, only faster.'), null, false, lapseTxt],
    ['spin', t('Drehung', 'Spin'), 0, 3, 0.01, t('1 = ein Tag dauert 24 simulierte Stunden. 0 = stehender Planet. Sterne und Nebel drehen nicht mit.', '1 = one day lasts 24 simulated hours. 0 = still planet. Stars and nebula do not turn with it.')],

// Vulkanphysik auf der CPU (pro Vulkan und Bild, billig)
// ---------------------------------------------------------------------------
const scaleHeight = () => S.atm / 11.8;                      // km, Erde: 100 km → 8,5 km
const bruntN = () => 0.02 * Math.sqrt(8.5 / scaleHeight());  // 1/s, isotherm: N² = g²/(c_p T) ∝ 1/H
// Mastin et al. 2009: H = 2,00·V^0,241 (V = DRE-Volumenstrom m³/s), MTT: H ∝ N^(−3/4)
function plumeHeight(mer) { return Math.min(2.0 * Math.pow(Math.max(mer, 1) / 2500, 0.241) * Math.pow(scaleHeight() / 8.5, 0.375), 0.92 * S.atm); }
function mulberry(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function randDir(r) { const z = r() * 2 - 1, a = r() * Math.PI * 2, s = Math.sqrt(1 - z * z); return [s * Math.cos(a), z, s * Math.sin(a)]; }

let volcs = [];
function genVolcanoes() {
  const r = mulberry((S.seed * 7919) ^ (S.vSeed * 104729));
  volcs = [];
  for (let i = 0; i < S.vCount; i++) {
    const Rb = S.vSize * (0.5 + r());
    const shield = r() < 0.35;
    volcs.push({ dir: randDir(r), Rb, Hc: shield ? Math.min(0.07 * Rb, 22) : Math.min(0.28 * Rb, 9), rc: (shield ? 0.07 : 0.1) * Rb, type: shield ? 1 : 0,
      mer: 0, merJ: -0.3 + (r() - 0.5) * 1.2, period: (6 + r() * 42) * 3600, phase: r(), super: false });
  }
  for (let i = 0; i < S.sCount; i++) {
    const rc = S.sSize / 2;
    volcs.push({ dir: randDir(r), Rb: rc * 2.2, Hc: 1.2, rc, type: 2, mer: 0, merJ: (r() - 0.5) * 0.4, period: 0, phase: 0, super: true });
  }
}

// ---------------------------------------------------------------------------
// WGSL: gemeinsame Mathematik
// ---------------------------------------------------------------------------
const NOISE = /* wgsl */`
const PI = 3.14159265;
fn pcg3d(a: vec3u) -> vec3u {
  var v = a * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v = v ^ (v >> vec3u(16u));
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}
fn grad3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h >> vec3u(16u)) * (2.0 / 65535.0) - 1.0;
}
fn rnd3(i: vec3f) -> vec3f { return vec3f(pcg3d(bitcast<vec3u>(vec3i(i))) >> vec3u(8u)) / 16777215.0; }
// Gradientenrauschen, quintisch interpoliert
fn noise(x: vec3f) -> f32 {
  let i = floor(x); let f = x - i;
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let va = dot(grad3(i), f);
  let vb = dot(grad3(i + vec3f(1, 0, 0)), f - vec3f(1, 0, 0));
  let vc = dot(grad3(i + vec3f(0, 1, 0)), f - vec3f(0, 1, 0));
  let vd = dot(grad3(i + vec3f(1, 1, 0)), f - vec3f(1, 1, 0));
  let ve = dot(grad3(i + vec3f(0, 0, 1)), f - vec3f(0, 0, 1));
  let vf = dot(grad3(i + vec3f(1, 0, 1)), f - vec3f(1, 0, 1));
  let vg = dot(grad3(i + vec3f(0, 1, 1)), f - vec3f(0, 1, 1));
  let vh = dot(grad3(i + vec3f(1, 1, 1)), f - vec3f(1, 1, 1));
  return mix(mix(mix(va, vb, u.x), mix(vc, vd, u.x), u.y), mix(mix(ve, vf, u.x), mix(vg, vh, u.x), u.y), u.z);
}
// Dasselbe mit analytischem Gradienten: (Wert, ∂/∂x, ∂/∂y, ∂/∂z)
fn noised(x: vec3f) -> vec4f {
  let i = floor(x); let f = x - i;
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  let ga = grad3(i);                     let gb = grad3(i + vec3f(1, 0, 0));
  let gc = grad3(i + vec3f(0, 1, 0));    let gd = grad3(i + vec3f(1, 1, 0));
  let ge = grad3(i + vec3f(0, 0, 1));    let gf = grad3(i + vec3f(1, 0, 1));
  let gg = grad3(i + vec3f(0, 1, 1));    let gh = grad3(i + vec3f(1, 1, 1));
  let va = dot(ga, f);                   let vb = dot(gb, f - vec3f(1, 0, 0));
  let vc = dot(gc, f - vec3f(0, 1, 0));  let vd = dot(gd, f - vec3f(1, 1, 0));
  let ve = dot(ge, f - vec3f(0, 0, 1));  let vf = dot(gf, f - vec3f(1, 0, 1));
  let vg = dot(gg, f - vec3f(0, 1, 1));  let vh = dot(gh, f - vec3f(1, 1, 1));
  let k1 = vb - va; let k2 = vc - va; let k3 = ve - va;
  let k4 = va - vb - vc + vd; let k5 = va - vc - ve + vg; let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;
  let v = va + k1 * u.x + k2 * u.y + k3 * u.z + k4 * u.x * u.y + k5 * u.y * u.z + k6 * u.z * u.x + k7 * u.x * u.y * u.z;
  let g = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga) + u.x * u.y * (ga - gb - gc + gd)
        + u.y * u.z * (ga - gc - ge + gg) + u.z * u.x * (ga - gb - ge + gf) + u.x * u.y * u.z * (-ga + gb + gc - gd + ge - gf - gg + gh)
        + du * vec3f(k1 + k4 * u.y + k6 * u.z + k7 * u.y * u.z,
                     k2 + k4 * u.x + k5 * u.z + k7 * u.x * u.z,
                     k3 + k6 * u.x + k5 * u.y + k7 * u.x * u.y);
  return vec4f(v, g);
}
// Orthonormale Drehung zwischen den Oktaven (verhindert gleichgerichtete Artefakte)
const M3 = mat3x3f(vec3f(0.00, 0.80, 0.60), vec3f(-0.80, 0.36, -0.48), vec3f(-0.60, -0.48, 0.64));
fn fbm(p0: vec3f, oct: i32) -> f32 {
  var p = p0; var a = 0.0; var b = 0.5;
  for (var i = 0; i < oct; i++) { a += b * noise(p); p = M3 * p * 2.03 + vec3f(1.7, 9.2, 3.1); b *= 0.5; }
  return a;
}
`;

// Wind: Zirkulationszellen + thermischer Wind + Stratosphäre + Wirbel + Grundwind (m/s, tangential)
const WIND = /* wgsl */`
struct WindP { a: vec4f, b: vec4f, c: vec4f }   // a: U, Zellen, Scherung, Strat.; b: Wirbel, Grundwind, Richtung, Tropopause km; c: Zeit s
fn eastOf(p: vec3f) -> vec3f { let e = vec3f(-p.z, 0.0, p.x); let l = length(e); return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5); }
fn windCirc(p: vec3f, zkm: f32, W: WindP) -> vec3f {
  let e = eastOf(p); let n = cross(e, p);
  let lat = asin(clamp(p.y, -1.0, 1.0));
  let jet = exp(-pow((abs(lat) - 0.785) / 0.26, 2.0));
  let zt = clamp(zkm / W.b.w, 0.0, 1.0);
  var u = -0.4 + 1.4 * jet + 2.0 * W.a.z * jet * zt;       // thermischer Wind bis zur Tropopause
  let above = max(zkm - W.b.w, 0.0) / W.b.w;
  u = mix(-W.a.w, u, exp(-above * 2.5));                    // Stratosphäre: Ostwind
  let v = -0.15 * sin(6.0 * lat) * cos(PI * zt);             // Hadley/Ferrel/Polar: Boden äquatorwärts, oben zurück
  let pre = (cos(W.b.z) * e + sin(W.b.z) * n) * W.b.y;
  return (u * e + v * n) * (W.a.x * W.a.y) + pre;
}
fn wind(p: vec3f, zkm: f32, W: WindP) -> vec3f {
  let tt = W.c.x * 1.0e-5;
  let g = noised(p * 3.0 + vec3f(0.0, 0.0, tt)).yzw + 0.5 * noised(p * 7.0 + vec3f(tt * 1.7, 5.3, 1.1)).yzw;
  let eddy = cross(p, g) * (W.b.x * (W.a.x * 0.8 + W.b.y * 0.5));  // v = r̂ × ∇ψ: divergenzfrei
  return windCirc(p, zkm, W) + eddy;
}
`;

// Vulkane: dynamische Daten (pro Bild von der CPU) + Säulenversatz (pro Bild auf der GPU)
const VOLC = /* wgsl */`
struct Volc { p: vec4f, q: vec4f, e: vec4f, f: vec4f }
// p: Richtung xyz, Basisradius km · q: Kegelhöhe km, Kraterradius km, Typ, Einflussradius km
// e: Massenstrom kg/s, Säulenhöhe km, Aufstieg W m/s, Aktivität · f: b₀ km, α, k (Schirm), R_max km
fn shiftAt(i: u32, z: f32, H: f32) -> vec3f {
  let x = clamp(z / max(H, 0.1), 0.0, 1.0) * 4.0;
  let k = min(u32(x), 3u); let f = x - f32(k);
  let a = select(vec3f(0.0), SH[i * 4u + max(k, 1u) - 1u].xyz, k > 0u);
  return mix(a, SH[i * 4u + k].xyz, f);
}
`;

// ---------------------------------------------------------------------------
// Gelände backen: Höhe, Normale, Farbe → Würfelkarte
// ---------------------------------------------------------------------------
const BAKE = NOISE + /* wgsl */`
struct BakeU { face: vec4f, seed: vec4f, shape: vec4f, clim: vec4f, pal: array<vec4f, 12> }
@group(0) @binding(0) var<uniform> B: BakeU;
@group(0) @binding(1) var albOut: texture_storage_2d_array<rgba8unorm, write>;
@group(0) @binding(2) var nrmOut: texture_storage_2d_array<rgba8snorm, write>;

fn faceDir(face: u32, s: f32, t: f32) -> vec3f {
  switch face {
    case 0u: { return vec3f(1.0, -t, -s); }
    case 1u: { return vec3f(-1.0, -t, s); }
    case 2u: { return vec3f(s, 1.0, t); }
    case 3u: { return vec3f(s, -1.0, -t); }
    case 4u: { return vec3f(s, -t, 1.0); }
    default: { return vec3f(-s, -t, -1.0); }
  }
}
// Erosions-fBm: jede Oktave wird durch den bisher aufsummierten Gradienten gedämpft
fn erosionFbm(p0: vec3f, oct: i32, ero: f32) -> f32 {
  var p = p0; var a = 0.0; var b = 0.5; var d = vec3f(0.0);
  for (var i = 0; i < oct; i++) {
    let n = noised(p);
    d += n.yzw * b;
    a += b * n.x / (1.0 + ero * dot(d, d));
    b *= 0.5; p = M3 * p * 2.03 + vec3f(3.1, 1.3, 7.7);
  }
  return a;
}
// Ridged Multifractal (Musgrave): Oktave i wächst nur, wo Oktave i−1 hoch war
fn ridged(p0: vec3f, oct: i32) -> f32 {
  var p = p0; var sum = 0.0; var amp = 0.6; var w = 1.0;
  for (var i = 0; i < oct; i++) {
    var s = 1.0 - abs(noise(p)); s = s * s * w;
    w = clamp(s * 2.2, 0.0, 1.0);
    sum += s * amp; amp *= 0.5; p = M3 * p * 2.03 + vec3f(5.3, 2.9, 0.7);
  }
  return sum;
}
fn warped(p: vec3f) -> vec3f {
  let q = p * B.shape.x + B.seed.xyz;
  let w = vec3f(fbm(q + vec3f(0.0, 3.1, 7.4), 5), fbm(q + vec3f(5.2, 1.3, 2.8), 5), fbm(q + vec3f(9.1, 6.4, 0.3), 5));
  return q + B.shape.y * w;
}
fn heightQ(q: vec3f, oct: i32) -> f32 {
  let c = erosionFbm(q, oct, B.shape.w) * 1.3;
  let land = smoothstep(B.seed.w - 0.05, B.seed.w + 0.25, c);
  let m = ridged(q * 1.9 + vec3f(11.0, 4.0, 2.0), max(oct - 2, 4));
  return c + B.shape.z * m * land * 0.55;
}

@compute @workgroup_size(8, 8, 1)
fn bake(@builtin(global_invocation_id) gid: vec3u) {
  let N = u32(B.face.z);
  let x = gid.x; let y = gid.y + u32(B.face.y);
  if (x >= N || y >= N) { return; }
  let face = u32(B.face.x);
  let s = (f32(x) + 0.5) / f32(N) * 2.0 - 1.0;
  let tt = (f32(y) + 0.5) / f32(N) * 2.0 - 1.0;
  let p = normalize(faceDir(face, s, tt));
  let oct = i32(B.face.w);
  // Tangenten für die Normale (finite Differenzen im selben verzerrten Koordinatensystem: nahtlos)
  let hlp = select(vec3f(0.0, 1.0, 0.0), vec3f(1.0, 0.0, 0.0), abs(p.y) > 0.9);
  let t1 = normalize(cross(p, hlp)); let t2 = cross(p, t1);
  let eps = 1.3 / f32(N);
  let q = warped(p);
  let h = heightQ(q, oct);
  let h1 = heightQ(q + t1 * eps * B.shape.x, oct);
  let h2 = heightQ(q + t2 * eps * B.shape.x, oct);
  let grad = ((h1 - h) * t1 + (h2 - h) * t2) / eps;
  let hs = h - B.seed.w;
  let slope = length(grad) * B.clim.w;
  var n = normalize(p - grad * B.clim.w);

  // Klima: Temperatur aus Breite und Höhe, Feuchte aus Rauschen minus subtropischer Trockengürtel
  let lat = asin(clamp(p.y, -1.0, 1.0));
  let al = abs(lat) / (PI * 0.5);
  let nz = fbm(p * 6.0 + B.seed.zxy, 4);
  let temp = 1.0 - pow(al, 1.3) * 1.15 - max(hs, 0.0) * 1.6 + 0.12 * nz + B.clim.y;
  let moist = 0.5 + 0.7 * fbm(p * 2.3 + B.seed.yzx * 1.7, 6) - 0.28 * exp(-pow((al - 0.33) / 0.1, 2.0)) + B.clim.z;

    a = clamp(0.5 + hs * 1.5, 0.0, 0.499);

    let ice = smoothstep(0.1, 0.02, temp + 0.05 * nz);

    var wet = mix(B.pal[5].rgb, B.pal[6].rgb, smoothstep(0.5, 0.8, moist));

    col = mix(col, B.pal[9].rgb, clamp(smoothstep(0.4, 1.3, slope) + smoothstep(0.3, 0.6, hs), 0.0, 1.0));
    col = mix(col, B.pal[2].rgb, smoothstep(0.018, 0.004, hs) * smoothstep(0.1, 0.3, temp));

}
`;

const SIM_HEAD = /* wgsl */`

@group(0) @binding(5) var<storage, read_write> SH: array<vec4f>;

@compute @workgroup_size(64)
fn prep(@builtin(global_invocation_id) gid: vec3u) {

    let u = wind(v.p.xyz, z, U.wind);
    acc += (u - v.p.xyz * dot(u, v.p.xyz)) * (Hh / 4.0) / max(v.e.z, 1.0);

const SIM = NOISE + WIND + VOLC + SIM_HEAD + /* wgsl */`
@group(0) @binding(1) var src: texture_3d<f32>;
@group(0) @binding(2) var smp: sampler;
@group(0) @binding(3) var dst: texture_storage_3d<rgba16float, write>;
@group(0) @binding(5) var<storage, read> SH: array<vec4f>;

fn gridUV(p: vec3f) -> vec2f { return vec2f(atan2(p.z, p.x) / (2.0 * PI) + 0.5, asin(clamp(p.y, -1.0, 1.0)) / PI + 0.5); }

@compute @workgroup_size(8, 8, 4)
fn advect(@builtin(global_invocation_id) gid: vec3u) {
  let dims = vec3u(U.grid.xyz);
  if (any(gid >= dims)) { return; }
  if (U.src.y > 0.5) { textureStore(dst, gid, vec4f(0.0)); return; }
  let R = U.geo.x; let Htop = U.geo.y; let dt = U.grid.w;
  let lon = ((f32(gid.x) + 0.5) / f32(dims.x) - 0.5) * 2.0 * PI;
  let lat = ((f32(gid.y) + 0.5) / f32(dims.y) - 0.5) * PI;
  let zkm = (f32(gid.z) + 0.5) / f32(dims.z) * Htop;
  let p = vec3f(cos(lat) * cos(lon), sin(lat), cos(lat) * sin(lon));
  let cellKm = max(2.0 * PI * R * cos(lat) / f32(dims.x), PI * R / f32(dims.y));

  var vel = wind(p, zkm, U.wind);
  var srcAdd = vec2f(0.0);
  let nv = u32(U.geo.z);
  for (var i = 0u; i < nv; i++) {
    let v = V[i];
    if (v.e.w <= 0.001) { continue; }
    let cd = dot(p, v.p.xyz);
    if (cd < cos(min(v.q.w / R, 3.0))) { continue; }
    let dv = (p - v.p.xyz * cd) * R;
    let Hh = v.e.y;
    // Schirmwolke: Schwerestrom auf der Höhe neutralen Auftriebs (Woods & Kienle 1994):
    // R(t) = k·t^(2/3)  →  u_r(r) = (2/3)·k^(3/2)·r^(−1/2)
    let du = dv - SH[i * 4u + 3u].xyz;
    let ru = length(du);
    let bTop = v.f.x + 1.2 * v.f.y * Hh;
    let vert = exp(-pow((zkm - 0.74 * Hh) / (0.12 * Hh + 1.0), 2.0));   // neutrale Auftriebshöhe H_nb ≈ 0,75·H
    let ur = (2.0 / 3.0) * pow(v.f.z, 1.5) / sqrt(max(ru, bTop) * 1000.0);
    vel += (du / max(ru, 1e-3)) * ur * vert * smoothstep(v.f.w, 0.6 * v.f.w, ru) * v.e.w;
    // Quelle: Suzuki-Verteilung S(ζ) ∝ (1 − ζ)·e^(A(ζ − 1)), waagerecht Gauß mit Säulenradius b(z)
    if (zkm < Hh) {
      let rv = dv - shiftAt(i, zkm, Hh);
      let b = v.f.x + 1.2 * v.f.y * zkm;
      let sg = max(b, 0.5 * cellKm);
      let G = exp(-dot(rv, rv) / (2.0 * sg * sg)) / (2.0 * PI * sg * sg * 1e6);
      let ze = zkm / Hh;
      let Sz = (1.0 - ze) * exp(4.0 * (ze - 1.0)) / (0.0567 * Hh * 1000.0);   // A = 4: Maximum bei ζ = 0,75
      srcAdd += v.e.x * 1000.0 * Sz * G * U.src.x * vec2f(0.6, 0.4);
    }

  let tang = vel - p * dot(vel, p);
  let p0 = normalize(p - tang * dt / (R * 1000.0));
  let uv = gridUV(p0);
  let c = textureSampleLevel(src, smp, vec3f(uv, (zkm + U.ash.x * dt / 1000.0) / Htop), 0.0).x;
  let f = textureSampleLevel(src, smp, vec3f(uv, (zkm + U.ash.y * dt / 1000.0) / Htop), 0.0).y;
  let o = vec2f(c * exp(-dt / U.ash.z), f * exp(-dt / U.ash.w)) + srcAdd * dt;
  textureStore(dst, gid, vec4f(min(o, vec2f(60000.0)), 0.0, 0.0));
}
`;

const RENDER = NOISE + WIND + VOLC + /* wgsl */`

// sunP: Sonne im Planetensystem, Pixelwinkel · rot: cos θ, sin θ, Sicht-Zeit, Sim-Zeit · geo: R km, Dicke km, Überhöhung, Anzahl Vulkane

@group(0) @binding(2) var nrmT: texture_cube<f32>;

@group(0) @binding(6) var nebT: texture_cube<f32>;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));

}

// Chapman-Näherung (Schüler 2012): relative Luftsäule entlang eines schrägen Strahls

  else if (a.y >= a.z) { uv = d.xz / a.y; face = select(3.0, 2.0, d.y > 0.0); }
  else { uv = d.xy / a.z; face = select(5.0, 4.0, d.z > 0.0); }

    let cell = floor((uv * 0.5 + 0.5) * gsz);
    let h = rnd3(vec3f(cell.x, cell.y, face * 7.0 + f32(l) * 131.0));

struct Cone { h: f32, g: vec3f, basalt: f32, glow: f32 }
fn coneH(r: f32, v: Volc) -> f32 {

    let cd = dot(n, v.p.xyz);
    if (cd < cos(min(v.p.w * 1.05 / R, 3.0))) { continue; }
    let dv = (n - v.p.xyz * cd) * R;
    let r = length(dv);
    let rd = dv / max(r, 1e-4);
    let e = max(0.02 * v.q.y, 0.05);
    let h = coneH(r, v);
    let dh = (coneH(r + e, v) - coneH(max(r - e, 0.0), v)) / (e + min(r, e));
    o.h += h; o.g += rd * dh;
    let x = r / v.p.w;
    o.basalt = max(o.basalt, smoothstep(1.0, 0.35, x) * select(0.75, 0.45, v.q.z > 1.5));
    // Lavasee im Krater plus Lavaströme als Rauschadern die Flanke hinab
    let lake = smoothstep(v.q.y * 0.9, v.q.y * 0.3, r);
    let ang = atan2(dot(rd, cross(v.p.xyz, eastOf(v.p.xyz))), dot(rd, eastOf(v.p.xyz)));
    let vein = pow(max(1.0 - abs(noise(vec3f(ang * 5.0, r / v.p.w * 3.0, f32(i)))) * 1.0, 0.0), 12.0) * smoothstep(0.8, 0.15, x) * smoothstep(0.5 * v.q.y, v.q.y, r);
    o.glow += (lake * (0.7 + 0.3 * noise(dv * 0.5 / max(v.q.y, 1.0) + vec3f(G.rot.z * 0.0005))) + vein * 0.6) * v.e.w;
  }
  return o;
}

@fragment
fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let res = G.res.xy;
  var uv = (fc.xy / res) * 2.0 - 1.0; uv.y = -uv.y;
  let tH = G.cam.w;
  let rdW = normalize(G.fwd.xyz + uv.x * G.right.w * tH * G.right.xyz + uv.y * tH * G.up.xyz);
  let ro = toPl(G.cam.xyz); let rd = toPl(rdW);
  let sun = G.sunP.xyz;
  let R = G.geo.x; let Htop = G.geo.y; let ex = G.geo.z;
  let rTop = 1.0 + Htop * ex / R;
  let dtV = (rTop - 1.0) * 1.5 / G.ash.z;   // senkrechte Schrittweite
  let rnd = rnd3(vec3f(fc.xy, G.res.z)).x;

  // Hintergrund: Weltraum-Richtung (dreht nur mit der Kamera, nicht mit dem Planeten)
  var bg = textureSampleLevel(nebT, smp, rdW, 0.0).rgb * G.misc.x + stars(rdW) * G.misc.y;
  let sd = dot(rdW, G.sunW.xyz);
  bg += vec3f(1.0, 0.97, 0.9) * (smoothstep(0.99996, 0.99998, sd) * 400.0 + pow(max(sd, 0.0), 2000.0) * 2.0);

  let hitA = sphere(ro, rd, rTop);
  if (hitA.y <= 0.0) { return vec4f(tonemap(bg, fc.xy), 1.0); }
  let hitG = sphere(ro, rd, 1.0);
  let ground = hitG.x > 0.0;
  let t0 = max(hitA.x, 0.0);
  let t1 = select(hitA.y, hitG.x, ground);

  // Kandidaten-Säulen: Strahl gegen Hüllkugel jeder aktiven Säule
  var cI: array<u32, 4>; var cA: array<f32, 4>; var cB: array<f32, 4>; var cF: array<f32, 4>; var nc = 0u;
  let nv = u32(G.geo.w);
  for (var i = 0u; i < nv; i++) {
    let v = V[i];
    if (v.e.w <= 0.001 || nc >= 4u) { continue; }
    let Hh = v.e.y; let hr = Hh * ex / R;
    let st = SH[i * 4u + 3u].xyz / R;
    let bt = (v.f.x + 1.2 * v.f.y * Hh) * 3.4 / R;
    let ctr = v.p.xyz * (1.0 + hr * 0.5) + st * 0.5;
    let rad = length(vec2f(hr * 0.6, length(st) * 0.5)) + bt;
    let h = sphere(ro - ctr, rd, rad);
    if (h.y > t0 && h.x < t1) {
      cI[nc] = i; cA[nc] = max(h.x, t0); cB[nc] = min(h.y, t1);
      cF[nc] = max(min((v.f.x + 0.6 * v.f.y * Hh) / R * 0.35, dtV * 0.25), 1e-5);
      nc++;
    }
  }

  // Raymarch durch Luft und Asche (energieerhaltende Integration pro Schritt)
  let mu = dot(rd, sun);
  let phR = 3.0 / (16.0 * PI) * (1.0 + mu * mu);
  let gM = 0.76;
  let phM = 3.0 / (8.0 * PI) * ((1.0 - gM * gM) * (1.0 + mu * mu)) / ((2.0 + gM * gM) * pow(1.0 + gM * gM - 2.0 * gM * mu, 1.5));
  let phA = mix(hg(mu, 0.65), hg(mu, -0.2), 0.3);
  let sunI = G.sunW.w;
  let kap = G.ash.x;
  let mPerU = R * 1000.0 / ex;
  let steps = G.ash.z;
  let dtC = (t1 - t0) / steps;
  let sMax = 0.6 / (dtV * 0.25 * mPerU);   // höchstens τ ≈ 0,6 pro Feinschritt
  var T = vec3f(1.0); var L = vec3f(0.0);
  var tt = t0 + dtC * 0.3 * rnd;
  var inAsh = false;
  var dbgIt = 0; var dbgOd = -1.0;
  for (var it = 0; it < 480; it++) {
    if (tt >= t1) { break; }
    dbgIt = it;
    var dt = dtC;
    var inCol = false;
    for (var c = 0u; c < nc; c++) {
      if (tt >= cA[c] && tt < cB[c]) { dt = min(dt, cF[c]); inCol = true; }
      else if (tt < cA[c]) { dt = min(dt, cA[c] - tt + 1e-6); }
    }
    // Höhenauflösung halten: ein Schritt durchquert höchstens ~1,5 Schalen-Schichten senkrecht,
    // sonst springen schräge Strahlen über dünne Ascheschichten hinweg
    let pu = normalize(ro + rd * tt);
    dt = min(dt, dtV / max(abs(dot(rd, pu)), 0.12));
    // In der Asche feiner rechnen
    if (!inCol && inAsh) { dt = min(dt, dtV * 0.25); }
    dt = min(dt, t1 - tt);
    let tm = tt + dt * rnd;
    let p = ro + rd * tm;
    let r = length(p); let n = p / r;
    let altkm = max((r - 1.0) * R / ex, 0.0);
    let ds = dt * mPerU;
    let rhoR = exp(-altkm / G.atm.x); let rhoM = exp(-altkm / G.atm.y);

    // Asche: Gitter (mit fließender Feinstruktur) + analytische Säulen
    var ash = textureSampleLevel(ashT, ashS, gridUVW(n, altkm), 0.0).xy;
    inAsh = kap * (ash.x + 2.0 * ash.y) * dtV * mPerU > 0.02;
    if (ash.x + ash.y > 1e-7 && G.ash.y > 0.0) {
      // Feinstruktur verschiebt die Wolke senkrecht (Quellkuppen, Wellen) und dünnt sie aus (Fetzen)
      let nd = ashDetail(n, altkm) - 0.5;
      ash = textureSampleLevel(ashT, ashS, gridUVW(n, altkm - G.ash.y * 5.0 * nd), 0.0).xy;
      ash *= max(0.0, 1.0 + G.ash.y * nd * 1.6);
    }
    var glow = 0.0;
    for (var c = 0u; c < nc; c++) {
      if (tm >= cA[c] && tm <= cB[c]) { let cc = column(cI[c], p, r); ash.x += cc.x; glow += cc.y; }
    }
    let sR = BR * rhoR; let sM = BM * rhoM;
    // feine Asche: mehr Fläche pro Masse. Weiche Sättigung σ → σ_max·(1 − e^(−σ/σ_max)): eine Aschewolke ist
    // nach wenigen Metern undurchsichtig; die Obergrenze macht ihre Oberfläche mit km-Schritten auflösbar.
    let aC0 = kap * ash.x; let aF0 = kap * ash.y * 2.0;
    let sA0 = aC0 + aF0;
    let sA = sMax * (1.0 - exp(-sA0 / sMax));
    let aF = aF0 * sA / max(sA0, 1e-20);
    let ext = sR + vec3f(sM * 1.11 + sA);
    let cz = dot(n, sun);
    var Ts = sunTrans(altkm, cz);
    var Sc = sR * phR + vec3f(sM * phM);
    if (sA > 1e-9) {
      // Ascheschatten: kurzer Marsch zur Sonne durch Gitter und Säulen
      var od = 0.0; var st = dtV * 0.25;
      var q = p;
      for (var k = 0; k < 6; k++) {
        q += sun * st;
        let rq = length(q);
        if (rq > rTop) { break; }
        var a2 = ashAt(q);
        if (k < 2 && a2.x + a2.y > 1e-7 && G.ash.y > 0.0) {
          let zq = (rq - 1.0) * R / ex;
          let nd = ashDetail(q / rq, zq) - 0.5;
          a2 = textureSampleLevel(ashT, ashS, gridUVW(q / rq, zq - G.ash.y * 5.0 * nd), 0.0).xy * max(0.0, 1.0 + G.ash.y * nd * 1.6);
        }
        for (var c = 0u; c < nc; c++) { a2.x += column(cI[c], q, rq).x; }
        od += sMax * (1.0 - exp(-kap * (a2.x + 2.0 * a2.y) / sMax)) * st * mPerU;
        st *= 2.0;
      }
      if (dbgOd < 0.0) { dbgOd = od; }
      let alb = mix(vec3f(0.34, 0.31, 0.28), vec3f(0.8, 0.8, 0.82), aF / sA);
      // Mehrfachstreuung (Wrenninge 2013): Σ aⁱ·σ·p(cⁱμ)·e^(−bⁱτ)
      var ms = 0.0; var aa = 1.0; var bb = 1.0; var cc2 = 1.0;
      for (var o = 0; o < 3; o++) { ms += aa * mix(hg(mu * cc2, 0.65 * cc2), hg(mu * cc2, -0.2 * cc2), 0.3) * exp(-bb * od); aa *= 0.5; bb *= 0.4; cc2 *= 0.5; }
      let powder = 1.0 - 0.6 * exp(-2.0 * sA * 400.0);
      Sc += alb * sA * ms * powder;
      // Himmelslicht von oben
      L += T * alb * (1.0 - exp(-sA * ds)) * vec3f(0.35, 0.5, 0.8) * 0.05 * sunI * smoothstep(-0.2, 0.3, cz) * Ts;
    }
    let Tstep = exp(-ext * ds);
    // Glut von unten: die dichte Säulenbasis streut das Licht des Lavasees
    L += T * (1.0 - exp(-sA * ds)) * LAVA * glow * G.atm.w * 2.0;
    L += T * Ts * sunI * Sc * (1.0 - Tstep) / max(ext, vec3f(1e-12));
    T *= Tstep;
    if (max(T.x, max(T.y, T.z)) < 0.003) { break; }
    tt += dt;
  }

  if (G.misc.z > 0.5) {   // Prüfansichten: 1 Durchlässigkeit, 2 Schritte, 3 Schattentiefe am ersten Aschetreffer
    if (G.misc.z < 1.5) { return vec4f(T, 1.0); }
    if (G.misc.z < 2.5) { return vec4f(vec3f(f32(dbgIt) / 200.0), 1.0); }
    return vec4f(vec3f(exp(-dbgOd)), 1.0);
  }
  var col: vec3f;
  if (ground) {
    col = shadeGround(ro + rd * hitG.x, rd, hitG.x) * T + L;
  } else {
    col = bg * T + L;
  }
  return vec4f(tonemap(col, fc.xy), 1.0);
}

fn shadeGround(pg: vec3f, rd: vec3f, t: f32) -> vec3f {
  let n0 = normalize(pg);
  let sun = G.sunP.xyz;
  let R = G.geo.x;
  // Pixel-Fußabdruck auf der Kugel für anisotrope Filterung ohne implizite Ableitungen
  let px = G.sunP.w;
  let dRx = toPl(G.right.xyz) * px; let dRy = toPl(G.up.xyz) * px;
  let dn = min(dot(n0, rd), -0.05);
  let dPx = t * (dRx - rd * dot(n0, dRx) / dn);
  let dPy = t * (dRy - rd * dot(n0, dRy) / dn);
  let a = textureSampleGrad(albT, smp, n0, dPx, dPy);
  var alb = a.rgb * a.rgb;
  var nb = textureSampleGrad(nrmT, smp, n0, dPx, dPy).xyz;
  // Relief: Tangentialteil der Normale skalieren
  let nt = nb - n0 * dot(nb, n0);
  var n = normalize(n0 * max(dot(nb, n0), 0.2) + nt * G.atm.z);
  // Vulkane darüberlegen
  let cn = cones(n0);
  let hkm = (a.a - 0.5) / 1.5 * 6.0 + cn.h;
  var water = a.a < 0.5 && hkm < 0.0;
  if (a.a < 0.5 && hkm >= 0.0) {    // Vulkaninsel aus dem Meer
    alb = mix(vec3f(0.55, 0.5, 0.38), vec3f(0.12, 0.11, 0.1), smoothstep(0.0, 0.3, hkm));
  }
  alb = mix(alb, vec3f(0.07, 0.065, 0.06), cn.basalt * select(1.0, 0.0, water));
  n = normalize(n - cn.g * G.atm.z * 0.8);
  if (water) { n = n0; }
  let cz = dot(n0, sun);
  let Ts = sunTrans(0.0, cz);
  // Ascheschatten auf dem Boden
  var od = 0.0; var st = 0.03 * G.geo.y * G.geo.z / R; var q = n0 * 1.0005;
  for (var k = 0; k < 6; k++) { q += sun * st; od += G.ash.x * dot(ashAt(q), vec2f(1.0, 2.0)) * st * R * 1000.0 / G.geo.z; st *= 1.6; }
  let shadow = exp(-od);
  let term = smoothstep(-0.03, 0.08, cz);
  let lit = Ts * G.sunW.w * shadow * term;
  var c = alb * max(dot(n, sun), 0.0) / PI * lit;
  c += alb * vec3f(0.3, 0.45, 0.8) * 0.03 * G.sunW.w * smoothstep(-0.1, 0.4, cz) * mix(1.0, shadow, 0.6);
  if (water) {
    // GGX-Glanz mit Schlick-Fresnel
    let v = -rd; let hv = normalize(sun + v);
    let nh = max(dot(n, hv), 0.0); let r2 = 0.09 * 0.09;
    let D = r2 / (PI * pow(nh * nh * (r2 - 1.0) + 1.0, 2.0));
    let F = 0.02 + 0.98 * pow(1.0 - max(dot(hv, v), 0.0), 5.0);
    c += lit * D * F * 0.25 * max(dot(n, sun), 0.0);
    c += vec3f(0.2, 0.35, 0.6) * 0.02 * G.sunW.w * (0.02 + 0.98 * pow(1.0 - max(dot(n, v), 0.0), 5.0)) * term;
  }
  c += LAVA * cn.glow * G.atm.w * 6.0;
  return c;
}

fn tonemap(c0: vec3f, fc: vec2f) -> vec3f {
  let x = c0 * G.up.w * 0.55;
  let m = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
  let dith = (fract(sin(dot(fc, vec2f(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
  return pow(m, vec3f(1.0 / 2.2)) + dith;
}

// ---------------------------------------------------------------------------
// Farbpaletten (linear), vom Seed variiert
// ---------------------------------------------------------------------------
function palette(r) {
  const base = S.style === 2
    ? [[0.02, 0.03, 0.05], [0.06, 0.12, 0.14], [0.12, 0.11, 0.1], [0.28, 0.16, 0.1], [0.22, 0.16, 0.12], [0.18, 0.2, 0.12], [0.1, 0.13, 0.08], [0.12, 0.18, 0.08], [0.2, 0.18, 0.16], [0.09, 0.085, 0.08], [0.75, 0.74, 0.72], [0.7, 0.74, 0.78]]
    : [[0.006, 0.02, 0.06], [0.02, 0.1, 0.15], [0.42, 0.37, 0.26], [0.45, 0.3, 0.16], [0.28, 0.25, 0.13], [0.1, 0.17, 0.05], [0.035, 0.09, 0.03], [0.02, 0.1, 0.025], [0.2, 0.19, 0.15], [0.17, 0.15, 0.13], [0.85, 0.87, 0.92], [0.75, 0.82, 0.88]];
  const jitter = S.style === 1 ? 1 : 0.08;
  const rot = S.style === 1 ? r() * Math.PI * 2 : (r() - 0.5) * 0.3;
  const waterRot = S.style === 1 ? r() * Math.PI * 2 : (r() - 0.5) * 0.4;
  return base.map((c, i) => {
    // Farbton im YIQ-Raum drehen: Helligkeit bleibt, Farbe wandert
    const a = i < 2 ? waterRot : i >= 10 ? 0 : rot * (i === 2 ? 0.3 : 1);
    const Y = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2], I = 0.596 * c[0] - 0.274 * c[1] - 0.322 * c[2], Qq = 0.211 * c[0] - 0.523 * c[1] + 0.312 * c[2];
    const sat = 1 + (r() - 0.5) * jitter;
    const i2 = (I * Math.cos(a) - Qq * Math.sin(a)) * sat, q2 = (I * Math.sin(a) + Qq * Math.cos(a)) * sat;
    const y2 = Y * (1 + (r() - 0.5) * 0.2);
    return [y2 + 0.956 * i2 + 0.621 * q2, y2 - 0.272 * i2 - 0.647 * q2, y2 - 1.106 * i2 + 1.703 * q2].map((x) => Math.max(0.004, Math.min(1, x)));
  });
}

const canvas = document.getElementById('view');
const statusEl = document.getElementById('status');
const busyEl = document.getElementById('busy');
const factsEl = document.getElementById('facts');
const fail = (m) => { statusEl.hidden = false; statusEl.innerHTML = m; };
try { document.getElementById('ver').textContent = typeof __VERSION__ !== 'undefined' ? __VERSION__ : ''; } catch {}
buildUI();

async function start() {
  if (!navigator.gpu) { fail(t('<b>WebGPU fehlt in diesem Browser.</b> Nimm Chrome oder Edge ab 113, Safari ab 26 oder Firefox ab 141.', '<b>This browser has no WebGPU.</b> Use Chrome or Edge 113+, Safari 26+ or Firefox 141+.')); return; }
  const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  if (!adapter) { fail(t('<b>Keine WebGPU-Grafikkarte gefunden.</b>', '<b>No WebGPU graphics adapter found.</b>')); return; }
  const device = await adapter.requestDevice({ requiredLimits: { maxStorageBuffersPerShaderStage: Math.min(8, adapter.limits.maxStorageBuffersPerShaderStage) } });
  device.lost.then((i) => fail(`<b>${t('Grafikkarte verloren', 'GPU device lost')}:</b> ${i.message}`));
  const format = navigator.gpu.getPreferredCanvasFormat();
  const ctx = OFFSCREEN ? null : canvas.getContext('webgpu');
  if (ctx) ctx.configure({ device, format, alphaMode: 'opaque' });

  const mk = (code, label) => {
    const m = device.createShaderModule({ code, label });
    m.getCompilationInfo().then((i) => { const e = i.messages.filter((x) => x.type === 'error'); if (e.length) fail(`<b>Shader ${label}:</b> ` + e.map((x) => `${x.lineNum}: ${x.message}`).join('<br>')); });
    return m;
  };
  const bakeMod = mk(BAKE, 'bake'), nebMod = mk(NEB, 'nebula'), prepMod = mk(PREP, 'prep'), simMod = mk(SIM, 'sim'), renMod = mk(RENDER, 'render');
  const mipMods = { rgba8unorm: mk(MIP('rgba8unorm'), 'mip8'), rgba8snorm: mk(MIP('rgba8snorm'), 'mip8s') };
  const bakePipe = device.createComputePipeline({ layout: 'auto', compute: { module: bakeMod, entryPoint: 'bake' } });
  const nebPipe = device.createComputePipeline({ layout: 'auto', compute: { module: nebMod, entryPoint: 'neb' } });
  const prepPipe = device.createComputePipeline({ layout: 'auto', compute: { module: prepMod, entryPoint: 'prep' } });
  const simPipe = device.createComputePipeline({ layout: 'auto', compute: { module: simMod, entryPoint: 'advect' } });
  const mipPipes = Object.fromEntries(Object.entries(mipMods).map(([f, m]) => [f, device.createComputePipeline({ layout: 'auto', compute: { module: m, entryPoint: 'mip' } })]));
  const renPipe = device.createRenderPipeline({ layout: 'auto', vertex: { module: renMod, entryPoint: 'vs' }, fragment: { module: renMod, entryPoint: 'fs', targets: [{ format }] } });

  const U = (size) => device.createBuffer({ size, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bakeU = U(16 * 16), nebU = U(6 * 16), simU = U(7 * 16), renU = U(15 * 16);
  const MAXV = 64;
  const volcBuf = device.createBuffer({ size: MAXV * 64, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const shiftBuf = device.createBuffer({ size: MAXV * 64, usage: GPUBufferUsage.STORAGE });
  const smp = device.createSampler({ magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear', maxAnisotropy: 16 });
  const ashS = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'repeat', addressModeV: 'clamp-to-edge', addressModeW: 'clamp-to-edge' });

  // --- Würfeltexturen
  let alb = null, nrm = null, neb = null, bakeToken = 0, baked = false;
  const cubeTex = (N, fmt, mips) => device.createTexture({ size: [N, N, 6], format: fmt, mipLevelCount: mips, usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.STORAGE_BINDING });
  function genMips(tex, fmt, N, levels) {
    const enc = device.createCommandEncoder();
    for (let l = 1; l < levels; l++) {
      const n = Math.max(1, N >> l);
      const bg = device.createBindGroup({ layout: mipPipes[fmt].getBindGroupLayout(0), entries: [
        { binding: 0, resource: tex.createView({ dimension: '2d-array', baseMipLevel: l - 1, mipLevelCount: 1 }) },
        { binding: 1, resource: tex.createView({ dimension: '2d-array', baseMipLevel: l, mipLevelCount: 1 }) }] });
      const pass = enc.beginComputePass(); pass.setPipeline(mipPipes[fmt]); pass.setBindGroup(0, bg);
      pass.dispatchWorkgroups(Math.ceil(n / 8), Math.ceil(n / 8), 6); pass.end();
    }
    device.queue.submit([enc.finish()]);
  }
  async function bake() {
    const token = ++bakeToken;
    const N = S.res;
    const levels = Math.log2(N) + 1;
    const a2 = cubeTex(N, 'rgba8unorm', levels), n2 = cubeTex(N, 'rgba8snorm', levels);
    const r = mulberry(S.seed);
    const pal = palette(r);
    const off = [r() * 200 - 100, r() * 200 - 100, r() * 200 - 100];
    const oct = Math.max(8, Math.min(16, Math.log2(N) + 2));
    const data = new Float32Array(16 * 4);
    data.set([0, 0, N, oct, ...off, S.sea, S.cont, S.warp, S.mount, S.erosion, 1.6, S.climate, S.moist, 0.05 * (N / 2048) ** 0.3], 0);
    pal.forEach((c, i) => data.set([...c, 1], 16 + i * 4));
    const bg = device.createBindGroup({ layout: bakePipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: bakeU } },
      { binding: 1, resource: a2.createView({ dimension: '2d-array', baseMipLevel: 0, mipLevelCount: 1 }) },
      { binding: 2, resource: n2.createView({ dimension: '2d-array', baseMipLevel: 0, mipLevelCount: 1 }) }] });
    // In Streifen backen: jede Übergabe bleibt kurz (kein Watchdog-Abbruch), Fortschritt sichtbar
    const band = Math.max(8, Math.min(N, Math.floor((1 << 20) / N / 8) * 8));
    let done = 0; const total = 6 * Math.ceil(N / band);
    for (let f = 0; f < 6; f++) {
      for (let y0 = 0; y0 < N; y0 += band) {
        if (token !== bakeToken) { a2.destroy(); n2.destroy(); return; }
        data[0] = f; data[1] = y0;
        device.queue.writeBuffer(bakeU, 0, data);
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass(); pass.setPipeline(bakePipe); pass.setBindGroup(0, bg);
        pass.dispatchWorkgroups(Math.ceil(N / 8), Math.ceil(Math.min(band, N - y0) / 8), 1); pass.end();
        device.queue.submit([enc.finish()]);
        done++;
        if (done % 2 === 0 || done === total) { busyEl.textContent = `${t('Planet wird gebacken', 'Baking planet')} ${Math.round((done / total) * 100)} %`; await device.queue.onSubmittedWorkDone(); }
      }
    }
    genMips(a2, 'rgba8unorm', N, levels); genMips(n2, 'rgba8snorm', N, levels);
    await device.queue.onSubmittedWorkDone();
    if (token !== bakeToken) { a2.destroy(); n2.destroy(); return; }
    const oa = alb, on = nrm;
    alb = a2; nrm = n2; baked = true; renderBG = null;
    if (oa) oa.destroy(); if (on) on.destroy();
    busyEl.textContent = '';
  }
  async function bakeNebula() {
    const N = 1024;
    if (!neb) neb = cubeTex(N, 'rgba16float', 1);
    const r = mulberry(S.seed ^ 0x5bd1e995);
    const hue = r() * Math.PI * 2;
    const hsv = (h, s, v) => { const f = (n) => { const k = (n + h / (Math.PI / 3)) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); }; return [f(5), f(3), f(1)]; };
    const gal = randDir(r);
    const d = new Float32Array(24);
    d.set([N, 0.55, 0, 0, r() * 100, r() * 100, r() * 100, 0, ...gal, 0, ...hsv(hue, 0.75, 0.5), 0, ...hsv(hue + 1.3 + r(), 0.7, 0.45), 0, ...hsv(hue + 3.2, 0.5, 0.6), 0]);
    device.queue.writeBuffer(nebU, 0, d);
    const bg = device.createBindGroup({ layout: nebPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: nebU } }, { binding: 1, resource: neb.createView({ dimension: '2d-array' }) }] });
    const enc = device.createCommandEncoder();
    const pass = enc.beginComputePass(); pass.setPipeline(nebPipe); pass.setBindGroup(0, bg); pass.dispatchWorkgroups(N / 8, N / 8, 6); pass.end();
    device.queue.submit([enc.finish()]);
    renderBG = null;
  }

  // --- Aschegitter (Ping-Pong)
  let ash = [], gridDims = GRIDS[S.grid], simBG = [], ping = 0;
  function makeGrid() {
    for (const g of ash) g.destroy();
    gridDims = GRIDS[S.grid];
    ash = [0, 1].map(() => device.createTexture({ size: gridDims, dimension: '3d', format: 'rgba16float', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.COPY_SRC }));
    simBG = [0, 1].map((i) => device.createBindGroup({ layout: simPipe.getBindGroupLayout(0), entries: [
      { binding: 0, resource: { buffer: simU } }, { binding: 1, resource: ash[i].createView() }, { binding: 2, resource: ashS },
      { binding: 3, resource: ash[1 - i].createView() }, { binding: 4, resource: { buffer: volcBuf } }, { binding: 5, resource: { buffer: shiftBuf } }] }));
    ping = 0; renderBG = null; clearFlag = 2;
  }
  const prepBG = device.createBindGroup({ layout: prepPipe.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: simU } }, { binding: 4, resource: { buffer: volcBuf } }, { binding: 5, resource: { buffer: shiftBuf } }] });
  let renderBG = null;
  const getRenderBG = () => renderBG ??= device.createBindGroup({ layout: renPipe.getBindGroupLayout(0), entries: [
    { binding: 0, resource: { buffer: renU } }, { binding: 1, resource: alb.createView({ dimension: 'cube' }) }, { binding: 2, resource: nrm.createView({ dimension: 'cube' }) },
    { binding: 3, resource: smp }, { binding: 4, resource: ash[ping].createView() }, { binding: 5, resource: ashS },
    { binding: 6, resource: neb.createView({ dimension: 'cube' }) }, { binding: 7, resource: { buffer: volcBuf } }, { binding: 8, resource: { buffer: shiftBuf } }] });

  // --- Simulation
  let simT = 0, superT = 0, clearFlag = 2, spinA = 0;
  const vdata = new Float32Array(MAXV * 16);
  function updateVolcanoes() {
    const Hs = scaleHeight(), Nb = bruntN();
    vdata.fill(0);
    volcs.slice(0, MAXV).forEach((v, i) => {
      let act = 0, onset = 0, mer = v.mer;
      if (v.super) {
        mer = Math.pow(10, S.sMer + v.merJ);
        onset = superT;
        act = S.superOn ? Math.min(1, Math.max(0, (simT - superT) / 1800)) : 0;
      } else {
        const x = (simT / v.period + v.phase) % 1;
        const duty = S.vAct;
        onset = simT - x * v.period;
        act = duty <= 0 ? 0 : x < duty ? Math.min(1, x * v.period / 1800, (duty - x) * v.period / 3600) : 0;
        mer = Math.pow(10, S.vMer + v.merJ);
      }
      const merNow = mer * Math.max(act, 1e-3);
      const W = Math.min(250, Math.max(5, 30 * Math.pow(merNow / 1e8, 0.25)));
      const Hfull = plumeHeight(merNow);
      const Hh = Math.max(0.3, Math.min(Hfull, (W * Math.max(simT - onset, 0)) / 1000 + 0.3));
      const b0 = v.super ? v.rc * 0.5 : Math.max(0.3, v.rc * 0.6);
      const q = 136 * Math.pow(merNow, 0.75) / Math.pow(Nb, 1.25);           // Costa et al. 2013, m³/s
      const k = Math.cbrt((3 * 0.2 * Nb * q) / (2 * Math.PI));                  // Woods & Kienle 1994
      const Rmax = Math.min(2500, Math.max(30, ((2 / 3) * Math.pow(k, 1.5) / 4) ** 2 / 1000));
      const infl = Math.max(v.Rb, Rmax * 1.2 + Hh * 3 + 200);
      vdata.set([...v.dir, v.Rb, v.Hc, v.rc, v.type, infl, act > 0 ? merNow : 0, Hh, W, act, b0, 0.1, k, Rmax], i * 16);
      v.now = { act, H: Hh, mer: merNow };
    });
    device.queue.writeBuffer(volcBuf, 0, vdata);
  }
  const sdata = new Float32Array(7 * 4);
  function windParams(arr, o) {
    arr.set([S.windU, S.circ, S.shear, S.strat, S.turb, S.preU, (S.preDir * Math.PI) / 180, 0.12 * S.atm, simT, S.atm, 0, 0], o);
  }
  function simStep(enc, dt) {
    sdata.set([...gridDims, dt, S.radius, S.atm, Math.min(volcs.length, MAXV), simT, S.fallC, S.fallC / 40, 2 * 86400, S.lifeF * 86400, 1, clearFlag > 0 ? 1 : 0, 0, 0], 0);
    windParams(sdata, 16);
    device.queue.writeBuffer(simU, 0, sdata);
    const pass = enc.beginComputePass();
    pass.setPipeline(prepPipe); pass.setBindGroup(0, prepBG); pass.dispatchWorkgroups(1);
    pass.setPipeline(simPipe); pass.setBindGroup(0, simBG[ping]);
    pass.dispatchWorkgroups(Math.ceil(gridDims[0] / 8), Math.ceil(gridDims[1] / 8), Math.ceil(gridDims[2] / 4));
    pass.end();
    ping = 1 - ping; renderBG = null;
    if (clearFlag > 0) clearFlag--;
  }
  // Mehrere Schritte: jeder in eigener Übergabe, weil die Uniforms pro Schritt wechseln
  async function advance(seconds, maxDt = 600, report) {
    const n = Math.ceil(seconds / maxDt);
    for (let i = 0; i < n; i++) {
      const dt = seconds / n;
      updateVolcanoes();
      const enc = device.createCommandEncoder(); simStep(enc, dt); device.queue.submit([enc.finish()]);
      simT += dt;
      if (report && i % 6 === 5) { report(i / n); await device.queue.onSubmittedWorkDone(); }
    }
  }
  async function warmUp() {
    busyEl.textContent = t('Vorlauf …', 'Warm-up …');
    await advance(S.warm * 3600, 900, (f) => { busyEl.textContent = `${t('Vorlauf', 'Warm-up')} ${Math.round(f * 100)} %`; });
    await device.queue.onSubmittedWorkDone();
    busyEl.textContent = '';
  }

  // --- Kamera
  const cam = { yaw: 0.6, pitch: 0.18, alt: 9000 };
  const ptrs = new Map(); let pinch = 0;
  const zoom = (f) => { cam.alt = Math.min(60000, Math.max(80, cam.alt * f)); };
  canvas.addEventListener('pointerdown', (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); });
  const end = (e) => { ptrs.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointermove', (e) => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoom(pinch / dd); pinch = dd; return; }
    if (e.shiftKey || (e.buttons & 2)) {
      S.tilt = Math.max(0, Math.min(80, S.tilt - (e.clientY - p[1]) * 0.25));
      const el = document.getElementById('c-tilt'); if (el) { el.value = S.tilt; el.dispatchEvent(new Event('input')); }
      return;
    }
    const k = 0.005 * Math.min(1, (cam.alt / S.radius) * 0.8 + 0.08);
    cam.yaw -= (e.clientX - p[0]) * k; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + (e.clientY - p[1]) * k));
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => { e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0012)); }, { passive: false });

  // --- Schwere Änderungen
  let pending = new Set(), busy = false;
  onHeavy = (key, light) => {
    if (light) return;
    pending.add(key);
    if (!busy) runPending();
  };
  async function runPending() {
    busy = true;
    while (pending.size) {
      const keys = [...pending]; pending.clear();
      if (keys.includes('clear')) { clearFlag = 2; }
      if (keys.includes('erupt')) { S.superOn = true; superT = simT; }
      if (keys.some((k) => HEAVY.grid.has(k))) makeGrid();
      if (keys.some((k) => HEAVY.volc.has(k) || k === 'seed')) genVolcanoes();
      if (keys.includes('seed')) bakeNebula();
      if (keys.some((k) => HEAVY.bake.has(k))) await bake();
    }
    busy = false;
  }

  genVolcanoes();
  makeGrid();
  await bakeNebula();
  await bake();
  await warmUp();

  const rdata = new Float32Array(15 * 4);
  let last = performance.now(), acc = 0, frames = 0, frameNo = 0, visT = 0, autoScale = 1;
  function writeRender(w, h) {
    const dist = 1 + cam.alt / S.radius;
    const cy = Math.cos(cam.pitch);
    const eye = [Math.sin(cam.yaw) * cy * dist, Math.sin(cam.pitch) * dist, Math.cos(cam.yaw) * cy * dist];
    const fwd = eye.map((x) => -x / dist);
    const right = [-fwd[2], 0, fwd[0]].map((x, _, a) => x / Math.hypot(...a));
    const up0 = [right[1] * fwd[2] - right[2] * fwd[1], right[2] * fwd[0] - right[0] * fwd[2], right[0] * fwd[1] - right[1] * fwd[0]];
    // Blickneigung: vom Planetenmittelpunkt Richtung Horizont kippen (Säulen von der Seite sehen)
    const ti = (S.tilt * Math.PI) / 180 * Math.min(1, Math.asin(Math.min(1, 1 / dist)) / 0.9);
    for (let k = 0; k < 3; k++) { const f = fwd[k], u = up0[k]; fwd[k] = f * Math.cos(ti) + u * Math.sin(ti); up0[k] = u * Math.cos(ti) - f * Math.sin(ti); }
    const up = up0;
    const tanH = Math.tan(0.5 * 0.75);
    const az = (S.sunAz * Math.PI) / 180, el = (S.sunEl * Math.PI) / 180;
    const sunW = [Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)];
    const c = Math.cos(spinA), s = Math.sin(spinA);
    const sunP = [c * sunW[0] + s * sunW[2], sunW[1], -s * sunW[0] + c * sunW[2]];
    const HR = scaleHeight(), HM = HR * 0.14;
    rdata.set([...eye, tanH, ...right, w / h, ...up, S.exposure, ...fwd, 0, ...sunW, 22, ...sunP, (2 * tanH) / h,
      c, s, visT, simT, S.radius, S.atm, S.exag, Math.min(volcs.length, MAXV), HR, HM, S.relief, S.glow,
      S.kappa, S.detail, S.steps, 0, S.nebula, S.stars, S.debug, 0, w, h, frameNo % 64, gridDims[0]], 0);
    windParams(rdata, 48);
    device.queue.writeBuffer(renU, 0, rdata);
  }
  function drawTo(enc, view) {
    const rp = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
    rp.setPipeline(renPipe); rp.setBindGroup(0, getRenderBG()); rp.draw(3); rp.end();
  }
  // Ohne Fenster (Tests, KI-Augen): Bild in eine Textur rechnen und zurücklesen, keine Swapchain
  async function capture(w, h) {
    updateVolcanoes();
    const enc0 = device.createCommandEncoder(); simStep(enc0, 1); device.queue.submit([enc0.finish()]);
    writeRender(w, h);
    const tex = device.createTexture({ size: [w, h], format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
    const bpr = Math.ceil((w * 4) / 256) * 256;
    const buf = device.createBuffer({ size: bpr * h, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = device.createCommandEncoder();
    drawTo(enc, tex.createView());
    enc.copyTextureToBuffer({ texture: tex }, { buffer: buf, bytesPerRow: bpr }, [w, h]);
    device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const src = new Uint8Array(buf.getMappedRange());
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const c2 = cv.getContext('2d'); const img = c2.createImageData(w, h);
    const bgra = format.startsWith('bgra');
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * bpr + x * 4, o = (y * w + x) * 4;
      img.data[o] = src[i + (bgra ? 2 : 0)]; img.data[o + 1] = src[i + 1]; img.data[o + 2] = src[i + (bgra ? 0 : 2)]; img.data[o + 3] = 255;
    }
    buf.unmap(); buf.destroy(); tex.destroy();
    c2.putImageData(img, 0, 0);
    return cv.toDataURL('image/png');
  }
  const api = window.volcanoPlanet = { S, cam, ready: true, frames: 0, capture,
    advance: async (h) => { await advance(h * 3600, 900); await device.queue.onSubmittedWorkDone(); },
    spin: (a) => { spinA = a; },
    // Kamera auf Vulkan i richten (Planetensystem → Welt: Drehung um die Achse)
    look: (i, alt) => { const d = volcs[i].dir, c = Math.cos(spinA), s = Math.sin(spinA); const w = [c * d[0] - s * d[2], d[1], s * d[0] + c * d[2]];
      cam.yaw = Math.atan2(w[0], w[2]); cam.pitch = Math.asin(w[1]); if (alt) cam.alt = alt; return volcs[i]; },
    // Senkrechtes Profil des Aschegitters an Vulkan i, versetzt um dkm nach Osten (zum Prüfen)
    profile: async (i, dkm = 0) => {
      const [nx, ny, nz] = gridDims; const v = volcs[i].dir;
      const lon = Math.atan2(v[2], v[0]) + dkm / S.radius / Math.max(0.1, Math.cos(Math.asin(v[1]))), lat = Math.asin(v[1]);
      const x = Math.floor(((lon / (2 * Math.PI) + 0.5) % 1 + 1) % 1 * nx), y = Math.floor((lat / Math.PI + 0.5) * ny);
      const buf = device.createBuffer({ size: 256 * nz, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      const enc = device.createCommandEncoder();
      enc.copyTextureToBuffer({ texture: ash[ping], origin: [x, y, 0] }, { buffer: buf, bytesPerRow: 256, rowsPerImage: 1 }, [1, 1, nz]);
      device.queue.submit([enc.finish()]); await buf.mapAsync(GPUMapMode.READ);
      const u16 = new Uint16Array(buf.getMappedRange().slice(0));
      buf.unmap(); buf.destroy();
      const f16 = (h) => { const e = (h >> 10) & 31, m = h & 1023, sg = h >> 15 ? -1 : 1; return e === 0 ? sg * m * 2 ** -24 : e === 31 ? NaN : sg * (1 + m / 1024) * 2 ** (e - 15); };
      const out = []; for (let k = 0; k < nz; k++) out.push([f16(u16[k * 128]), f16(u16[k * 128 + 1])].map((q) => +q.toPrecision(3)));
      return out;
    },
    volcs: () => volcs.map((v) => ({ super: v.super, Rb: v.Rb, now: v.now })), trigger: () => onHeavy('erupt'), rebake: () => bake(), regen: () => { genVolcanoes(); } };
  if (OFFSCREEN) return;
  const frame = (now) => {
    const dtR = Math.min((now - last) / 1000, 0.1); last = now;
    acc += dtR; frames++; frameNo++; api.frames = frameNo;
    if (acc > 0.5) {
      const fps = frames / acc;
      document.getElementById('fps').textContent = `${Math.round(fps)} fps` + (S.auto && autoScale < 0.99 ? ` · ${Math.round(autoScale * 100)} %` : '');
      // Automatik: nur die Pixelzahl ändert sich, nie die Physik
      if (S.auto && fps < 50) autoScale = Math.max(0.3, autoScale * Math.sqrt(fps / 58));
      else if (S.auto && fps > 58) autoScale = Math.min(1, autoScale * 1.05);
      if (!S.auto) autoScale = 1;
      acc = 0; frames = 0;
    }
    if (!paused) {
      const dtS = dtR * S.lapse;
      const n = Math.min(4, Math.ceil(dtS / 900));
      for (let i = 0; i < n; i++) {
        updateVolcanoes();
        const e2 = device.createCommandEncoder(); simStep(e2, dtS / n); device.queue.submit([e2.finish()]);
        simT += dtS / n;
      }
      spinA += (dtS * 2 * Math.PI / 86400) * S.spin;
      visT += dtR * Math.min(S.lapse, 240);
    } else updateVolcanoes();
    const dpr = Math.min(devicePixelRatio || 1, 2) * S.scale * autoScale;
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    writeRender(w, h);
    const enc = device.createCommandEncoder();
    drawTo(enc, ctx.getCurrentTexture().createView());
    device.queue.submit([enc.finish()]);
    // Steckbrief
    if (frameNo % 15 === 1) {
      const sv = volcs.find((v) => v.super && v.now && v.now.act > 0);
      const active = volcs.filter((v) => v.now && v.now.act > 0).length;
      const d = Math.floor(simT / 86400), hh = Math.floor((simT % 86400) / 3600);
      factsEl.textContent = `${t('Höhe', 'Altitude')} ${Math.round(cam.alt).toLocaleString()} km · ${t('Tag', 'day')} ${d} ${hh}h · ${active} ${t('aktiv', 'active')}` +
        (sv ? ` · ${t('Supervulkan', 'supervolcano')} ${sv.now.H.toFixed(0)} km` : '');
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
start().catch((e) => fail(String(e && e.stack || e)));
</script>
