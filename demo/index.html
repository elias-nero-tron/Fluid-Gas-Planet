<style>
  /* Eine bewusst dunkle Oberfläche: der Planet leuchtet auf Weltraumschwarz.
     Farben aus Jupiters Wolken: Ammoniak-Creme für Text, Gürtel-Ocker als Akzent. */
  :root {
    color-scheme: dark;
    --space: #07080b;
    --panel: rgba(16, 17, 22, 0.86);
    --line: #2a2a30;
    --text: #ece4d4;
    --muted: #9a9384;
    --accent: #d7a15f;
    --accent-dim: #6b5234;
    --focus: #f1c98f;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--space);
    color: var(--text);
    font: 14px/1.45 var(--body);
    overflow: hidden;

  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }

    display: flex; flex-direction: column; gap: 2px; pointer-events: none;

  #fps { color: var(--accent); }

  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 55%, #14120f 0%, var(--space) 70%);
    transition: opacity 0.8s ease; z-index: 2;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .load-box { width: min(320px, 80%); display: grid; gap: 10px; text-align: center; }
  #load-title { margin: 0; font: 600 18px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); }
  .load-track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #load-bar { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.2s linear; }
  #load-note { margin: 0; min-height: 1.4em; font: 12px var(--mono); color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
  #status {
    position: absolute; inset: auto 16px 16px 16px; max-width: 520px; padding: 12px 14px;
    background: #2a1512; border: 1px solid #7a3326; border-radius: 6px; color: #f6d9cf;
  }

  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; overscroll-behavior: contain;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
    backdrop-filter: blur(8px);
  }
  #panel-toggle { display: none; }
  .panel-head { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 8px; }
  #lang { font: 600 12px var(--mono); letter-spacing: 0.08em; padding: 5px 9px; }
  .help {
    margin: 0 0 12px; padding: 10px 12px; min-height: 5.8em;
    border: 1px solid var(--line); border-radius: 6px; background: rgba(0, 0, 0, 0.35);
    color: var(--muted); font-size: 12.5px;
  }
  .help b { color: var(--text); font-weight: 500; }
  details { border-top: 1px solid var(--line); padding-block: 8px 10px; }
  summary {
    cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
    font: 600 15px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    padding-block: 4px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; font-family: var(--mono); color: var(--muted); }
  details[open] > summary::after { content: '–'; }
  .note { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding-block: 5px;
  }
  .row label { font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  .row-select { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
  select, button {
    font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; min-width: 0;
  }
  select { width: 100%; }
  .row-toggle label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .row-toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .row-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .row-file input { grid-column: 1 / -1; width: 100%; font: 12px var(--body); color: var(--muted); }
  .row-file input::file-selector-button {
    font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; margin-right: 8px; cursor: pointer;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent-dim); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .credits { margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .credits a { color: var(--muted); }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 58%;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0;
      transform: translateY(calc(100% - 48px - env(safe-area-inset-bottom, 0px)));
      transition: transform 0.25s ease;
      padding-block: 0 calc(24px + env(safe-area-inset-bottom, 0px));
    }
    aside.open { transform: none; }
    .panel-head { position: sticky; top: 0; z-index: 1; background: var(--panel); margin-bottom: 8px; }
    #panel-toggle {
      display: flex; flex: 1; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1; margin-bottom: 8px; padding: 14px 2px;
      background: none; border: 0; border-radius: 0; color: var(--text);
      font: 600 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--panel);
    }
    .hud h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }

const PI = 3.14159265359;
const MAX_STORMS = 16u;

struct Sim {

// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (st in [0,1]², Fläche) ohne Begrenzung.
fn cubeUV(d: vec3f) -> vec3f {
  let ad = abs(d);
  var face = 0.0; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0.0; sc = -d.z; } else { face = 1.0; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2.0; tc = d.z; } else { face = 3.0; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4.0; sc = d.x; } else { face = 5.0; sc = -d.x; }
    tc = -d.y;
  }
  return vec3f(vec2f(sc, tc) / ma * 0.5 + 0.5, face);
}

// Nahtloses bilineares Abtasten der Würfelfelder.
// Gemessen: das Hardware-Abtasten über Würfelkanten weicht bis zu 500-mal stärker ab als im
// Flächeninneren. Weil die Farbe jeden Schritt neu abgetastet wird, wachsen daraus Narben.
// Darum: im Inneren tastet die Hardware ab (dort exakt); nahe der Kante werden die vier
// Nachbar-Texel einzeln geholt, Texel jenseits der Kante über ihre Richtung auf der Nachbarfläche.
fn loadDir(t: texture_2d_array<f32>, s: sampler, q: vec3f) -> vec4f {
  let u = cubeUV(q);
  return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
}

fn sampleCube(t: texture_2d_array<f32>, s: sampler, p: vec3f) -> vec4f {
  let n = f32(textureDimensions(t).x);
  let u = cubeUV(p);
  let x = u.xy * n - 0.5;
  if (all(x >= vec2f(0.0)) && all(x <= vec2f(n - 1.0))) {
    return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
  }
  let i0 = floor(x);
  let f = x - i0;
  let face = u32(u.z);
  var c: array<vec4f, 4>;
  for (var k = 0u; k < 4u; k++) {
    let ij = i0 + vec2f(f32(k & 1u), f32(k >> 1u));
    if (all(ij >= vec2f(0.0)) && all(ij <= vec2f(n - 1.0))) {
      c[k] = textureLoad(t, vec2i(ij), i32(face), 0);
    } else {
      c[k] = loadDir(t, s, faceDir(face, (ij + 0.5) / n));
    }
  }
  return mix(mix(c[0], c[1], f.x), mix(c[2], c[3], f.x), f.y);
}

// Richtung -> (Fläche, Texel) für Schreibzugriffe aus Partikeln.
fn dirToTexel(d: vec3f, n: u32) -> vec3u {
  let ad = abs(d);
  var face = 0u; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0u; sc = -d.z; } else { face = 1u; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2u; tc = d.z; } else { face = 3u; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4u; sc = d.x; } else { face = 5u; sc = -d.x; }
    tc = -d.y;
  }
  let st = clamp(vec2f(sc, tc) / ma * 0.5 + 0.5, vec2f(0.0), vec2f(0.99999));
  let px = vec2u(st * f32(n));
  return vec3u(px, face);
}

// Orthonormale Tangentenbasis. Die Wahl darf von Punkt zu Punkt springen,
// weil Divergenz, Laplace und Gradient unabhängig von der Basisdrehung sind.
fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  let e2 = cross(p, e1);
  return mat2x3f(e1, e2);
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

// ---------- Tabellen ----------

fn jetAt(lat: f32) -> f32 {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  let a = S.jets[i / 4u][i % 4u];
  let b = S.jets[j / 4u][j % 4u];
  return mix(a, b, fract(x)) * S.jetStrength;
}

fn bandAt(lat: f32) -> vec3f {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  return mix(S.bands[i].rgb, S.bands[j].rgb, fract(x));
}

// ---------- Zufall und Rauschen ----------

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn hash3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;
}

fn rand4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u));
  let g = pcg3d(h.zxy ^ vec3u(b, a, 7u));
  return vec4f(vec3f(h), f32(g.x)) / 4294967295.0;
}

// Gradientenrauschen mit analytischer Ableitung: x = Wert, yzw = Gradient.
fn noised(x: vec3f) -> vec4f {
  let i = floor(x);
  let f = fract(x);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);

  let ga = hash3(i + vec3f(0.0, 0.0, 0.0));
  let gb = hash3(i + vec3f(1.0, 0.0, 0.0));
  let gc = hash3(i + vec3f(0.0, 1.0, 0.0));
  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));
  let ge = hash3(i + vec3f(0.0, 0.0, 1.0));
  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));
  let gg = hash3(i + vec3f(0.0, 1.0, 1.0));
  let gh = hash3(i + vec3f(1.0, 1.0, 1.0));

  let va = dot(ga, f - vec3f(0.0, 0.0, 0.0));
  let vb = dot(gb, f - vec3f(1.0, 0.0, 0.0));
  let vc = dot(gc, f - vec3f(0.0, 1.0, 0.0));
  let vd = dot(gd, f - vec3f(1.0, 1.0, 0.0));
  let ve = dot(ge, f - vec3f(0.0, 0.0, 1.0));
  let vf = dot(gf, f - vec3f(1.0, 0.0, 1.0));
  let vg = dot(gg, f - vec3f(0.0, 1.0, 1.0));
  let vh = dot(gh, f - vec3f(1.0, 1.0, 1.0));

  let k0 = va;
  let k1 = vb - va;
  let k2 = vc - va;
  let k3 = ve - va;
  let k4 = va - vb - vc + vd;
  let k5 = va - vc - ve + vg;
  let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;

  let value = k0 + u.x * k1 + u.y * k2 + u.z * k3 + u.x * u.y * k4 + u.y * u.z * k5
            + u.z * u.x * k6 + u.x * u.y * u.z * k7;

  let grad = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga)
           + u.x * u.y * (ga - gb - gc + gd) + u.y * u.z * (ga - gc - ge + gg)
           + u.z * u.x * (ga - gb - ge + gf) + u.x * u.y * u.z * (-ga + gb + gc - gd + ge - gf - gg + gh)
           + du * (vec3f(k1, k2, k3) + u.yzx * vec3f(k4, k5, k6) + u.zxy * vec3f(k6, k4, k5)
                   + u.yzx * u.zxy * k7);
  return vec4f(value, grad);
}

// Divergenzfreies Rauschfeld auf der Kugel: v = p × ∇ψ (ψ = FBM-Rauschen als Stromfunktion).
fn curlOnSphere(p: vec3f, freq: f32, t: f32, octaves: i32) -> vec3f {
  var g = vec3f(0.0);
  var amp = 1.0;
  var fr = freq;
  for (var o = 0; o < octaves; o++) {
    let off = vec3f(f32(o) * 17.3, t * (1.0 + 0.37 * f32(o)), f32(o) * -9.1);
    g += noised(p * fr + off).yzw * amp * fr / freq;
    amp *= 0.5;
    fr *= 2.03;
  }
  return cross(p, g);
}

fn stormW(i: u32) -> f32 { return S.stormWeight[i / 4u][i % 4u]; }

// Drehfeld der angetriebenen Stürme: Rotation um das Zentrum, Gauß-Profil.
fn stormFlow(p: vec3f) -> vec3f {
  var v = vec3f(0.0);
  let n = u32(S.stormCount);
  for (var i = 0u; i < min(n, MAX_STORMS); i++) {
    let c = S.storms[i].xyz;
    let r = S.storms[i].w;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    let x = d / r;
    // Geschwindigkeit ~ x·exp(−x²): null im Kern, Maximum am Rand, dann Abfall.
    let prof = x * exp(-x * x) * 2.33;
    v += cross(c, p) / max(sin(d), 1e-4) * prof * S.stormInfo[i].x * stormW(i);
  }
  return v * S.stormStrength;
}

// scale: Maskenradius relativ zum Sturmradius
fn stormMask(p: vec3f, scale: f32) -> vec4f {
  var tint = vec3f(0.0);
  var w = 0.0;
  let n = u32(S.stormCount);
  for (var i = 0u; i < min(n, MAX_STORMS); i++) {
    let c = S.storms[i].xyz;
    let r = S.storms[i].w;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    let m = exp(-pow(d / (r * scale), 2.0)) * stormW(i);
    tint += S.stormInfo[i].yzw * m;
    w += m;
  }
  return vec4f(tint / max(w, 1e-4), min(w, 1.0));
}

  ax: f32, ay: f32, // 1/Abstand² für den Laplace-Operator

  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));

  let dB = c.pN - c.pS;

  c.e2 = cross(c.p, c.e1);

  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  let det = a * dd - b * cc;
  // Inverse von [[a, b], [cc, dd]] (WGSL-Matrizen sind spaltenweise).
  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / det);
  let hx = length(dA) * 0.5;
  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);
  return c;
}

fn zbin(p: vec3f) -> u32 { return min(u32((latitude(p) / PI + 0.5) * f32(ZBINS)), ZBINS - 1u); }

var<workgroup> wsum: array<atomic<i32>, 256>;

// Erst je Arbeitsgruppe im schnellen Gruppenspeicher summieren, dann nur die belegten
// Bänder in den globalen Puffer: ~64× weniger konkurrierende globale Atomics.
@compute @workgroup_size(8, 8, 1)
fn zonalSum(@builtin(global_invocation_id) id: vec3u, @builtin(local_invocation_index) li: u32) {

  }

fn zonalMean(p: vec3f) -> f32 {

  let g2 = grad2(c, dot(dA, c.e2), dot(dB, c.e2));

}

}

  p1: vec4f,        // x Kartenmodus, y Ring innen, z Ring außen, w Ring-Deckkraft
  p2: vec4f,        // x Seitenverhältnis, y Zeit, z Belichtung, w Farbstoff-Auflösung
  ringColor: vec4f, // rgb, w Ringfaden-Kontrast
  p3: vec4f,        // x Fluss-Skala für Debug-Ansichten, y Pixelwinkel (rad)

@group(0) @binding(0) var<uniform> U: R;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var dyeTex: texture_cube<f32>;
@group(0) @binding(3) var velTex: texture_cube<f32>;
@group(0) @binding(4) var auxTex: texture_cube<f32>;
@group(0) @binding(5) var prsTex: texture_cube<f32>;

const PI = 3.14159265359;

struct VOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VOut {
  let xy = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  var o: VOut;
  o.pos = vec4f(xy, 0.0, 1.0);
  o.ndc = xy;
  return o;
}

fn toBody(v: vec3f) -> vec3f { return vec3f(dot(U.body0.xyz, v), dot(U.body1.xyz, v), dot(U.body2.xyz, v)); }

fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract(q.x * q.y);
}

fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  return mat2x3f(e1, cross(p, e1));
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

// Ellipsoid x² + (y/c)² + z² = 1 mit c = 1 − Abplattung. Rückgabe: t oder −1.
fn hitPlanet(o: vec3f, d: vec3f) -> f32 {
  let c = 1.0 - U.p0.x;
  let s = vec3f(1.0, 1.0 / c, 1.0);
  let os = o * s; let ds = d * s;
  let a = dot(ds, ds);
  let b = dot(os, ds);
  let k = dot(os, os) - 1.0;
  let disc = b * b - a * k;
  if (disc < 0.0) { return -1.0; }
  let t = (-b - sqrt(disc)) / a;
  return select(-1.0, t, t > 0.0);
}

fn smoothHash(x: f32, salt: f32) -> f32 {
  let i = floor(x);
  let f = fract(x);
  return mix(hash21(vec2f(i, salt)), hash21(vec2f(i + 1.0, salt)), f * f * (3.0 - 2.0 * f));
}

// footprint: Breite eines Bildschirmpixels auf der Ringebene (in Planetenradien).
// Feinstruktur, die schmaler als ein Pixel ist, wird ausgeblendet statt zu flimmern.
fn ringDensity(r: f32, footprint: f32) -> f32 {
  let inner = U.p1.y; let outer = U.p1.z;
  if (r < inner || r > outer || outer <= inner) { return 0.0; }
  let x = (r - inner) / (outer - inner);
  // Grobe Struktur: dichter Hauptring, Lücke wie die Cassini-Teilung, schwacher Außenring.
  var d = smoothstep(0.0, 0.08, x) * (1.0 - smoothstep(0.93, 1.0, x));
  d *= mix(0.35, 1.0, smoothstep(0.18, 0.35, x));
  d *= 1.0 - 0.9 * (smoothstep(0.60, 0.62, x) - smoothstep(0.66, 0.68, x));
  d *= 1.0 - 0.6 * (smoothstep(0.86, 0.865, x) - smoothstep(0.87, 0.875, x));
  let span = footprint / (outer - inner);
  let fineW = 1.0 - smoothstep(0.5 / 420.0, 2.0 / 420.0, span);
  let coarseW = 1.0 - smoothstep(0.5 / 90.0, 2.0 / 90.0, span);
  let fine = mix(0.5, smoothHash(x * 420.0, 3.0), fineW) * 0.5 + mix(0.5, smoothHash(x * 90.0, 7.0), coarseW) * 0.5;
  d *= mix(1.0, fine * 1.4 + 0.3 * (1.0 - fineW), U.ringColor.w);
  return clamp(d, 0.0, 1.0) * U.p1.w;
}

fn aces(x: vec3f) -> vec3f {
  let a = 2.51; let b = 0.03; let c = 2.43; let d = 0.59; let e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), vec3f(0.0), vec3f(1.0));
}

fn diverging(v: f32) -> vec3f {
  let t = clamp(v, -1.0, 1.0);
  let neg = vec3f(0.15, 0.45, 0.95);
  let pos = vec3f(0.95, 0.35, 0.15);
  return mix(vec3f(0.06), select(neg, pos, t > 0.0), abs(t));
}

// Farbe einer Stelle auf der Kugel je nach Ansicht.
fn surface(q: vec3f, mode: i32) -> vec3f {
  let fs = U.p3.x;
  if (mode == 1) {
    let v = textureSampleLevel(velTex, samp, q, 0.0).xyz;
    let tb = mat2x3f(east(q), cross(q, east(q)));
    let e = dot(v, tb[0]) * fs;
    let n = dot(v, tb[1]) * fs;
    return vec3f(0.5 + 0.5 * clamp(e, -1.0, 1.0), 0.5 + 0.5 * clamp(n, -1.0, 1.0), 0.6) * min(1.0, length(vec2f(e, n)) * 1.5 + 0.15);
  }
  if (mode == 2) { return diverging(textureSampleLevel(auxTex, samp, q, 0.0).x * fs * 0.015); }

  if (mode == 3) { return diverging(textureSampleLevel(prsTex, samp, q, 0.0).x * 60.0 * fs * fs * 0.25); }
  return textureSampleLevel(dyeTex, samp, q, 0.0).rgb;
}

fn luminance(c: vec3f) -> f32 { return dot(c, vec3f(0.3, 0.59, 0.11)); }

fn stars(d: vec3f) -> vec3f {
  let uv = vec2f(atan2(d.z, d.x), asin(clamp(d.y, -1.0, 1.0))) * 180.0;
  let cell = floor(uv);
  let h = hash21(cell);
  let f = fract(uv) - 0.5;
  let s = smoothstep(0.25, 0.0, length(f)) * step(0.985, h);
  return vec3f(0.8, 0.85, 1.0) * s * (h - 0.985) * 40.0;
}

@fragment
fn fs(vin: VOut) -> @location(0) vec4f {

    let lat = (uv.y - 0.5) * PI;

  }

  let o = toBody(U.camPos.xyz);
  let d = toBody(dir);
  let sun = normalize(toBody(U.sun.xyz));
  let c = 1.0 - U.p0.x;

  var col = stars(dir);
  var tPlanet = hitPlanet(o, d);

  // Atmosphärensaum außerhalb der Planetenscheibe.

    let cp = o + d * tc;
    let ce = cp * vec3f(1.0, 1.0 / c, 1.0);
    let h = length(ce) - 1.0;
    let lit = smoothstep(-0.3, 0.4, dot(normalize(cp), sun));
    col += U.atmo.rgb * exp(-max(h, 0.0) / 0.025) * U.atmo.w * lit * U.sun.w;
  } else {
    let hp = o + d * tPlanet;
    let hs = hp * vec3f(1.0, 1.0 / c, 1.0);
    let q = normalize(hs);
    var n = normalize(hp * vec3f(1.0, 1.0 / (c * c), 1.0));

    var albedo = surface(q, mode);
    if (mode == 0) {
      // Relief aus der Helligkeit: helle Wolken liegen höher (Ammoniak-Eis), dunkle tiefer.
      if (U.p0.y > 0.0) {
        let tb = tangentBasis(q);
        let e = 3.0 / U.p2.w;
        let lx = luminance(surface(normalize(q + tb[0] * e), 0)) - luminance(surface(normalize(q - tb[0] * e), 0));
        let ly = luminance(surface(normalize(q + tb[1] * e), 0)) - luminance(surface(normalize(q - tb[1] * e), 0));
        n = normalize(n - (tb[0] * lx + tb[1] * ly) * U.p0.y * 3.0);
      }
      let v = -d;
      let ndl = dot(n, sun);
      let ndv = max(dot(n, v), 1e-3);

        }
      }
      let rim = pow(1.0 - ndv, 3.0) * U.atmo.w * smoothstep(-0.2, 0.3, ndl);
      col = albedo * light * U.sun.w + U.atmo.rgb * rim * U.sun.w;
    } else {
      col = albedo;
    }
  }

  // Ringe: vor dem Planeten drübermischen, dahinter verdeckt.
  if (U.p1.w > 0.0 && abs(d.y) > 1e-5 && mode == 0) {
    let tr = -o.y / d.y;
    if (tr > 0.0 && (tPlanet < 0.0 || tr < tPlanet)) {
      let rp = o + d * tr;
      let footprint = tr * U.p3.y / max(abs(d.y), 0.02);
      let dens = ringDensity(length(rp.xz), footprint);
      if (dens > 0.0) {
        var lit = 0.35 + 0.65 * abs(sun.y);
        if (hitPlanet(rp + sun * 1e-3, sun) > 0.0) { lit *= 0.08; }
        let rc = U.ringColor.rgb * lit * U.sun.w;
        col = mix(col, rc, dens);
      }
    }
  }

  var outc = col;
  if (mode == 0) { outc = aces(col * U.p2.z); }
  return vec4f(pow(outc, vec3f(1.0 / 2.2)), 1.0);
}
