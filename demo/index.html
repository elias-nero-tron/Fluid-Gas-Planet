<html lang="en">
<head>

<title>Fluid Gas Planet</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* Eine bewusst dunkle Oberfläche: der Planet leuchtet auf Weltraumschwarz.

  :root {

    --space: #07080b;
    --panel: rgba(16, 17, 22, 0.86);
    --line: #2a2a30;
    --text: #ece4d4;
    --muted: #9a9384;
    --accent: #d7a15f;
    --accent-dim: #6b5234;
    --focus: #f1c98f;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--space);
    color: var(--text);
    font: 14px/1.45 var(--body);
    overflow: hidden;

  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  #view.map { cursor: default; }

  .hud {
    position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px;
    display: flex; flex-direction: column; gap: 2px; pointer-events: none;
  }
  .hud h1 {
    margin: 0; font: 600 26px/1.05 var(--display); letter-spacing: 0.04em; text-transform: uppercase;
    text-wrap: balance;
  }
  .hud .meta { font: 12px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  /* Steckbrief des Planeten oben links */
  .facts-name { font: 13px/1.4 var(--mono); color: var(--text); margin-top: 2px; }
  .facts-name span { color: var(--muted); }
  .facts {
    display: grid; grid-template-columns: max-content max-content; gap: 1px 12px; margin: 4px 0 6px; padding: 7px 10px;
    font: 11.5px/1.4 var(--mono); background: rgba(10, 12, 16, 0.55); border: 1px solid var(--line); border-radius: 6px;
    width: max-content; max-width: 100%;
  }
  .facts dt { color: #8fa6c4; }
  .facts dd { margin: 0; color: var(--text); font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .facts { display: none; } }
    /* Feste Breite: wechselnde Ziffern verschieben nichts (HUD-Springen, v0.3-Rückmeldung). */
  #fps { color: var(--accent); display: inline-block; min-width: 26ch; white-space: nowrap; }
  /* ⓘ neben jedem Regler, Blase beim Drüberfahren, Erklärfenster unten links über dem Planeten */
  .row .info { display: inline-grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; background: none; color: #7f8aa0; cursor: pointer; justify-self: start; }
  .row .info svg { width: 16px; height: 16px; }
  .row .info:hover, .row .info:focus-visible { color: var(--accent); }
  .tip {
    position: fixed; z-index: 20; max-width: 280px; padding: 7px 10px; pointer-events: none;
    background: #0d0e12; border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-size: 12.5px; line-height: 1.4; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .detail {
    position: fixed; z-index: 15; left: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px));
    max-height: 45vh; overflow-y: auto; padding: 12px 14px; box-sizing: border-box;
    background: rgba(13, 14, 18, 0.95); border: 1px solid var(--line); border-radius: 8px;
    color: var(--muted); font-size: 13px; line-height: 1.5;
  }
  .detail h3 { margin: 0 24px 6px 0; font: 600 15px var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); }
  .detail .detail-close { position: absolute; top: 8px; right: 8px; padding: 2px 7px; }
  .detail .reset-hint { margin: 8px 0 0; font-size: 12px; }

  /* Ladebild: dahinter rechnet die Simulation im Schnelldurchlauf vor. */
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 55%, #14120f 0%, var(--space) 70%);
    transition: opacity 0.8s ease; z-index: 2;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  .load-box { width: min(320px, 80%); display: grid; gap: 10px; text-align: center; }
  #load-title { margin: 0; font: 600 18px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); }
  .load-track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #load-bar { display: block; height: 100%; width: 0%; background: var(--accent); transition: width 0.2s linear; }
  #load-note { margin: 0; min-height: 1.4em; font: 12px var(--mono); color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { #loading { transition: none; } }
  #status {
    position: absolute; inset: auto 16px 16px 16px; max-width: 520px; padding: 12px 14px;
    background: #2a1512; border: 1px solid #7a3326; border-radius: 6px; color: #f6d9cf;
  }

  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; overscroll-behavior: contain;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
    backdrop-filter: blur(8px);
  }
  #panel-toggle { display: none; }
  .panel-head {
    display: flex; justify-content: flex-end; align-items: center; gap: 8px;
    position: sticky; top: calc(-12px - env(safe-area-inset-top, 0px)); z-index: 3;
    margin: -12px -16px 8px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #toolbar { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  #toolbar button { padding: 5px 8px; font-size: 12.5px; white-space: nowrap; }
  #lang { font: 600 12px var(--mono); letter-spacing: 0.08em; padding: 5px 9px; }
  .fx { display: block; margin-top: 6px; font: 11.5px/1.45 var(--mono); color: #d9c7a6; white-space: normal; }
  .note.formula { margin-top: 0; }
  details { border-top: 1px solid var(--line); padding-block: 8px 10px; }
  summary {
    cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
    font: 600 15px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    padding-block: 4px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; font-family: var(--mono); color: var(--muted); }
  details[open] > summary::after { content: '–'; }
  .note { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 8px; padding-block: 5px;
  }
  .row[hidden] { display: none; }
  .row label { font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  .row-select { grid-template-columns: minmax(0, max-content) auto minmax(0, 1.3fr); }
  select, button {
    font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; min-width: 0;
  }
  select { width: 100%; }
  .row-toggle label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .row-toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .row-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .row-save { display: flex; gap: 8px; align-items: center; }
  .row-save input, .row-save select { flex: 1; min-width: 0; }
  input[type=text] {
    font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  .reset-hint { color: var(--muted); }
  .row label { cursor: default; user-select: none; }
  .row-file input { grid-column: 1 / -1; width: 100%; font: 12px var(--body); color: var(--muted); }
  .row-file input::file-selector-button {
    font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; margin-right: 8px; cursor: pointer;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent-dim); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .credits { margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .credits a { color: var(--muted); }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 58%;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0;
      transform: translateY(calc(100% - 48px - env(safe-area-inset-bottom, 0px)));
      transition: transform 0.25s ease;
      padding-block: 0 calc(24px + env(safe-area-inset-bottom, 0px));
    }
    aside.open { transform: none; }
    .panel-head { top: 0; margin: 0 -16px 8px; padding: 0 16px 8px; flex-wrap: wrap; }
    .detail { top: 16px; bottom: auto; max-height: 40vh; }
    #panel-toggle {
      display: flex; flex: 1; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1; margin-bottom: 8px; padding: 14px 2px;
      background: none; border: 0; border-radius: 0; color: var(--text);
      font: 600 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--panel);
    }
    .hud h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }

// Alle Felder liegen als Cubemap (6 Ebenen) auf der Einheitskugel.
// Vektoren (Wind) werden als 3D-Tangentialvektoren in Körperkoordinaten gespeichert,
// dadurch gibt es keine Pol-Singularität und keine Sonderfälle an Würfelkanten.

const PI = 3.14159265359;
const MAX_STORMS = 16u;

struct Sim {
  dt: f32, time: f32, frame: f32, velN: f32,
  dyeN: f32, flowN: f32, vortexStrength: f32, omega: f32,
  jetStrength: f32, jetRelax: f32, turbulence: f32, turbScale: f32,
  confinement: f32, drag: f32, fineStripes: f32, bfecc: f32,
  bandRelax: f32, convection: f32, stormStrength: f32, stormCount: f32,
  curlStrength: f32, curlFreq: f32, curlSpeed: f32, curlOctaves: f32,
  particleCount: f32, lifetime: f32, opacity: f32, blur: f32,
  seed: f32, bandWobble: f32, stormTint: f32, vortexCount: f32,
  cloud: vec4f,                 // Farbe aufsteigender Konvektionswolken (linear RGB)
  centre: vec4f,                // Partikel-Schiene: rgb Mittelfarbe, zu der die Textur verblasst; w Verblass-Rate (1/s)
  view: vec4f,                  // xyz Kamerarichtung in Körperkoordinaten, w Anteil der Partikel im Sichtfeld
  mode: vec4f,                  // x 1 = reine Partikel-Schiene (jasper-r), yzw frei
  jets: array<vec4f, 16>,       // 64 Stützstellen, Breite −90°..+90°, Einheit rad/s bei jetStrength 1
  bands: array<vec4f, 64>,      // Bandfarbe (linear RGB) je Breite
  storms: array<vec4f, 16>,     // xyz Zentrum (Körperkoordinaten), w Radius in rad
  stormInfo: array<vec4f, 16>,  // x Drehsinn·Stärke, yzw Farbe
  stormWeight: array<vec4f, 4>, // wie stark jeder Sturm gerade angetrieben wird (0 = frei)
};

@group(0) @binding(0) var<uniform> S: Sim;

// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (st in [0,1]², Fläche) ohne Begrenzung.
fn cubeUV(d: vec3f) -> vec3f {
  let ad = abs(d);
  var face = 0.0; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0.0; sc = -d.z; } else { face = 1.0; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2.0; tc = d.z; } else { face = 3.0; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4.0; sc = d.x; } else { face = 5.0; sc = -d.x; }
    tc = -d.y;
  }
  return vec3f(vec2f(sc, tc) / ma * 0.5 + 0.5, face);
}

// Nahtloses bilineares Abtasten der Würfelfelder.
// Gemessen: das Hardware-Abtasten über Würfelkanten weicht bis zu 500-mal stärker ab als im
// Flächeninneren. Weil die Farbe jeden Schritt neu abgetastet wird, wachsen daraus Narben.
// Darum: im Inneren tastet die Hardware ab (dort exakt); nahe der Kante werden die vier
// Nachbar-Texel einzeln geholt, Texel jenseits der Kante über ihre Richtung auf der Nachbarfläche.
fn loadDir(t: texture_2d_array<f32>, s: sampler, q: vec3f) -> vec4f {
  let u = cubeUV(q);
  return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
}

fn sampleCube(t: texture_2d_array<f32>, s: sampler, p: vec3f) -> vec4f {
  let n = f32(textureDimensions(t).x);
  let u = cubeUV(p);
  let x = u.xy * n - 0.5;
  if (all(x >= vec2f(0.0)) && all(x <= vec2f(n - 1.0))) {
    return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
  }
  let i0 = floor(x);
  let f = x - i0;
  let face = u32(u.z);
  var c: array<vec4f, 4>;
  for (var k = 0u; k < 4u; k++) {
    let ij = i0 + vec2f(f32(k & 1u), f32(k >> 1u));
    if (all(ij >= vec2f(0.0)) && all(ij <= vec2f(n - 1.0))) {
      c[k] = textureLoad(t, vec2i(ij), i32(face), 0);
    } else {
      c[k] = loadDir(t, s, faceDir(face, (ij + 0.5) / n));
    }
  }
  return mix(mix(c[0], c[1], f.x), mix(c[2], c[3], f.x), f.y);
}

// Richtung -> (Fläche, Texel) für Schreibzugriffe aus Partikeln.
fn dirToTexel(d: vec3f, n: u32) -> vec3u {
  let ad = abs(d);
  var face = 0u; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0u; sc = -d.z; } else { face = 1u; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2u; tc = d.z; } else { face = 3u; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4u; sc = d.x; } else { face = 5u; sc = -d.x; }
    tc = -d.y;
  }
  let st = clamp(vec2f(sc, tc) / ma * 0.5 + 0.5, vec2f(0.0), vec2f(0.99999));
  let px = vec2u(st * f32(n));
  return vec3u(px, face);
}

// Orthonormale Tangentenbasis. Die Wahl darf von Punkt zu Punkt springen,
// weil Divergenz, Laplace und Gradient unabhängig von der Basisdrehung sind.
fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  let e2 = cross(p, e1);
  return mat2x3f(e1, e2);
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

// ---------- Tabellen ----------

fn jetAt(lat: f32) -> f32 {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  let a = S.jets[i / 4u][i % 4u];
  let b = S.jets[j / 4u][j % 4u];
  return mix(a, b, fract(x)) * S.jetStrength;
}

fn bandAt(lat: f32) -> vec3f {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  return mix(S.bands[i].rgb, S.bands[j].rgb, fract(x));
}

// ---------- Zufall und Rauschen ----------

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn hash3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;
}

fn rand4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u));
  let g = pcg3d(h.zxy ^ vec3u(b, a, 7u));
  return vec4f(vec3f(h), f32(g.x)) / 4294967295.0;
}

// Gradientenrauschen mit analytischer Ableitung: x = Wert, yzw = Gradient.
fn noised(x: vec3f) -> vec4f {
  let i = floor(x);
  let f = fract(x);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);

  let ga = hash3(i + vec3f(0.0, 0.0, 0.0));
  let gb = hash3(i + vec3f(1.0, 0.0, 0.0));
  let gc = hash3(i + vec3f(0.0, 1.0, 0.0));
  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));
  let ge = hash3(i + vec3f(0.0, 0.0, 1.0));
  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));
  let gg = hash3(i + vec3f(0.0, 1.0, 1.0));
  let gh = hash3(i + vec3f(1.0, 1.0, 1.0));

  let va = dot(ga, f - vec3f(0.0, 0.0, 0.0));
  let vb = dot(gb, f - vec3f(1.0, 0.0, 0.0));
  let vc = dot(gc, f - vec3f(0.0, 1.0, 0.0));
  let vd = dot(gd, f - vec3f(1.0, 1.0, 0.0));
  let ve = dot(ge, f - vec3f(0.0, 0.0, 1.0));
  let vf = dot(gf, f - vec3f(1.0, 0.0, 1.0));
  let vg = dot(gg, f - vec3f(0.0, 1.0, 1.0));
  let vh = dot(gh, f - vec3f(1.0, 1.0, 1.0));

  let k0 = va;
  let k1 = vb - va;
  let k2 = vc - va;
  let k3 = ve - va;
  let k4 = va - vb - vc + vd;
  let k5 = va - vc - ve + vg;
  let k6 = va - vb - ve + vf;

@group(0) @binding(3) var srcB: texture_cube<f32>;
@group(0) @binding(4) var dst: texture_storage_2d_array<rgba16float, write>;

  info: vec4f,  // x Lebensdauer, yzw Farbe

  return textureSampleLevel(srcA, samp, d, 0.0);
}
fn B(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrB, samp, d); }
  return textureSampleLevel(srcB, samp, d, 0.0);
}

fn texDir(id: vec3u, n: f32) -> vec3f { return faceDir(id.z, (vec2f(id.xy) + 0.5) / n); }

// Bänder mit mäandernden Rändern: die Breite wird leicht verrauscht, bevor die
// Bandfarbe nachgeschlagen wird.
fn bandTarget(p: vec3f) -> vec3f {
  let w = noised(p * 4.0 + vec3f(S.seed, S.time * 0.01, 0.0)).x;
  let lat = latitude(p) + w * S.bandWobble * 0.04;
  // Feine Streifen innerhalb der Bänder: ohne feine Farbunterschiede kann die Strömung
  // keine sichtbaren Filamente ziehen (ein gedehnter glatter Verlauf bleibt glatt).
  if (S.fineStripes <= 0.0) { return bandAt(lat); }   // spart 2 Rauschberechnungen pro Texel
  let fine = noised(vec3f(lat * 45.0, S.seed * 7.0, 0.5)).x + 0.6 * noised(vec3f(lat * 110.0, S.seed * 3.0, 2.5)).x;

fn convectionSpot(p: vec3f) -> f32 {
  let n = noised(p * 13.0 + vec3f(S.seed * 3.1, 0.0, S.time * 0.04)).x;
  // Aufsteigende Wolkentürme vor allem in niedrigen und mittleren Breiten.

// Jets schwach sind (sonst zerreißt die Scherung sie sofort). Drehsinn wie die lokale Scherung,
// Drehprofil ω(d) = ω₀·sin(π·d/r) innerhalb des Radius.
fn curlVortices(p: vec3f) -> vec3f {
  var v = vec3f(0.0);
  let n = u32(S.vortexCount);
  let peak = max(abs(S.jetStrength), 1e-5);
  for (var i = 0u; i < n; i++) {
    let r4 = rand4(i + 17u, u32(S.seed * 1000.0) + 991u);
    let z = r4.x * 1.7 - 0.85;                     // nicht direkt an den Polen
    let phi = r4.y * 2.0 * PI;
    let s = sqrt(1.0 - z * z);
    let c = vec3f(s * cos(phi), z, s * sin(phi));
    let lat = asin(z);
    if (abs(jetAt(lat)) > 0.35 * peak) { continue; }
    let rad = 0.025 + r4.z * 0.05;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    if (d >= rad) { continue; }
    // Hintergrund-Wirbelstärke ζ ≈ −∂U/∂φ: Wirbel mit gleichem Vorzeichen überleben in der Scherung.
    let shear = jetAt(lat + 0.01) - jetAt(lat - 0.01);
    let sgn = select(1.0, -1.0, shear > 0.0);
    let omega = sin(PI * d / rad) * S.vortexStrength * peak / rad * (0.6 + 0.8 * r4.w);
    v += cross(c, p) / max(sin(d), 1e-4) * omega * d * sgn;
  }

  camPos: vec4f,

  sun: vec4f,       // xyz Richtung (Welt), w Intensität
  atmo: vec4f,      // rgb Farbe, w Stärke

struct VOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VOut {

fn hash21(p: vec2f) -> f32 {

fn tangentBasis(p: vec3f) -> mat2x3f {

  if (mode == 0) { outc = aces(col * U.p2.z); }
  return vec4f(pow(outc, vec3f(1.0 / 2.2)), 1.0);
