// Alle Felder liegen als Cubemap (6 Ebenen) auf der Einheitskugel.
// Vektoren (Wind) werden als 3D-Tangentialvektoren in Körperkoordinaten gespeichert,
// dadurch gibt es keine Pol-Singularität und keine Sonderfälle an Würfelkanten.

const PI = 3.14159265359;
const MAX_STORMS = 16u;

struct Sim {
  dt: f32, time: f32, frame: f32, velN: f32,
  dyeN: f32, flowN: f32, vortexStrength: f32, omega: f32,
  jetStrength: f32, jetRelax: f32, turbulence: f32, turbScale: f32,
  confinement: f32, drag: f32, fineStripes: f32, bfecc: f32,
  bandRelax: f32, convection: f32, stormStrength: f32, stormCount: f32,
  curlStrength: f32, curlFreq: f32, curlSpeed: f32, curlOctaves: f32,
  particleCount: f32, lifetime: f32, opacity: f32, blur: f32,
  seed: f32, bandWobble: f32, stormTint: f32, vortexCount: f32,
  cloud: vec4f,                 // Farbe aufsteigender Konvektionswolken (linear RGB)
  centre: vec4f,                // Partikel-Schiene: rgb Mittelfarbe, zu der die Textur verblasst; w Verblass-Rate (1/s)
  view: vec4f,                  // xyz Kamerarichtung in Körperkoordinaten, w Anteil der Partikel im Sichtfeld
  mode: vec4f,                  // x 1 = reine Partikel (jasper-r), y Strudel-Antrieb (Geschwindigkeit), zw frei
  jets: array<vec4f, 16>,       // 64 Stützstellen, Breite −90°..+90°, Einheit rad/s bei jetStrength 1
  bands: array<vec4f, 64>,      // Bandfarbe (linear RGB) je Breite
  storms: array<vec4f, 16>,     // xyz Zentrum (Körperkoordinaten), w Radius in rad
  stormInfo: array<vec4f, 16>,  // x Drehsinn·Stärke, yzw Farbe
  stormWeight: array<vec4f, 4>, // wie stark jeder Sturm gerade angetrieben wird (0 = frei)
};

@group(0) @binding(0) var<uniform> S: Sim;

// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (st in [0,1]², Fläche) ohne Begrenzung.
fn cubeUV(d: vec3f) -> vec3f {
  let ad = abs(d);
  var face = 0.0; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0.0; sc = -d.z; } else { face = 1.0; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2.0; tc = d.z; } else { face = 3.0; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4.0; sc = d.x; } else { face = 5.0; sc = -d.x; }
    tc = -d.y;
  }
  return vec3f(vec2f(sc, tc) / ma * 0.5 + 0.5, face);
}

// Nahtloses bilineares Abtasten der Würfelfelder.
// Gemessen: das Hardware-Abtasten über Würfelkanten weicht bis zu 500-mal stärker ab als im
// Flächeninneren. Weil die Farbe jeden Schritt neu abgetastet wird, wachsen daraus Narben.
// Darum: im Inneren tastet die Hardware ab (dort exakt); nahe der Kante werden die vier
// Nachbar-Texel einzeln geholt, Texel jenseits der Kante über ihre Richtung auf der Nachbarfläche.
fn loadDir(t: texture_2d_array<f32>, s: sampler, q: vec3f) -> vec4f {
  let u = cubeUV(q);
  return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
}

fn sampleCube(t: texture_2d_array<f32>, s: sampler, p: vec3f) -> vec4f {
  let n = f32(textureDimensions(t).x);
  let u = cubeUV(p);
  let x = u.xy * n - 0.5;
  if (all(x >= vec2f(0.0)) && all(x <= vec2f(n - 1.0))) {
    return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
  }
  let i0 = floor(x);
  let f = x - i0;
  let face = u32(u.z);
  var c: array<vec4f, 4>;
  for (var k = 0u; k < 4u; k++) {
    let ij = i0 + vec2f(f32(k & 1u), f32(k >> 1u));
    if (all(ij >= vec2f(0.0)) && all(ij <= vec2f(n - 1.0))) {
      c[k] = textureLoad(t, vec2i(ij), i32(face), 0);
    } else {
      c[k] = loadDir(t, s, faceDir(face, (ij + 0.5) / n));
    }
  }
  return mix(mix(c[0], c[1], f.x), mix(c[2], c[3], f.x), f.y);
}

// Richtung -> (Fläche, Texel) für Schreibzugriffe aus Partikeln.
fn dirToTexel(d: vec3f, n: u32) -> vec3u {
  let ad = abs(d);
  var face = 0u; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0u; sc = -d.z; } else { face = 1u; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2u; tc = d.z; } else { face = 3u; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4u; sc = d.x; } else { face = 5u; sc = -d.x; }
    tc = -d.y;
  }
  let st = clamp(vec2f(sc, tc) / ma * 0.5 + 0.5, vec2f(0.0), vec2f(0.99999));
  let px = vec2u(st * f32(n));
  return vec3u(px, face);
}

// Orthonormale Tangentenbasis. Die Wahl darf von Punkt zu Punkt springen,
// weil Divergenz, Laplace und Gradient unabhängig von der Basisdrehung sind.
fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  let e2 = cross(p, e1);
  return mat2x3f(e1, e2);
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

// ---------- Tabellen ----------

fn jetAt(lat: f32) -> f32 {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  let a = S.jets[i / 4u][i % 4u];
  let b = S.jets[j / 4u][j % 4u];
  return mix(a, b, fract(x)) * S.jetStrength;
}

fn bandAt(lat: f32) -> vec3f {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  return mix(S.bands[i].rgb, S.bands[j].rgb, fract(x));
}

// ---------- Zufall und Rauschen ----------

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn hash3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;
}

fn rand4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u));
  let g = pcg3d(h.zxy ^ vec3u(b, a, 7u));
  return vec4f(vec3f(h), f32(g.x)) / 4294967295.0;
}

// Gradientenrauschen mit analytischer Ableitung: x = Wert, yzw = Gradient.
fn noised(x: vec3f) -> vec4f {
  let i = floor(x);
  let f = fract(x);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);

  let ga = hash3(i + vec3f(0.0, 0.0, 0.0));
  let gb = hash3(i + vec3f(1.0, 0.0, 0.0));
  let gc = hash3(i + vec3f(0.0, 1.0, 0.0));
  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));
  let ge = hash3(i + vec3f(0.0, 0.0, 1.0));
  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));
  let gg = hash3(i + vec3f(0.0, 1.0, 1.0));
  let gh = hash3(i + vec3f(1.0, 1.0, 1.0));

  let va = dot(ga, f - vec3f(0.0, 0.0, 0.0));
  let vb = dot(gb, f - vec3f(1.0, 0.0, 0.0));
  let vc = dot(gc, f - vec3f(0.0, 1.0, 0.0));
  let vd = dot(gd, f - vec3f(1.0, 1.0, 0.0));
  let ve = dot(ge, f - vec3f(0.0, 0.0, 1.0));
  let vf = dot(gf, f - vec3f(1.0, 0.0, 1.0));
  let vg = dot(gg, f - vec3f(0.0, 1.0, 1.0));
  let vh = dot(gh, f - vec3f(1.0, 1.0, 1.0));

  let k0 = va;
  let k1 = vb - va;
  let k2 = vc - va;
  let k3 = ve - va;
  let k4 = va - vb - vc + vd;
  let k5 = va - vc - ve + vg;
  let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;

  let value = k0 + u.x * k1 + u.y * k2 + u.z * k3 + u.x * u.y * k4 + u.y * u.z * k5
            + u.z * u.x * k6 + u.x * u.y * u.z * k7;

  let grad = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga)
           + u.x * u.y * (ga - gb - gc + gd) + u.y * u.z * (ga - gc - ge + gg)
           + u.z * u.x * (ga - gb - ge + gf) + u.x * u.y * u.z * (-ga + gb + gc - gd + ge - gf - gg + gh)
           + du * (vec3f(k1, k2, k3) + u.yzx * vec3f(k4, k5, k6) + u.zxy * vec3f(k6, k4, k5)
                   + u.yzx * u.zxy * k7);
  return vec4f(value, grad);
}

// Divergenzfreies Rauschfeld auf der Kugel: v = p × ∇ψ (ψ = FBM-Rauschen als Stromfunktion).
fn curlOnSphere(p: vec3f, freq: f32, t: f32, octaves: i32) -> vec3f {
  var g = vec3f(0.0);
  var amp = 1.0;
  var fr = freq;
  for (var o = 0; o < octaves; o++) {
    let off = vec3f(f32(o) * 17.3, t * (1.0 + 0.37 * f32(o)), f32(o) * -9.1);
    g += noised(p * fr + off).yzw * amp * fr / freq;
    amp *= 0.5;
    fr *= 2.03;
  }
  return cross(p, g);
}

fn stormW(i: u32) -> f32 { return S.stormWeight[i / 4u][i % 4u]; }

// Drehfeld der angetriebenen Stürme: Rotation um das Zentrum, Gauß-Profil.
fn stormFlow(p: vec3f) -> vec3f {
  var v = vec3f(0.0);
  let n = u32(S.stormCount);
  for (var i = 0u; i < min(n, MAX_STORMS); i++) {
    let c = S.storms[i].xyz;
    let r = S.storms[i].w;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    let x = d / r;
    // Geschwindigkeit ~ x·exp(−x²): null im Kern, Maximum am Rand, dann Abfall.
    let prof = x * exp(-x * x) * 2.33;
    v += cross(c, p) / max(sin(d), 1e-4) * prof * S.stormInfo[i].x * stormW(i);
  }
  return v * S.stormStrength;
}

// scale: Maskenradius relativ zum Sturmradius
fn stormMask(p: vec3f, scale: f32) -> vec4f {
  var tint = vec3f(0.0);
  var w = 0.0;
  let n = u32(S.stormCount);
  for (var i = 0u; i < min(n, MAX_STORMS); i++) {
    let c = S.storms[i].xyz;
    let r = S.storms[i].w;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    let m = exp(-pow(d / (r * scale), 2.0)) * stormW(i);
    tint += S.stormInfo[i].yzw * m;
    w += m;
  }
  return vec4f(tint / max(w, 1e-4), min(w, 1.0));
}
`,Ie=`// Stable Fluids (Stam 1999) auf der Kugel.
// Ablauf pro Schritt: advect -> curl -> zonalClear/zonalSum -> forces -> divergence -> jacobi×K -> project.
//
// Ableitungen: Nachbarn sind die echten Nachbarzellen des Würfelgitters. Ihre Richtungen
// kommen aus der Flächenparametrisierung (auch über die Flächenkante hinaus, dann landet
// die Abtastung nahtlos auf der Nachbarfläche). Weil die Zellen des Würfelgitters nicht
// gleich groß und nicht rechtwinklig sind, wird der Gradient aus einem 2×2-System mit den
// tatsächlichen Abstandsvektoren gelöst. Der Laplace-Operator für den Druck ist kompakt
// (direkte Nachbarn, wie in GPU Gems 38) und dämpft dadurch Zickzack-Moden in Gittergröße.

@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var srcA: texture_cube<f32>;
@group(0) @binding(3) var srcB: texture_cube<f32>;
@group(0) @binding(4) var dst: texture_storage_2d_array<rgba16float, write>;
// Breitenkreis-Mittel des Ostwinds: [2·i] = Summe, [2·i+1] = Gewicht, Festkomma.
@group(0) @binding(5) var<storage, read_write> zonal: array<atomic<i32>>;

const ZBINS = 128u;
const ZSCALE = 10000.0;

// Gleiche Felder als 2D-Array, für die nahtlos exakte Abtastung.
@group(0) @binding(6) var arrA: texture_2d_array<f32>;
@group(0) @binding(7) var arrB: texture_2d_array<f32>;
// SEAMLESS = true: an Würfelkanten die vier Nachbartexel einzeln holen (sampleCube in common.wgsl).
// Nötig nur auf Grafikkarten, deren Cubemap-Abtastung nicht nahtlos filtert; der Selbsttest
// im Abschnitt „Diagnose“ misst das. Sonst schnelle Hardware-Abtastung.
override SEAMLESS: bool = false;
fn A(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrA, samp, d); }
  return textureSampleLevel(srcA, samp, d, 0.0);
}
fn B(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrB, samp, d); }
  return textureSampleLevel(srcB, samp, d, 0.0);
}

fn outside(id: vec3u) -> bool { return f32(id.x) >= S.velN || f32(id.y) >= S.velN; }

fn put(id: vec3u, v: vec4f) { textureStore(dst, id.xy, id.z, v); }

fn safe(v: vec3f) -> vec3f {
  // NaN/Inf-Schutz und Obergrenze für die Geschwindigkeit (rad/s).
  if (any(v != v) || any(abs(v) > vec3f(1e4))) { return vec3f(0.0); }
  let l = length(v);
  return select(v, v * (1.5 / l), l > 1.5);
}

// Zelle mit ihren vier Gitternachbarn und einer lokalen Orthonormalbasis.
struct Cell {
  p: vec3f,
  pE: vec3f, pW: vec3f, pN: vec3f, pS: vec3f,
  e1: vec3f, e2: vec3f,
  inv: mat2x2f,     // bildet (fE−fW, fN−fS) auf den Gradienten (in e1/e2) ab
  ax: f32, ay: f32, // 1/Abstand² für den Laplace-Operator
  size: f32,        // mittlere Zellgröße (rad)
};

fn cell(id: vec3u) -> Cell {
  let n = S.velN;
  let st = (vec2f(id.xy) + 0.5) / n;
  let d = 1.0 / n;
  var c: Cell;
  c.p = faceDir(id.z, st);
  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));
  let dA = c.pE - c.pW;
  let dB = c.pN - c.pS;
  c.e1 = normalize(tangent(c.p, dA));
  c.e2 = cross(c.p, c.e1);
  // Zeilen: dA und dB in der lokalen Basis. Gradient g erfüllt M·g = (fE−fW, fN−fS).
  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  let det = a * dd - b * cc;
  // Inverse von [[a, b], [cc, dd]] (WGSL-Matrizen sind spaltenweise).
  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / det);
  let hx = length(dA) * 0.5;
  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);
  return c;
}

fn grad2(c: Cell, dfA: f32, dfB: f32) -> vec2f { return c.inv * vec2f(dfA, dfB); }

@compute @workgroup_size(8, 8, 1)
fn initVel(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let p = cell(id).p;
  var v = east(p) * jetAt(latitude(p)) + curlOnSphere(p, 3.0, S.seed, 3) * 0.01;
  // Stürme als Anfangswirbel einsetzen. Danach leben sie nur noch von der Physik
  // (außer "Stürme festhalten" ist aufgedreht).
  v = mix(v, stormFlow(p), stormMask(p, 1.1).w);
  put(id, vec4f(tangent(p, v), 0.0));
}

@compute @workgroup_size(8, 8, 1)
fn clear(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  put(id, vec4f(0.0));
}

// Semi-Lagrange-Advektion, optional mit BFECC-Korrektur (wie im mofu-Artikel, nur in 3D).
@compute @workgroup_size(8, 8, 1)
fn advect(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let p = cell(id).p;
  let dt = S.dt;
  let u0 = A(p).xyz;
  var src = stepOn(p, -u0 * dt);
  if (S.bfecc > 0.5) {
    let u1 = A(src).xyz;
    let back = stepOn(src, u1 * dt);
    let p3 = normalize(p - (back - p) * 0.5);
    let u2 = A(p3).xyz;
    src = stepOn(p3, -u2 * dt);
  }
  let v = A(src).xyz;
  // Paralleltransport: in die Tangentialebene bei p projizieren, Betrag erhalten.
  var vt = tangent(p, v);
  vt *= length(v) / max(length(vt), 1e-6);
  put(id, vec4f(safe(vt), 0.0));
}

// Wirbelstärke ζ = ∂v/∂x − ∂u/∂y (Normalkomponente der Rotation) -> x
@compute @workgroup_size(8, 8, 1)
fn curl(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let c = cell(id);
  let dA = A(c.pE).xyz - A(c.pW).xyz;
  let dB = A(c.pN).xyz - A(c.pS).xyz;
  let g1 = grad2(c, dot(dA, c.e1), dot(dB, c.e1));   // ∇u₁
  let g2 = grad2(c, dot(dA, c.e2), dot(dB, c.e2));   // ∇u₂
  put(id, vec4f(g2.x - g1.y, 0.0, 0.0, 0.0));
}

// ---------- Breitenkreis-Mittel des Ostwinds ----------

fn diverging(v: f32) -> vec3f {

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;

fn cubeUV(d: vec3f) -> vec3f {

    }
  }
  return mix(mix(c[0], c[1], f.x), mix(c[2], c[3], f.x), f.y);
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

fn north(p: vec3f) -> vec3f { return cross(p, east(p)); }

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn rand3(a: vec3u) -> vec3f { return vec3f(pcg3d(a)) / 4294967295.0; }
`,et=`// Modul „Atmosphäre“: feuchte, thermische Flachwasser-Atmosphäre auf der Kugel.
//
// Gleichungen (Zerroukat & Allen 2015, J. Comput. Phys. 290; umgesetzt wie in Gusto,
// UK Met Office, MIT-Lizenz: ThermalShallowWaterEquations, SWSaturationAdjustment, InstantRain):
//   ∂u/∂t + (u·∇)u + f k×u = −b∇(D + B) − ½·D·∇b                 Impuls
//   ∂D/∂t + ∇·(D u)        = −β₁·C                               Masse (konvektive Rückkopplung, mcRSW)
//   ∂b/∂t + u·∇b           = −β₂·C          mit b = g(1 − θ)      Wärme: Kondensation heizt (θ steigt)
//   ∂q_v/∂t + u·∇q_v = −C + E,   ∂q_c/∂t + u·∇q_c = C − P       Dampf, Wolkenwasser
//   q_sat = q₀/(gD) · exp(ν(1 − b/g)) = q₀/(gD) · exp(ν·θ)          Sättigung (Clausius–Clapeyron-artig)
//   C = γ_v·(q_v − q_sat)/Δt, begrenzt auf [−q_c, q_v]/Δt,  γ_v = 1/(1 + ν·β₂/g·q_sat)
//   P = γ_r·max(0, q_c − q_precip)/Δt
// B ist die „Bodenhöhe“: beim Gasriesen die Wirkung der tiefen Jets (Dowling & Ingersoll 1989:
// die tiefe Strömung wirkt auf die Wetterschicht wie Topografie), beim Gesteinsplaneten später echtes Gelände.
// Antrieb: Newton-Abkühlung zu η_eq, θ_eq (Held & Suarez 1994), Stürme als Massenpulse
// (Showman 2007; Formel wie canoe/exo3 test_injection.cpp, Li & Chen, MIT-Lizenz), Ereignisse (Tippen).
//
// Einheiten: Planetenradius 1, D in Einheiten der mittleren Tiefe H, c² = gH, Zeit in Sim-Sekunden.
// Gespeichert: A = (u.xyz als 3D-Tangentialvektor, η = D − 1), B = (θ, q_v, q_c, Asche).
// Ablauf pro Teilschritt: aAdvect (Semi-Lagrange) → aMass (Kontinuität, Physik) → aMomentum (Druck, Coriolis).

struct Atmo {
  dt: f32, time: f32, n: f32, events: f32,
  omega: f32, c2: f32, relax: f32, drag: f32,
  nu: f32, beta1: f32, beta2: f32, qPrecip: f32,
  rain: f32, evap: f32, rhSurf: f32, diff: f32,
  seed: f32, q0: f32, ashFall: f32, fMin: f32,
  test: f32, nudge: f32, pad0: f32, pad1: f32,
  eq: array<vec4f, 128>,   // je Breite (−90°..90°): x η_eq, y θ_eq, z u_eq (Ostwind, rad/s), w dB/dφ
  ev: array<vec4f, 48>,    // 16 Ereignisse × 3: (Zentrum xyz, Radius) (Δη, Δθ, Δq_v, ΔAsche) (Wind balanciert, radial, 0, 0)
};

@group(0) @binding(0) var<uniform> U: Atmo;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var srcA: texture_cube<f32>;
@group(0) @binding(3) var srcB: texture_cube<f32>;
@group(0) @binding(4) var dstA: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(5) var dstB: texture_storage_2d_array<rgba16float, write>;
@group(0) @binding(6) var arrA: texture_2d_array<f32>;
@group(0) @binding(7) var arrB: texture_2d_array<f32>;

override SEAMLESS: bool = false;
fn A(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrA, samp, d); }
  return textureSampleLevel(srcA, samp, d, 0.0);
}
fn B(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrB, samp, d); }
  return textureSampleLevel(srcB, samp, d, 0.0);
}

fn outside(id: vec3u) -> bool { return f32(id.x) >= U.n || f32(id.y) >= U.n; }

fn eqAt(lat: f32) -> vec4f {
  let x = clamp((lat / PI + 0.5) * 127.0, 0.0, 127.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 127u);
  return mix(U.eq[i], U.eq[j], fract(x));
}

fn qsat(D: f32, th: f32) -> f32 { return U.q0 * exp(U.nu * th) / max(D, 0.05); }

fn safe(v: vec3f) -> vec3f {
  if (any(v != v) || any(abs(v) > vec3f(1e4))) { return vec3f(0.0); }
  let l = length(v);
  return select(v, v * (3.0 / l), l > 3.0);
}

// Zelle mit Gitternachbarn und lokaler Basis (wie fluid.wgsl): Gradient aus den echten Abstandsvektoren.
struct Cell {
  p: vec3f, pE: vec3f, pW: vec3f, pN: vec3f, pS: vec3f,
  e1: vec3f, e2: vec3f, inv: mat2x2f, ax: f32, ay: f32, size: f32,
};

fn cell(id: vec3u) -> Cell {
  let n = U.n;
  let st = (vec2f(id.xy) + 0.5) / n;
  let d = 1.0 / n;
  var c: Cell;
  c.p = faceDir(id.z, st);
  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));
  let dA = c.pE - c.pW;
  let dB = c.pN - c.pS;
  c.e1 = normalize(tangent(c.p, dA));
  c.e2 = cross(c.p, c.e1);
  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / (a * dd - b * cc));
  let hx = length(dA) * 0.5;
  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);
  return c;
}

fn grad(c: Cell, fE: f32, fW: f32, fN: f32, fS: f32) -> vec3f {
  let g = c.inv * vec2f(fE - fW, fN - fS);
  return c.e1 * g.x + c.e2 * g.y;
}

// Ereignis k: Zentrum, Radius, Gauß-Gewicht exp(−½ d²/r²) und Abstand d (rad).
fn evPos(k: u32) -> vec4f { return U.ev[3u * k]; }
fn evSrc(k: u32) -> vec4f { return U.ev[3u * k + 1u]; }
fn evVel(k: u32) -> vec4f { return U.ev[3u * k + 2u]; }
fn evDist(k: u32, p: vec3f) -> f32 { return acos(clamp(dot(evPos(k).xyz, p), -1.0, 1.0)); }

// Paralleltransport eines Tangentialvektors v von a nach b entlang des Großkreises (Rodrigues).
fn transport(a: vec3f, b: vec3f, v: vec3f) -> vec3f {
  let k = cross(a, b);
  let s = length(k);
  if (s < 1e-7) { return tangent(b, v); }
  let kk = k / s;
  let c = dot(a, b);
  return tangent(b, v * c + cross(kk, v) * s + kk * dot(kk, v) * (1.0 - c));
}

@compute @workgroup_size(8, 8, 1)
fn aInit(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let p = faceDir(id.z, (vec2f(id.xy) + 0.5) / U.n);
  let lat = latitude(p);
  let e = eqAt(lat);
  var eta = e.x;
  if (U.test > 0.5) {
    // Galewsky, Scott & Polvani 2004: Beule ĥ = 120 m auf H = 10 km, α = 1/3, β = 1/15, φ₂ = π/4.
    let lon = atan2(-p.z, p.x);
    eta += 0.012 * cos(lat) * exp(-pow(lon * 3.0, 2.0)) * exp(-pow((PI / 4.0 - lat) * 15.0, 2.0));
  } else {
    // Winzige Unordnung, damit Instabilitäten einen Anfang haben.
    eta += (rand3(vec3u(id.xy, id.z + u32(U.seed) * 8u)).x - 0.5) * 0.002;
  }
  let u = east(p) * e.z;
  let th = e.y;
  let qv = U.rhSurf * qsat(1.0 + eta, th);
  textureStore(dstA, id.xy, id.z, vec4f(tangent(p, u), eta));
  textureStore(dstB, id.xy, id.z, vec4f(th, qv, 0.0, 0.0));
}

// 1) Semi-Lagrange: alle Größen vom Abfahrtspunkt holen (Mittelpunktregel), Wind parallel transportieren.
@compute @workgroup_size(8, 8, 1)
fn aAdvect(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let p = faceDir(id.z, (vec2f(id.xy) + 0.5) / U.n);
  let dt = U.dt;
  let mid = stepOn(p, -A(p).xyz * dt * 0.5);
  let src = stepOn(p, -transport(mid, p, A(mid).xyz) * dt);
  let a = A(src);
  var b = B(src);
  if (any(b != b)) { b = vec4f(eqAt(latitude(p)).y, 0.0, 0.0, 0.0); }
  textureStore(dstA, id.xy, id.z, vec4f(safe(transport(src, p, a.xyz)), select(a.w, 0.0, a.w != a.w)));
  textureStore(dstB, id.xy, id.z, b);
}

// 2) Kontinuität D ← D·exp(−Δt·∇·u) (Lagrange-Form, bleibt positiv), Glättung, Strahlung,
//    Ereignisse, Sättigungsausgleich, Regen. A = nach Advektion, B = nach Advektion.
@compute @workgroup_size(8, 8, 1)
fn aMass(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let c = cell(id);
  let dt = U.dt;
  let aC = A(c.p); let aE = A(c.pE); let aW = A(c.pW); let aN = A(c.pN); let aS = A(c.pS);
  let dA = aE.xyz - aW.xyz;
  let dB = aN.xyz - aS.xyz;
  let g1 = c.inv * vec2f(dot(dA, c.e1), dot(dB, c.e1));
  let g2 = c.inv * vec2f(dot(dA, c.e2), dot(dB, c.e2));
  let div = g1.x + g2.y;
  var D = (1.0 + aC.w) * exp(-div * dt);
  // Schwache Diffusion der Schichtdicke gegen Gitterrauschen (ν·Δt/Δx² = U.diff).
  let lap = (aE.w + aW.w - 2.0 * aC.w) * c.ax + (aN.w + aS.w - 2.0 * aC.w) * c.ay;
  D += U.diff * lap / (c.ax + c.ay);

  let eq = eqAt(latitude(c.p));
  var b = B(c.p);
  // Newton-Abkühlung (Held & Suarez 1994): Dicke und Temperatur kehren zum Gleichgewicht zurück.
  let k = 1.0 - exp(-U.relax * dt);
  D += (1.0 + eq.x - D) * k;
  b.x += (eq.y - b.x) * k;

  // Ereignisse: Gauß-Pulse in Masse, Wärme, Dampf, Asche.
  for (var i = 0u; i < u32(U.events); i++) {
    let r = evPos(i).w;
    let d = evDist(i, c.p);
    if (d > 4.0 * r) { continue; }
    let g = exp(-0.5 * d * d / (r * r));
    let s = evSrc(i);
    D += s.x * g; b.x += s.y * g; b.y += s.z * g; b.w += s.w * g;
  }
  D = max(D, 0.05);

  // Feuchte (Zerroukat & Allen 2015): Nachschub aus der Tiefe, Sättigungsausgleich, Regen.
  var qs = qsat(D, b.x);
  b.y += max(U.rhSurf * qs - b.y, 0.0) * (1.0 - exp(-U.evap * dt));
  let gv = 1.0 / (1.0 + U.nu * U.beta2 * qs);
  let cq = clamp(gv * (b.y - qs), -max(b.z, 0.0), max(b.y, 0.0));   // > 0 Kondensation, < 0 Wolke verdunstet
  b.y -= cq;
  b.z += cq;
  b.x += U.beta2 * cq;          // latente Wärme
  D = max(D - U.beta1 * cq, 0.05);
  b.z -= max(b.z - U.qPrecip, 0.0) * (1.0 - exp(-U.rain * dt));
  b.w *= exp(-U.ashFall * dt);

  textureStore(dstA, id.xy, id.z, vec4f(aC.xyz, D - 1.0));
  textureStore(dstB, id.xy, id.z, vec4f(b.x, max(b.y, 0.0), max(b.z, 0.0), max(b.w, 0.0)));
}

// 3) Impuls: Druckkraft −c²·[b̃∇(η + B) − ½·D·∇θ] (b̃ = 1 − θ), Ereignis-Wind, Coriolis als exakte Drehung.
//    A = nach aMass (η neu), B = Tracer nach aMass.
@compute @workgroup_size(8, 8, 1)
fn aMomentum(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  let c = cell(id);
  let p = c.p;
  let dt = U.dt;
  let aC = A(p);
  var u = aC.xyz;
  let D = 1.0 + aC.w;
  let th = B(p).x;
  let lat = latitude(p);
  let eq = eqAt(lat);
  let gEta = grad(c, A(c.pE).w, A(c.pW).w, A(c.pN).w, A(c.pS).w) + north(p) * eq.w;
  let gTh = grad(c, B(c.pE).x, B(c.pW).x, B(c.pN).x, B(c.pS).x);
  u -= U.c2 * ((1.0 - th) * gEta - 0.5 * D * gTh) * dt;

  let f = 2.0 * U.omega * p.y;
  // Ereignisse: geostrophisch balancierter Wind zum Massenpuls (u = c²/f · k×∇η, wie canoe/exo3)
  // und radialer Stoß (Explosion, Einschlag).
  for (var i = 0u; i < u32(U.events); i++) {
    let pos = evPos(i);
    let r = pos.w;
    let d = evDist(i, p);
    if (d > 4.0 * r || d < 1e-6) { continue; }
    let g = exp(-0.5 * d * d / (r * r));
    let er = normalize(tangent(p, p - pos.xyz));
    let vel = evVel(i);
    if (vel.x != 0.0) {
      let gradEv = -evSrc(i).x * g * d / (r * r) * er;
      let fb = select(-1.0, 1.0, f >= 0.0) * max(abs(f), U.fMin);
      u += vel.x * U.c2 / fb * cross(p, gradEv);
    }
    u += er * vel.y * (d / r) * g;
  }

  let a = -f * dt;
  u = u * cos(a) + cross(p, u) * sin(a);
  u /= 1.0 + U.drag * dt;
  // Optional: sanft zum Gleichgewichts-Jet ziehen (0 = frei).
  u += (east(p) * eq.z - u) * (1.0 - exp(-U.nudge * dt));
  textureStore(dstA, id.xy, id.z, vec4f(safe(tangent(p, u)), aC.w));
}
`,tt=`// Modul „Atmosphäre“: kachelbares 3D-Rauschen für die Wolkenform, einmal beim Start erzeugt.
// Verfahren: Perlin-Worley nach Schneider (Nubis, Guerrilla Games) in der Fassung von Sébastien
// Hillaire (TileableVolumeNoise, MIT) und takram three-clouds (cloudShape.frag, cloudShapeDetail.frag, MIT).
// r = Grundform (Perlin-Worley), g = Detail (Worley-fBm), beide kachelbar über [0,1]³.

@group(0) @binding(0) var dst: texture_storage_3d<rgba8unorm, write>;

fn hashCell(c: vec3i, period: i32) -> vec3f {
  let w = ((c % period) + period) % period;
  return rand3(bitcast<vec3u>(w) + vec3u(17u, 59u, 101u));
}

// Worley: Abstand² zum nächsten Merkmalspunkt, Zellen periodisch.
fn worley(p: vec3f, cells: f32) -> f32 {
  let q = p * cells;
  let i = vec3i(floor(q));
  let per = i32(cells);
  var d = 1e10;
  for (var x = -1; x <= 1; x++) {
    for (var y = -1; y <= 1; y++) {
      for (var z = -1; z <= 1; z++) {
        let c = i + vec3i(x, y, z);
        let fp = vec3f(c) + hashCell(c, per);
        let v = q - fp;
        d = min(d, dot(v, v));
      }
    }
  }
  return clamp(d, 0.0, 1.0);
}

fn gradAt(c: vec3i, period: i32) -> vec3f { return normalize(hashCell(c, period) * 2.0 - 1.0 + vec3f(1e-4)); }

// Kachelbares Gradientenrauschen (Perlin), Wertebereich etwa [−1, 1].
fn perlin(p: vec3f, freq: f32) -> f32 {
  let q = p * freq;
  let i = vec3i(floor(q));
  let f = q - floor(q);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let per = i32(freq);
  var v: array<f32, 8>;
  for (var k = 0; k < 8; k++) {
    let o = vec3i(k & 1, (k >> 1) & 1, (k >> 2) & 1);
    v[k] = dot(gradAt(i + o, per), f - vec3f(o));
  }
  let x0 = mix(mix(v[0], v[1], u.x), mix(v[2], v[3], u.x), u.y);
  let x1 = mix(mix(v[4], v[5], u.x), mix(v[6], v[7], u.x), u.y);
  return mix(x0, x1, u.z) * 1.6;
}

fn remap(x: f32, a: f32, b: f32, c: f32, d: f32) -> f32 { return c + (x - a) / (b - a) * (d - c); }

@compute @workgroup_size(4, 4, 4)
fn noiseGen(@builtin(global_invocation_id) id: vec3u) {
  let n = textureDimensions(dst).x;
  if (any(id >= vec3u(n))) { return; }
  let p = (vec3f(id) + 0.5) / f32(n);
  // Grundform: Perlin-fBm (3 Oktaven, Frequenz 8) als Untergrenze über Worley-fBm (cloudShape.frag).
  var per = 0.0; var w = 1.0; var ws = 0.0; var fr = 8.0;
  for (var o = 0; o < 3; o++) { per += perlin(p, fr) * w; ws += w; w *= 0.5; fr *= 2.0; }
  per = clamp(per / ws * 0.5 + 0.5, 0.0, 1.0);
  let wf = dot(vec3f(1.0 - worley(p, 8.0), 1.0 - worley(p, 32.0), 1.0 - worley(p, 56.0)), vec3f(0.625, 0.25, 0.125));
  let perlinWorley = remap(per, 0.0, 1.0, wf, 1.0);
  let n4 = vec4f(1.0 - worley(p, 8.0), 1.0 - worley(p, 16.0), 1.0 - worley(p, 32.0), 1.0 - worley(p, 64.0));
  let fb = vec3f(dot(n4.xyz, vec3f(0.625, 0.25, 0.125)), dot(n4.yzw, vec3f(0.625, 0.25, 0.125)), dot(n4.zw, vec2f(0.75, 0.25)));
  let worleyFbm = dot(fb, vec3f(0.625, 0.25, 0.125));
  let shape = clamp(remap(perlinWorley, worleyFbm - 1.0, 1.0, 0.0, 1.0), 0.0, 1.0);
  // Detail (cloudShapeDetail.frag): Worley-fBm mit 2, 4, 8, 16 Zellen.
  let d4 = vec4f(1.0 - worley(p, 2.0), 1.0 - worley(p, 4.0), 1.0 - worley(p, 8.0), 1.0 - worley(p, 16.0));
  let db = vec3f(dot(d4.xyz, vec3f(0.625, 0.25, 0.125)), dot(d4.yzw, vec3f(0.625, 0.25, 0.125)), dot(d4.zw, vec2f(0.75, 0.25)));
  let detail = dot(db, vec3f(0.625, 0.25, 0.125));
  textureStore(dst, id, vec4f(shape, detail, 0.0, 1.0));
}
`,nt=`// Modul „Atmosphäre“: Wolkenschicht als dünne Volumenschale über dem Planeten, als eigener
// Zeichendurchgang über das fertige Planetenbild gemischt (vormultipliziertes Alpha).
// Ausgabe: rgb = Wolkenlicht, a = Faktor für das Bild darunter (Durchlässigkeit × Wolkenschatten).
//
// Verfahren wie takram three-clouds (MIT, clouds.glsl / clouds.frag), das Nubis (Schneider, Guerrilla)
// umsetzt – nur dass die „Wetterkarte“ nicht gemalt ist, sondern aus der Simulation kommt:
//   Bedeckung     w = 1 − exp(−k·q_c)                          (optische Dicke ∝ Wolkenwasser, Stephens 1978)
//   Höhenprofil   1 − (2·h^0,35 − 1)²                           (runde Kuppen, shapeAlteringFunction)
//   Bedeckung → Dichte  remap(mix(w, 1, 0,6), 1 − C·Profil, 1 − C·Profil + 0,6)   (Skybolt, via takram)
//   Form          remap(Dichte, (1 − Perlin-Worley)·Stärke, 1) und Detail-Erosion
//   Licht         Mehrfachstreuung in Oktaven Σ aⁱ·e^(−bⁱ·τ)·p(cⁱ·cosθ), a = b = c = 0,5 (Wrenninge 2013)
//   Phase         zwei Henyey–Greenstein-Keulen g = 0,7 und −0,2, Mischung 0,5
//   Integration   energieerhaltend: S·(1 − e^(−σΔs))/σ (Hillaire 2016, Frostbite)
//   Pulver        1 − 0,8·e^(−2σ) (Schneider 2015)
// Turmhöhe: latente Wärme hebt die Wolkenobergrenze (Auftrieb θ − θ_eq aus der Simulation).

struct CU {
  invViewProj: mat4x4f,
  camPos: vec4f,
  body0: vec4f, body1: vec4f, body2: vec4f,
  sun: vec4f,     // xyz Richtung (Welt), w Intensität
  p0: vec4f,      // x Abplattung, y Belichtung, z Schalendicke H (Radien), w Schritte
  p1: vec4f,      // x optische Dicke K, y Bedeckung k, z θ₀, w Δθ
  p2: vec4f,      // x Zeit, y Formskala, z Detailskala, w Schattenstärke

@group(0) @binding(0) var<uniform> C: CU;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var fieldB: texture_cube<f32>;
@group(0) @binding(3) var noise: texture_3d<f32>;

struct VOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VOut {
  let xy = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  var o: VOut;
  o.pos = vec4f(xy, 0.0, 1.0);
  o.ndc = xy;
  return o;
}

fn toBody(v: vec3f) -> vec3f { return vec3f(dot(C.body0.xyz, v), dot(C.body1.xyz, v), dot(C.body2.xyz, v)); }

fn remapC(x: f32, a: f32, b: f32) -> f32 { return clamp((x - a) / (b - a), 0.0, 1.0); }

fn aces(x: vec3f) -> vec3f {
  let a = 2.51; let b = 0.03; let c = 2.43; let d = 0.59; let e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), vec3f(0.0), vec3f(1.0));
}

// Schnittpunkte mit einer Kugel um den Ursprung: (t0, t1), t0 > t1 = kein Treffer.
fn sphere(o: vec3f, d: vec3f, r: f32) -> vec2f {
  let b = dot(o, d);
  let k = dot(o, o) - r * r;
  let disc = b * b - k;
  if (disc < 0.0) { return vec2f(1.0, -1.0); }
  let s = sqrt(disc);
  return vec2f(-b - s, -b + s);
}

fn hg(g: f32, c: f32) -> f32 {
  let g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-5), 1.5));
}

fn phase(c: f32, att: f32) -> f32 { return 0.5 * hg(0.7 * att, c) + 0.5 * hg(-0.2 * att, c); }

fn multiScatter(tau: f32, c: f32) -> f32 {
  var s = 0.0;
  var k = vec3f(1.0);   // a: Beitrag, b: Abschwächung, c: Phasen-Abschwächung
  for (var i = 0; i < 6; i++) {
    s += k.x * exp(-tau * k.y) * phase(c, k.z);
    k *= 0.5;
  }
  return s;
}

struct Media { cloud: f32, ash: f32 };

// Dichte an Punkt x (Einheitskugel-Raum), r = |x|.
fn media(x: vec3f, r: f32, detail: bool) -> Media {
  var m: Media;
  m.cloud = 0.0; m.ash = 0.0;
  let H = C.p0.z;
  let h = (r - 1.0) / H;
  if (h < 0.0 || h > 1.0) { return m; }

  let w = textureSampleLevel(fieldB, samp, q, 0.0);   // θ, q_v, q_c, Asche

  let ash = 1.0 - exp(-C.p3.x * w.w);

  let bias = clamp(pow(hf, 0.35) * 2.0 - 1.0, -1.0, 1.0);
  let hs = 1.0 - bias * bias;
  let factor = 1.0 - 0.4 * hs;
  var dens = remapC(mix(cov, 1.0, 0.6), factor, factor + 0.6);
  var dash = ash * hs;

  dash = remapC(dash, (1.0 - nz.r) * 0.6, 1.0);

    dens = remapC(dens * 2.0, mod_ * 0.5, 1.0);

  m.cloud = clamp(dens * (0.75 * hf + 0.25), 0.0, 1.0);
  m.ash = clamp(dash, 0.0, 1.0);
  return m;
}

fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }

        var lt = ls * 0.5;

    t += dt;
  }

  var shade = 1.0;
  if (hitGround) {
    let g = o + d * ground.x;
    if (dot(g, sun) > -0.05) {
      var tau = 0.0;
      let out_ = sphere(g, sun, 1.0 + H).y;
      let ls = out_ / 6.0;
      for (var j = 0; j < 6; j++) {
        let y = g + sun * ls * (f32(j) + 0.5);
        let mm = media(y, length(y), false);
        tau += (mm.cloud + mm.ash * 1.2) * K * ls;
      }

    }
  }

  var col = vec3f(0.0);
  if (alpha > 1e-4) {
    let avg = L / alpha;
    col = pow(aces(avg * C.p0.y), vec3f(1.0 / 2.2)) * alpha;
  }
  return vec4f(col, T * shade);
}

,.05,r("Gibt Wirbeln die Energie zurück, die das grobe Gitter wegschmiert, vor allem den kleinsten. Standard 6 = lebendiger Look von v0.1; physikalisch sauberer ist etwa 0,5.","Gives vortices back the energy the coarse grid smears away, mostly the smallest. Default 6 = lively v0.1 look; physically cleaner is about 0.5.")+c("F = ε·Δx·(N × ζp̂),  N = ∇|ζ| / |∇|ζ||"),s).range("drag",r("Reibung","Drag"),0,2,.005,r("Bremst den ganzen Wind gleichmäßig ab.","Slows the whole wind field uniformly.")+c("u ← u / (1 + r·Δt)"),a).section(r("Stürme","Storms"),void 0,!0).toggle("storms",r("Vorlagen-Stürme","Preset storms"),r("Setzt die bekannten Stürme der Vorlage (z. B. Großer Roter Fleck) beim Start als Wirbel ein.","Seeds the preset’s known storms (e.g. the Great Red Spot) as vortices at start.")+c(r("v(d) = 2,33 · x·e<sup>−x²</sup>,  x = d / r","v(d) = 2.33 · x·e<sup>−x²</sup>,  x = d / r"))).range("stormSize",r("Sturm-Größe","Storm size"),.2,5,.05,r("Radius aller Stürme als Faktor, unabhängig vom Drehtempo. Groß und langsam ist so möglich: große Sturm-Größe, kleines Drehtempo.","Radius of all storms as a factor, independent of spin speed. Big and slow is possible: large storm size, low spin speed.")+c("r′ = r · Faktor"),d=>`${d.toFixed(2)}×`).range("stormStrength",r("Sturm-Drehtempo","Storm spin speed"),0,10,.05,r("Wie schnell sich die Stürme drehen, relativ zur Jet-Stärke. Die Größe stellst du getrennt unter „Sturm-Größe“ ein.","How fast storms spin, relative to jet strength. Size is set separately under “Storm size”."),s).range("stormHold",r("Stürme festhalten","Hold storms"),0,1,.01,r("Treibt die Vorlagen-Stürme dauerhaft an. 0 = reine Physik (sie dürfen treiben, verschmelzen, vergehen), 1 = wie ein Beobachtungsdatum festgehalten.","Keeps driving the preset storms. 0 = pure physics (they may drift, merge, fade), 1 = enforced like observation data.")+c(r("u += (v<sub>Sturm</sub> − u) · 2·w·Maske·Δt","u += (v<sub>storm</sub> − u) · 2·w·mask·Δt")),i).range("stormSpawn",r("Neue Stürme","New storms"),0,5,.01,r("Wie oft Konvektion einen neuen Wirbel anstößt (pro Sekunde Simulationszeit). Der Drehsinn folgt der Scherung an der Stelle, denn nur ein mitdrehender Wirbel überlebt sie. In antizyklonalen Zonen entstehen so weiße Ovale, in zyklonalen Gürteln dunkle Barken.","How often convection kicks off a new vortex (per second of simulated time). Its spin follows the local shear, because only a co-rotating vortex survives it. Anticyclonic zones grow white ovals, cyclonic belts dark barges.")+c(r("Drehsinn = sign(ζ<sub>Hintergrund</sub>),  ζ ≈ −∂U/∂φ","spin = sign(ζ<sub>background</sub>),  ζ ≈ −∂U/∂φ")),s).range("kickLife",r("Anstoß-Dauer","Kick duration"),.5,120,.5,r("Wie lange ein neuer Sturm angetrieben wird, bevor er frei ist. Kurz = kurzes Aufflackern. Lang = er wächst zu einem großen Wirbel heran und lebt dann von der Physik: er treibt mit dem Jet, verschmilzt oder zerfällt.","How long a new storm is driven before it is free. Short = a brief flicker. Long = it grows into a big vortex and then lives on physics: drifts with the jet, merges or decays.")+c(r("w(t) = sin(π · t / Dauer)","w(t) = sin(π · t / duration)")),d=>`${d.toFixed(1)} s`).range("stormTint",r("Sturm-Farbe","Storm colour"),0,10,.05,r("Wie stark ein angetriebener Sturm seine Farbe in die Wolken gibt.","How strongly a driven storm tints the clouds."),s).section(r("Wolkenfarbe","Cloud colour"),r("Darstellung Flüssigkeit und Partikel. Die Farbe folgt dem Wind und kehrt langsam zur Bandfarbe zurück:","Looks liquid and particles. Colour follows the wind and slowly returns to the band colour:"),!0).custom(this.formulaNote(r("c(p) ← mix(c(p − u·Δt), c<sub>Band</sub>(φ + Mäander), 1 − e<sup>−k·Δt</sup>)","c(p) ← mix(c(p − u·Δt), c<sub>band</sub>(φ + meander), 1 − e<sup>−k·Δt</sup>)"))).range("bandRelax",r("Band-Rückstellung","Band restoring"),0,2,.005,r("k: wie schnell die Farbe zum Band ihrer Breite zurückkehrt. 0 = alles vermischt sich zu Brei, hoch = starre Streifen. Zeitkonstante 1/k: bei 0,06 etwa 17 s, so lange dauert es auch, bis eine Änderung eingeschwungen ist.","k: how fast colour returns to its latitude’s band. 0 = everything mixes into mush, high = rigid stripes. Time constant 1/k: about 17 s at 0.06, which is also how long a change takes to settle."),a).range("fineStripes",r("Feinstreifen","Fine stripes"),0,5,.05,r("Feine Farbstreifen innerhalb der Bänder. Erst sie machen sichtbar, wie die Strömung Farbe zu Filamenten zieht.","Fine colour stripes inside the bands. They make it visible how the flow pulls colour into filaments."),s).range("bandWobble",r("Band-Mäander","Band meander"),0,6,.05,r("Verbiegt die Bandgrenzen mit Rauschen.","Bends band edges with noise.")+c(r("φ′ = φ + Rauschen(4p) · m · 0,04","φ′ = φ + noise(4p) · m · 0.04")),s).range("contrast",r("Band-Kontrast","Band contrast"),0,4,.05,r("Farbunterschied zwischen hellen Zonen und dunklen Gürteln.","Colour difference between bright zones and dark belts.")+c(r("c = c̄ + (c − c̄) · Kontrast","c = c̄ + (c − c̄) · contrast")),s).range("convection",r("Konvektion","Convection"),0,10,.05,r("Helle Wolkentürme, die aus der Tiefe aufsteigen (Ammoniak-Eis).","Bright cloud towers rising from below (ammonia ice)."),s).section(r("Curl noise","Curl noise"),r("Rechenmodell Curl-Noise: Wind = Jets + Curl-Noise + Wirbel.","Maths model curl noise: wind = jets + curl noise + vortices."),!0).custom(this.formulaNote(r("v = ê<sub>Ost</sub>·U(φ) + p × ∇ψ + Σ Wirbel,   ψ = Σ<sub>k</sub> ½<sup>k</sup> · Rauschen(2<sup>k</sup> f · p, t)","v = ê<sub>E</sub>·U(φ) + p × ∇ψ + Σ vortices,   ψ = Σ<sub>k</sub> ½<sup>k</sup> · noise(2<sup>k</sup> f · p, t)"))).range("curlStrength",r("Stärke","Strength"),0,10,.01,r("Wie stark das Rauschfeld gegenüber den Jets ist.","Strength of the noise field relative to the jets."),s).range("curlFreq",r("Frequenz","Frequency"),.2,32,.1,r("Grundfrequenz f des Rauschens: hoch = viele kleine Wirbel.","Base frequency f of the noise: high = many small swirls."),d=>d.toFixed(1)).range("curlSpeed",r("Veränderung","Evolution"),0,.5,.005,r("Wie schnell sich das Rauschfeld mit der Zeit umbaut.","How fast the noise field changes over time."),a).range("curlOctaves",r("Oktaven","Octaves"),1,6,1,r("Anzahl überlagerter Rausch-Ebenen k. Mehr = feinere Details.","Number of stacked noise layers k. More = finer detail.")).range("vortexCount",r("Wirbel","Vortices"),0,256,1,r("Eingestreute Wirbel (Gaseous Giganticus). Nur wo die Jets schwach sind, und nur mit dem Drehsinn der lokalen Scherung, sonst würden sie zerrissen.","Seeded vortices (Gaseous Giganticus). Only where jets are weak, and only with the spin of the local shear, otherwise they would be torn apart.")+c(r("ω(d) = ω₀·sin(π·d/r),  Drehsinn = sign(−∂U/∂φ)","ω(d) = ω₀·sin(π·d/r),  spin = sign(−∂U/∂φ)"))).range("vortexStrength",r("Wirbel-Stärke","Vortex strength"),0,10,.05,r("Drehgeschwindigkeit ω₀ der eingestreuten Wirbel relativ zur Jet-Stärke.","Spin ω₀ of the seeded vortices relative to jet strength."),s).section(r("Atmosphäre (Modul)","Atmosphere (module)"),r("Rechenmodell „Feuchte Atmosphäre“: feuchte, thermische Flachwassergleichungen auf der Kugel. Wolken, Stürme, Schwerewellen, Einschläge und Vulkane kommen alle aus denselben Gleichungen. Tippe auf den Planeten, um ein Ereignis auszulösen.","Maths model “moist atmosphere”: moist thermal shallow-water equations on the sphere. Clouds, storms, gravity waves, impacts and volcanoes all come from the same equations. Tap the planet to trigger an event."),!0).custom(this.formulaNote("∂u/∂t + (u·∇)u + f k̂×u = −b∇(D+B) − ½D∇b,  ∂D/∂t + ∇·(Du) = −β₁C,  ∂θ/∂t + u·∇θ = β₂C,  q<sub>sat</sub> = q₀·e<sup>νθ</sup>/D")).select("tapAction",r("Tippen löst aus","Tap triggers"),[["none",r("nichts","nothing")],["impact",r("Einschlag (wie Shoemaker-Levy 9)","Impact (like Shoemaker-Levy 9)")],["explosion",r("Explosion mit Druckwelle","Explosion with blast wave")],["volcano",r("Vulkan (10 s Ausbruch)","Volcano (10 s eruption)")],["anticyclone",r("Sturm: Antizyklon (Hoch)","Storm: anticyclone (high)")],["cyclone",r("Sturm: Zyklon (Tief)","Storm: cyclone (low)")]],r("Was ein kurzer Tipp auf den Planeten auslöst. Alles sind Quellterme in denselben Gleichungen: Masse (η), Wärme (θ), Dampf (q) und Asche als Gauß-Puls, dazu Wind. Einschlag und Explosion bringen Masse ohne Gleichgewicht ein, daraus läuft ein Schwerewellen-Ring nach außen, wie 1994 bei Shoemaker-Levy 9 auf Jupiter beobachtet (Ingersoll & Kanamori 1995). Stürme kommen balanciert (geostrophisch) wie in canoe/exo3.","What a short tap on the planet triggers. All are source terms in the same equations: mass (η), heat (θ), vapour (q) and ash as a Gaussian pulse, plus wind. Impact and explosion add mass out of balance, so a gravity-wave ring runs outwards, as observed on Jupiter after Shoemaker-Levy 9 in 1994 (Ingersoll & Kanamori 1995). Storms arrive balanced (geostrophic) as in canoe/exo3.")+c("Δη, Δθ, Δq, ΔAsche · exp(−½ d²/r²)")).range("tapPower",r("Stärke beim Tippen","Tap strength"),.1,5,.05,r("Skaliert alle Quellterme eines Tipps.","Scales all source terms of a tap."),d=>`${d.toFixed(2)}×`).range("aStorms",r("Sturm-Pulse","Storm pulses"),0,20,.1,r("Feuchte Konvektion als zufällige Massenpulse (Showman 2007, Formel wie canoe/exo3 von Li & Chen): pro Sekunde so viele auf dem ganzen Planeten, Hälfte Hochs, Hälfte Tiefs, geostrophisch balanciert. Daraus wachsen, wandern und verschmelzen Wirbel.","Moist convection as random mass pulses (Showman 2007, formula as in canoe/exo3 by Li & Chen): this many per second over the whole planet, half highs, half lows, geostrophically balanced. Vortices grow, drift and merge from them.")+c("η += ±A·exp(−½d²/r²),  u = c²/f · k̂×∇η"),d=>`${d.toFixed(1)}/s`).range("aStormAmp",r("Sturm-Stärke","Storm strength"),0,.4,.005,r("Amplitude A eines Pulses (Anteil der Schichtdicke). canoe/exo3: 0,1.","Amplitude A of a pulse (fraction of layer depth). canoe/exo3: 0.1."),a).range("ldef",r("Deformationsradius","Deformation radius"),.01,.2,.001,r("Rossby-Deformationsradius L_d in Planetenradien: die natürliche Größe der Wirbel. Jupiter ≈ 0,03 (2000 km), Eisriesen größer. Bestimmt die Schwerewellen-Geschwindigkeit.","Rossby deformation radius L_d in planet radii: the natural size of vortices. Jupiter ≈ 0.03 (2000 km), ice giants larger. Sets the gravity-wave speed.")+c("c = L<sub>d</sub>·f(45°),  c ≥ 2,5·U"),a).range("aSpin",r("Rotation","Rotation"),.2,5,.05,r("Ω kommt aus der echten Rossby-Zahl des Planeten (Wind, Radius, Tageslänge aus dem Steckbrief). 1 = wie der echte Planet.","Ω comes from the planet’s real Rossby number (wind, radius and day length from the fact sheet). 1 = like the real planet.")+c("Ω = U<sub>sim</sub>·Ω<sub>echt</sub>R / U<sub>echt</sub>"),d=>`${d.toFixed(2)}×`).range("aHumid",r("Feuchte","Humidity"),0,1.2,.01,r("Relative Feuchte, auf die der Dampf aus der Tiefe nachgefüllt wird. Nahe 1: fast gesättigt, schon kleine Hebung macht Wolken.","Relative humidity that vapour from below is refilled to. Near 1: almost saturated, small lifting already makes clouds.")+c("q<sub>v</sub> += max(RH·q<sub>sat</sub> − q<sub>v</sub>, 0)·(1 − e<sup>−Δt/τ</sup>)"),i).range("aHeat",r("Latente Wärme","Latent heat"),0,1,.01,r("Wie stark Kondensation die Luft erwärmt (β₂). Warme Luft steigt: Wolkentürme wachsen höher, Stürme verstärken sich selbst.","How strongly condensation warms the air (β₂). Warm air rises: cloud towers grow taller, storms feed themselves.")+c("θ += β₂·C,  γ<sub>v</sub> = 1/(1 + ν·β₂·q<sub>sat</sub>)"),s).range("aMass",r("Konvektion → Masse","Convection → mass"),0,.1,.001,r("Kondensation entzieht der Schicht Masse (β₁, mcRSW nach Bouchut et al. 2009): es entsteht ein Tief, das Luft ansaugt.","Condensation removes mass from the layer (β₁, mcRSW after Bouchut et al. 2009): a low forms that draws air in.")+c("D −= β₁·C"),a).range("aRain",r("Ausregnen","Rain-out"),0,2,.01,r("Wie schnell Wolkenwasser über der Schwelle ausregnet (1/τ). Klein: Wolken bleiben lange.","How fast cloud water above <body>
<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Real-time gas giant simulation"></canvas>
    <div class="hud">
      <h1>Fluid Gas Planet</h1>
      <div id="planet-info">Jupiter</div>
      <div class="meta"><span id="fps">– fps</span> <span id="version"></span></div>
      <div class="meta" id="hint">drag to rotate, scroll or pinch to zoom</div>

    <div id="loading" role="status" aria-live="polite">
      <div class="load-box">
        <p id="load-title">Spinning up the atmosphere</p>
        <div class="load-track"><span id="load-bar"></span></div>
        <p id="load-note"></p>
      </div>
    </div>
    <div id="toolbar"></div>
    <div id="status" hidden></div>
  </div>

    <div id="panel-body"></div>
    <p class="credits" id="credits"></p>
  </aside>
</div>
<script>
  (function () {
    var aside = document.getElementById('panel');
    var btn = document.getElementById('panel-toggle');
    btn.addEventListener('click', function () {
      var open = aside.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('[aria-hidden]').textContent = open ? '▾' : '▴';
    });
  })();
</script>
