}

const MAX_STORMS = 16u;

@group(0) @binding(0) var<uniform> S: Sim;

// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (st in [0,1]², Fläche) ohne Begrenzung.
fn cubeUV(d: vec3f) -> vec3f {
  let ad = abs(d);
  var face = 0.0; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0.0; sc = -d.z; } else { face = 1.0; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2.0; tc = d.z; } else { face = 3.0; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4.0; sc = d.x; } else { face = 5.0; sc = -d.x; }
    tc = -d.y;
  }
  return vec3f(vec2f(sc, tc) / ma * 0.5 + 0.5, face);
}

// Nahtloses bilineares Abtasten der Würfelfelder.
// Gemessen: das Hardware-Abtasten über Würfelkanten weicht bis zu 500-mal stärker ab als im
// Flächeninneren. Weil die Farbe jeden Schritt neu abgetastet wird, wachsen daraus Narben.
// Darum: im Inneren tastet die Hardware ab (dort exakt); nahe der Kante werden die vier
// Nachbar-Texel einzeln geholt, Texel jenseits der Kante über ihre Richtung auf der Nachbarfläche.
fn loadDir(t: texture_2d_array<f32>, s: sampler, q: vec3f) -> vec4f {
  let u = cubeUV(q);
  return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
}

fn sampleCube(t: texture_2d_array<f32>, s: sampler, p: vec3f) -> vec4f {
  let n = f32(textureDimensions(t).x);
  let u = cubeUV(p);
  let x = u.xy * n - 0.5;
  if (all(x >= vec2f(0.0)) && all(x <= vec2f(n - 1.0))) {
    return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
  }
  let i0 = floor(x);
  let f = x - i0;
  let face = u32(u.z);
  var c: array<vec4f, 4>;
  for (var k = 0u; k < 4u; k++) {
    let ij = i0 + vec2f(f32(k & 1u), f32(k >> 1u));
    if (all(ij >= vec2f(0.0)) && all(ij <= vec2f(n - 1.0))) {
      c[k] = textureLoad(t, vec2i(ij), i32(face), 0);
    } else {
      c[k] = loadDir(t, s, faceDir(face, (ij + 0.5) / n));
    }
  }
  return mix(mix(c[0], c[1], f.x), mix(c[2], c[3], f.x), f.y);
}

// Richtung -> (Fläche, Texel) für Schreibzugriffe aus Partikeln.
fn dirToTexel(d: vec3f, n: u32) -> vec3u {
  let ad = abs(d);
  var face = 0u; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0u; sc = -d.z; } else { face = 1u; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2u; tc = d.z; } else { face = 3u; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4u; sc = d.x; } else { face = 5u; sc = -d.x; }
    tc = -d.y;
  }
  let st = clamp(vec2f(sc, tc) / ma * 0.5 + 0.5, vec2f(0.0), vec2f(0.99999));
  let px = vec2u(st * f32(n));
  return vec3u(px, face);
}

// Orthonormale Tangentenbasis. Die Wahl darf von Punkt zu Punkt springen,
// weil Divergenz, Laplace und Gradient unabhängig von der Basisdrehung sind.
fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  let e2 = cross(p, e1);
  return mat2x3f(e1, e2);
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

// ---------- Tabellen ----------

fn jetAt(lat: f32) -> f32 {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  let a = S.jets[i / 4u][i % 4u];
  let b = S.jets[j / 4u][j % 4u];
  return mix(a, b, fract(x)) * S.jetStrength;
}

fn bandAt(lat: f32) -> vec3f {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  return mix(S.bands[i].rgb, S.bands[j].rgb, fract(x));
}

// ---------- Zufall und Rauschen ----------

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn hash3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;
}

fn rand4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u));
  let g = pcg3d(h.zxy ^ vec3u(b, a, 7u));
  return vec4f(vec3f(h), f32(g.x)) / 4294967295.0;
}

// Gradientenrauschen mit analytischer Ableitung: x = Wert, yzw = Gradient.
fn noised(x: vec3f) -> vec4f {

  let f = fract(x);

  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));

  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));

  v += stormFlow(p);

// Geburtsort: gleichverteilt auf der Kugel, oder (Anteil S.view.w) in der Kappe um die

fn spawnPos(r: vec4f) -> vec3f {
  let inView = fract(r.w * 57.3) < S.view.w;
  let cmin = select(-1.0, 0.1, inView);           // Kappe bis ~84° um die Blickrichtung
  let z = 1.0 - r.x * (1.0 - cmin);
  let phi = r.y * 2.0 * PI;
  let s = sqrt(max(0.0, 1.0 - z * z));
  if (!inView) { return vec3f(s * cos(phi), z, s * sin(phi)); }
  let ax = normalize(S.view.xyz);
  let tb = tangentBasis(ax);
  return normalize(ax * z + (tb[0] * cos(phi) + tb[1] * sin(phi)) * s);

fn spawn(i: u32, stagger: bool) -> Particle {

  let p = spawnPos(r);

    let w = noised(p * 4.0 + vec3f(S.seed, 0.0, 0.0)).x;
    col = bandAt(latitude(p) + w * S.bandWobble * 0.04) * (0.9 + 0.2 * fract(r.w * 13.1));

    let sm = stormMask(p, 0.55);
    col = mix(col, sm.rgb, sm.w * clamp(S.stormTint * 0.5, 0.0, 1.0));

// Partikel bewegen und in die Farbtextur mischen (Verfahren nach jasper-r).
// A = Farbstoff vorher, B = Flussfeld, dst = Farbstoff nachher (vorher per Kopie befüllt).
@compute @workgroup_size(64, 1, 1)

  var pt = parts[i];
  if (pt.info.x <= 0.0) {
    pt = spawn(i, true);
  } else if (pt.pos.w >= pt.info.x && S.lifetime < 60.0) {
    pt = spawn(i, false);
  } else {
    let dt = S.dt;
    var p = pt.pos.xyz;
    let v1 = B(p).xyz;
    let mid = stepOn(p, v1 * dt * 0.5);
    let v2 = B(mid).xyz;
    p = stepOn(p, v2 * dt);
    pt.pos = vec4f(p, pt.pos.w + dt);

  var fade = sin(PI * clamp(pt.pos.w / life, 0.0, 1.0));

// Weichzeichnen und zur Bandfarbe zurückblenden. A = Farbstoff nach Partikeln.
@compute @workgroup_size(8, 8, 1)
fn blurRelax(@builtin(global_invocation_id) id: vec3u) {

  let p = texDir(id, S.dyeN);
  let tb = tangentBasis(p);
  let h = 1.6 / S.dyeN;
  let c = A(p).rgb;
  let avg = (A(stepOn(p, tb[0] * h)).rgb + A(stepOn(p, -tb[0] * h)).rgb
           + A(stepOn(p, tb[1] * h)).rgb + A(stepOn(p, -tb[1] * h)).rgb) * 0.25;
  let blurred = mix(c, avg, S.blur);
  textureStore(dst, id.xy, id.z, vec4f(relaxColor(p, blurred), 1.0));
}

// Partikel-Schiene (jasper-r): weichzeichnen und langsam zu EINER Mittelfarbe verblassen.
// Keine Rückstellung zur Bandfarbe, keine Sturmfarbe: alle Struktur kommt von den Partikeln.
@compute @workgroup_size(8, 8, 1)
fn blurFade(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= S.dyeN || f32(id.y) >= S.dyeN) { return; }
  let p = texDir(id, S.dyeN);
  let tb = tangentBasis(p);
  let h = 1.6 / S.dyeN;
  let c = A(p).rgb;
  let avg = (A(stepOn(p, tb[0] * h)).rgb + A(stepOn(p, -tb[0] * h)).rgb
           + A(stepOn(p, tb[1] * h)).rgb + A(stepOn(p, -tb[1] * h)).rgb) * 0.25;
  let blurred = mix(c, avg, S.blur);
  textureStore(dst, id.xy, id.z, vec4f(mix(blurred, S.centre.rgb, 1.0 - exp(-S.centre.w * S.dt)), 1.0));
}
`,Ni=`// Planeten-Darstellung: ein Vollbild-Dreieck, jeder Pixel schneidet seinen Sichtstrahl
// mit dem abgeplatteten Planeten und der Ringebene. Keine Meshes, keine Bilddateien.

struct R {
  invViewProj: mat4x4f,
  camPos: vec4f,
  body0: vec4f, body1: vec4f, body2: vec4f,   // Welt -> Körper (Zeilen)
  sun: vec4f,       // xyz Richtung (Welt), w Intensität
  atmo: vec4f,      // rgb Farbe, w Stärke
  p0: vec4f,        // x Abplattung, y Relief, z Randverdunkelung, w Ansicht
  p1: vec4f,        // x Kartenmodus, y Ring innen, z Ring außen, w Ring-Deckkraft
  p2: vec4f,        // x Seitenverhältnis, y Zeit, z Belichtung, w Farbstoff-Auflösung
  ringColor: vec4f, // rgb, w Ringfaden-Kontrast
  p3: vec4f,        // x Fluss-Skala für Debug-Ansichten, y Pixelwinkel (rad), z Himmelskarte N, w Milchstraße
  p4: vec4f,        // x Sterne
};

@group(0) @binding(0) var<uniform> U: R;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var dyeTex: texture_cube<f32>;
@group(0) @binding(3) var velTex: texture_cube<f32>;
@group(0) @binding(4) var auxTex: texture_cube<f32>;
@group(0) @binding(5) var prsTex: texture_cube<f32>;
@group(0) @binding(6) var skyTex: texture_2d_array<f32>;   // gemeinsamer Himmel (src/sky)

const PI = 3.14159265359;

struct VOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VOut {
  let xy = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  var o: VOut;
  o.pos = vec4f(xy, 0.0, 1.0);
  o.ndc = xy;
  return o;
}

fn toBody(v: vec3f) -> vec3f { return vec3f(dot(U.body0.xyz, v), dot(U.body1.xyz, v), dot(U.body2.xyz, v)); }

fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract(q.x * q.y);
}

fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  return mat2x3f(e1, cross(p, e1));
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

// Ellipsoid x² + (y/c)² + z² = 1 mit c = 1 − Abplattung. Rückgabe: t oder −1.
fn hitPlanet(o: vec3f, d: vec3f) -> f32 {
  let c = 1.0 - U.p0.x;
  let s = vec3f(1.0, 1.0 / c, 1.0);
  let os = o * s; let ds = d * s;
  let a = dot(ds, ds);
  let b = dot(os, ds);
  let k = dot(os, os) - 1.0;
  let disc = b * b - a * k;
  if (disc < 0.0) { return -1.0; }
  let t = (-b - sqrt(disc)) / a;
  return select(-1.0, t, t > 0.0);
}

fn smoothHash(x: f32, salt: f32) -> f32 {
  let i = floor(x);
  let f = fract(x);
  return mix(hash21(vec2f(i, salt)), hash21(vec2f(i + 1.0, salt)), f * f * (3.0 - 2.0 * f));
}

// footprint: Breite eines Bildschirmpixels auf der Ringebene (in Planetenradien).
// Feinstruktur, die schmaler als ein Pixel ist, wird ausgeblendet statt zu flimmern.
fn ringDensity(r: f32, footprint: f32) -> f32 {
  let inner = U.p1.y; let outer = U.p1.z;
  if (r < inner || r > outer || outer <= inner) { return 0.0; }
  let x = (r - inner) / (outer - inner);
  // Grobe Struktur: dichter Hauptring, Lücke wie die Cassini-Teilung, schwacher Außenring.

  d *= mix(0.35, 1.0, smoothstep(0.18, 0.35, x));
  d *= 1.0 - 0.9 * (smoothstep(0.60, 0.62, x) - smoothstep(0.66, 0.68, x));

  let fine = mix(0.5, smoothHash(x * 420.0, 3.0), fineW) * 0.5 + mix(0.5, smoothHash(x * 90.0, 7.0), coarseW) * 0.5;

fn aces(x: vec3f) -> vec3f {
  let a = 2.51; let b = 0.03; let c = 2.43; let d = 0.59; let e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), vec3f(0.0), vec3f(1.0));
}

fn diverging(v: f32) -> vec3f {
  let t = clamp(v, -1.0, 1.0);
  let neg = vec3f(0.15, 0.45, 0.95);
  let pos = vec3f(0.95, 0.35, 0.15);
  return mix(vec3f(0.06), select(neg, pos, t > 0.0), abs(t));

// Farbe einer Stelle auf der Kugel je nach Ansicht.
fn surface(q: vec3f, mode: i32) -> vec3f {
  let fs = U.p3.x;
  if (mode == 1) {
    let v = textureSampleLevel(velTex, samp, q, 0.0).xyz;
    let tb = mat2x3f(east(q), cross(q, east(q)));
    let e = dot(v, tb[0]) * fs;
    let n = dot(v, tb[1]) * fs;
    return vec3f(0.5 + 0.5 * clamp(e, -1.0, 1.0), 0.5 + 0.5 * clamp(n, -1.0, 1.0), 0.6) * min(1.0, length(vec2f(e, n)) * 1.5 + 0.15);

  if (mode == 2) { return diverging(textureSampleLevel(auxTex, samp, q, 0.0).x * fs * 0.015); }

  if (mode == 3) { return diverging(textureSampleLevel(prsTex, samp, q, 0.0).x * 60.0 * fs * fs * 0.25); }

fn luminance(c: vec3f) -> f32 { return dot(c, vec3f(0.3, 0.59, 0.11)); }

@fragment
fn fs(vin: VOut) -> @location(0) vec4f {
  let mode = i32(U.p0.w);

  if (U.p1.x > 0.5) {
    let uv = vin.ndc * 0.5 + 0.5;
    let lon = (uv.x - 0.5) * 2.0 * PI;
    let lat = (uv.y - 0.5) * PI;
    let q = vec3f(cos(lat) * cos(lon), sin(lat), cos(lat) * sin(lon));

  let sun = normalize(toBody(U.sun.xyz));

  if (tPlanet < 0.0) {
    let tc = max(-dot(o, d), 0.0);
    let cp = o + d * tc;
    let ce = cp * vec3f(1.0, 1.0 / c, 1.0);
    let h = length(ce) - 1.0;
    let lit = smoothstep(-0.3, 0.4, dot(normalize(cp), sun));
    col += U.atmo.rgb * exp(-max(h, 0.0) / 0.025) * U.atmo.w * lit * U.sun.w;
  } else {
    let hp = o + d * tPlanet;
    let hs = hp * vec3f(1.0, 1.0 / c, 1.0);
    let q = normalize(hs);
    var n = normalize(hp * vec3f(1.0, 1.0 / (c * c), 1.0));

    var albedo = surface(q, mode);
    if (mode == 0) {
      // Relief aus der Helligkeit: helle Wolken liegen höher (Ammoniak-Eis), dunkle tiefer.
      if (U.p0.y > 0.0) {
        let tb = tangentBasis(q);
        let e = 3.0 / U.p2.w;
        let lx = luminance(surface(normalize(q + tb[0] * e), 0)) - luminance(surface(normalize(q - tb[0] * e), 0));
        let ly = luminance(surface(normalize(q + tb[1] * e), 0)) - luminance(surface(normalize(q - tb[1] * e), 0));
        n = normalize(n - (tb[0] * lx + tb[1] * ly) * U.p0.y * 3.0);
      }
      let v = -d;
      let ndl = dot(n, sun);
      let ndv = max(dot(n, v), 1e-3);
      let k = U.p0.z;
      // Minnaert-Randverdunkelung, k = 1 ist Lambert.
      var light = pow(max(ndl, 0.0), k) * pow(ndv, k - 1.0);
      // Dämmerungssaum
      light += smoothstep(0.12, -0.05, ndl) * smoothstep(-0.25, 0.0, ndl) * 0.05;
      // Schatten der Ringe auf dem Planeten
      if (U.p1.w > 0.0 && abs(sun.y) > 1e-4) {
        let tr = -hp.y / sun.y;
        if (tr > 0.0) {
          let rp = hp + sun * tr;
          light *= 1.0 - 0.85 * ringDensity(length(rp.xz), 0.02);
        }
      }
      let rim = pow(1.0 - ndv, 3.0) * U.atmo.w * smoothstep(-0.2, 0.3, ndl);
      col = albedo * light * U.sun.w + U.atmo.rgb * rim * U.sun.w;
    } else {
      col = albedo;
    }
  }

  // Ringe: vor dem Planeten drübermischen, dahinter verdeckt.
  if (U.p1.w > 0.0 && abs(d.y) > 1e-5 && mode == 0) {
    let tr = -o.y / d.y;
    if (tr > 0.0 && (tPlanet < 0.0 || tr < tPlanet)) {
      let rp = o + d * tr;
      let footprint = tr * U.p3.y / max(abs(d.y), 0.02);
      let dens = ringDensity(length(rp.xz), footprint);

        col = mix(col, rc, dens);
      }
    }
  }

  var outc = col;
  if (mode == 0) { outc = aces(col * U.p2.z); }
  return vec4f(pow(outc, vec3f(1.0 / 2.2)), 1.0);
