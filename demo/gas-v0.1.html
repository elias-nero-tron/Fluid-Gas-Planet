<html lang="de">

<style>

     Farben aus Jupiters Wolken: Ammoniak-Creme für Text, Gürtel-Ocker als Akzent. */
  :root {
    color-scheme: dark;
    --space: #07080b;
    --panel: rgba(16, 17, 22, 0.86);
    --line: #2a2a30;
    --text: #ece4d4;
    --muted: #9a9384;
    --accent: #d7a15f;
    --accent-dim: #6b5234;
    --focus: #f1c98f;
    --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--space);
    color: var(--text);
    font: 14px/1.45 var(--body);
    overflow: hidden;
  }
  #app { position: relative; height: 100%; display: grid; grid-template-columns: 1fr 340px; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  #view.map { cursor: default; }

  .hud {
    position: absolute; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px;
    display: flex; flex-direction: column; gap: 2px; pointer-events: none;
  }
  .hud h1 {
    margin: 0; font: 600 26px/1.05 var(--display); letter-spacing: 0.04em; text-transform: uppercase;
    text-wrap: balance;
  }
  .hud .meta { font: 12px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  #fps { color: var(--accent); }

  #status {
    position: absolute; inset: auto 16px 16px 16px; max-width: 520px; padding: 12px 14px;
    background: #2a1512; border: 1px solid #7a3326; border-radius: 6px; color: #f6d9cf;
  }

  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; overscroll-behavior: contain;
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
    backdrop-filter: blur(8px);
  }
  #panel-toggle { display: none; }
  .help {
    margin: 0 0 12px; padding: 10px 12px; min-height: 5.8em;
    border: 1px solid var(--line); border-radius: 6px; background: rgba(0, 0, 0, 0.35);
    color: var(--muted); font-size: 12.5px;
  }
  .help b { color: var(--text); font-weight: 500; }
  details { border-top: 1px solid var(--line); padding-block: 8px 10px; }
  summary {
    cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
    font: 600 15px/1.2 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text);
    padding-block: 4px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '+'; font-family: var(--mono); color: var(--muted); }
  details[open] > summary::after { content: '–'; }
  .note { margin: 2px 0 8px; font-size: 12px; color: var(--muted); }
  .row {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding-block: 5px;
  }
  .row label { font-size: 13px; }
  .row output { font: 12px var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); height: 22px; }
  .row-select { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
  select, button {
    font: 13px var(--body); color: var(--text); background: #1b1c22; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 8px; min-width: 0;
  }
  select { width: 100%; }
  .row-toggle label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .row-toggle input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
  .row-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent-dim); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .credits { margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .credits a { color: var(--muted); }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    aside {
      position: absolute; left: 0; right: 0; bottom: 0; max-height: 58%;
      border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0;
      transform: translateY(calc(100% - 48px - env(safe-area-inset-bottom, 0px)));
      transition: transform 0.25s ease;
      padding-block: 0 calc(24px + env(safe-area-inset-bottom, 0px));
    }
    aside.open { transform: none; }
    #panel-toggle {
      display: flex; width: 100%; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1; margin-bottom: 8px; padding: 14px 2px;
      background: none; border: 0; border-radius: 0; color: var(--text);
      font: 600 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--panel);
    }
    .hud h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }

const MAX_STORMS = 8u;

fn faceDir(face: u32, st: vec2f) -> vec3f {

  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (Fläche, Texel) für Schreibzugriffe aus Partikeln.
fn dirToTexel(d: vec3f, n: u32) -> vec3u {

// Orthonormale Tangentenbasis. Die Wahl darf von Punkt zu Punkt springen,
// weil Divergenz, Laplace und Gradient unabhängig von der Basisdrehung sind.
fn tangentBasis(p: vec3f) -> mat2x3f {

  let e1 = normalize(cross(helper, p));
  let e2 = cross(p, e1);
  return mat2x3f(e1, e2);

fn east(p: vec3f) -> vec3f {

  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

// ---------- Tabellen ----------

fn jetAt(lat: f32) -> f32 {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  let a = S.jets[i / 4u][i % 4u];
  let b = S.jets[j / 4u][j % 4u];
  return mix(a, b, fract(x)) * S.jetStrength;
}

fn bandAt(lat: f32) -> vec3f {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  return mix(S.bands[i].rgb, S.bands[j].rgb, fract(x));
}

// ---------- Zufall und Rauschen ----------

fn pcg3d(v0: vec3u) -> vec3u {

  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn hash3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;
}

fn rand4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u));
  let g = pcg3d(h.zxy ^ vec3u(b, a, 7u));
  return vec4f(vec3f(h), f32(g.x)) / 4294967295.0;

// Gradientenrauschen mit analytischer Ableitung: x = Wert, yzw = Gradient.
fn noised(x: vec3f) -> vec4f {

  let f = fract(x);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);

  let ga = hash3(i + vec3f(0.0, 0.0, 0.0));
  let gb = hash3(i + vec3f(1.0, 0.0, 0.0));
  let gc = hash3(i + vec3f(0.0, 1.0, 0.0));
  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));
  let ge = hash3(i + vec3f(0.0, 0.0, 1.0));
  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));
  let gg = hash3(i + vec3f(0.0, 1.0, 1.0));
  let gh = hash3(i + vec3f(1.0, 1.0, 1.0));

  let vb = dot(gb, f - vec3f(1.0, 0.0, 0.0));
  let vc = dot(gc, f - vec3f(0.0, 1.0, 0.0));
  let vd = dot(gd, f - vec3f(1.0, 1.0, 0.0));
  let ve = dot(ge, f - vec3f(0.0, 0.0, 1.0));
  let vf = dot(gf, f - vec3f(1.0, 0.0, 1.0));

  let vh = dot(gh, f - vec3f(1.0, 1.0, 1.0));

  let k1 = vb - va;
  let k2 = vc - va;
  let k3 = ve - va;
  let k4 = va - vb - vc + vd;
  let k5 = va - vc - ve + vg;
  let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;

  return vec4f(value, grad);
}

// Divergenzfreies Rauschfeld auf der Kugel: v = p × ∇ψ (ψ = FBM-Rauschen als Stromfunktion).
fn curlOnSphere(p: vec3f, freq: f32, t: f32, octaves: i32) -> vec3f {
  var g = vec3f(0.0);
  var amp = 1.0;
  var fr = freq;
  for (var o = 0; o < octaves; o++) {
    let off = vec3f(f32(o) * 17.3, t * (1.0 + 0.37 * f32(o)), f32(o) * -9.1);
    g += noised(p * fr + off).yzw * amp * fr / freq;
    amp *= 0.5;
    fr *= 2.03;
  }
  return cross(p, g);
}

// Drehfeld eines Sturms: Rotation um das Zentrum, Gauß-Profil.
fn stormFlow(p: vec3f) -> vec3f {
  var v = vec3f(0.0);
  let n = u32(S.stormCount);
  for (var i = 0u; i < min(n, MAX_STORMS); i++) {
    let c = S.storms[i].xyz;
    let r = S.storms[i].w;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    let x = d / r;
    // Geschwindigkeit ~ x·exp(−x²): null im Kern, Maximum am Rand, dann Abfall.
    let prof = x * exp(-x * x) * 2.33;
    v += cross(c, p) / max(sin(d), 1e-4) * prof * S.stormInfo[i].x;
  }
  return v * S.stormStrength;
}

// scale: Maskenradius relativ zum Sturmradius
fn stormMask(p: vec3f, scale: f32) -> vec4f {
  var tint = vec3f(0.0);
  var w = 0.0;
  let n = u32(S.stormCount);
  for (var i = 0u; i < min(n, MAX_STORMS); i++) {
    let c = S.storms[i].xyz;
    let r = S.storms[i].w;
    let d = acos(clamp(dot(c, p), -1.0, 1.0));
    let m = exp(-pow(d / (r * scale), 2.0));
    tint += S.stormInfo[i].yzw * m;
    w += m;
  }
  return vec4f(tint / max(w, 1e-4), min(w, 1.0));
}

// Ablauf pro Schritt: advect -> curl -> zonalClear/zonalSum -> forces -> divergence -> jacobi×K -> project.
//
// Ableitungen: Nachbarn sind die echten Nachbarzellen des Würfelgitters. Ihre Richtungen

// gleich groß und nicht rechtwinklig sind, wird der Gradient aus einem 2×2-System mit den
// tatsächlichen Abstandsvektoren gelöst. Der Laplace-Operator für den Druck ist kompakt

@group(0) @binding(3) var srcB: texture_cube<f32>;

const ZSCALE = 10000.0;

fn A(d: vec3f) -> vec4f { return textureSampleLevel(srcA, samp, d, 0.0); }
fn B(d: vec3f) -> vec4f { return textureSampleLevel(srcB, samp, d, 0.0); }

fn outside(id: vec3u) -> bool { return f32(id.x) >= S.velN || f32(id.y) >= S.velN; }

fn put(id: vec3u, v: vec4f) { textureStore(dst, id.xy, id.z, v); }

fn safe(v: vec3f) -> vec3f {
  // NaN/Inf-Schutz und Obergrenze für die Geschwindigkeit (rad/s).
  if (any(v != v) || any(abs(v) > vec3f(1e4))) { return vec3f(0.0); }
  let l = length(v);
  return select(v, v * (1.5 / l), l > 1.5);

// Zelle mit ihren vier Gitternachbarn und einer lokalen Orthonormalbasis.
struct Cell {
  p: vec3f,
  pE: vec3f, pW: vec3f, pN: vec3f, pS: vec3f,
  e1: vec3f, e2: vec3f,
  inv: mat2x2f,     // bildet (fE−fW, fN−fS) auf den Gradienten (in e1/e2) ab
  ax: f32, ay: f32, // 1/Abstand² für den Laplace-Operator
  size: f32,        // mittlere Zellgröße (rad)
};

fn cell(id: vec3u) -> Cell {
  let n = S.velN;
  let st = (vec2f(id.xy) + 0.5) / n;
  let d = 1.0 / n;
  var c: Cell;
  c.p = faceDir(id.z, st);
  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));
  let dA = c.pE - c.pW;
  let dB = c.pN - c.pS;
  c.e1 = normalize(tangent(c.p, dA));
  c.e2 = cross(c.p, c.e1);
  // Zeilen: dA und dB in der lokalen Basis. Gradient g erfüllt M·g = (fE−fW, fN−fS).
  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  let det = a * dd - b * cc;

  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / det);
  let hx = length(dA) * 0.5;
  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);
  return c;
}

fn grad2(c: Cell, dfA: f32, dfB: f32) -> vec2f { return c.inv * vec2f(dfA, dfB); }

@compute @workgroup_size(8, 8, 1)
fn initVel(@builtin(global_invocation_id) id: vec3u) {

  let p = cell(id).p;
  let v = east(p) * jetAt(latitude(p)) + curlOnSphere(p, 3.0, S.seed, 3) * 0.01;
  put(id, vec4f(tangent(p, v), 0.0));
}

@compute @workgroup_size(8, 8, 1)
fn clear(@builtin(global_invocation_id) id: vec3u) {
  if (outside(id)) { return; }
  put(id, vec4f(0.0));
}
