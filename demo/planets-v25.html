nnen strahlenförmig die Flanken hinab.","Stratovolcanoes: steep, concave flanks like Fuji or Mayon, a sharp rim, the crater a real sink (can fill with water). In the sea they form volcanic islands. Erosion carves gullies radially down the flanks."),fx:"v = (e^(−3t) − e^(−3))/(1 − e^(−3)),  t < t_c: v = v(t_c) − 0,28·(1 − (t/t_c)²)"},{k:"rivers",mode:"plus",type:"select",label:l("Flüsse & Seen","Rivers & lakes"),opts:[[1,l("Linien (wie v23)","Lines (as in v23)")],[2,l("eingegraben mit Seen (Versuch v24)","carved with lakes (trial v24)")],[0,l("aus","off")]],regen:!0,help:l("Aus der Höhenkarte berechnet: Senken füllen sich zu Seen (Priority-Flood, Barnes 2014), Regen sammelt sich bergab (Abflussakkumulation, O’Callaghan & Mark 1984; kein Abfluss aus Eis, wenig aus Wüsten). Breite und Tiefe wachsen mit der Wassermenge (Leopold & Maddock 1953). Das Tal wird in die Höhenkarte gegraben, der Wasserspiegel füllt es; das Ufer ergibt sich pixelgenau aus dem Gelände.","Computed from the height map: sinks fill up into lakes (priority-flood, Barnes 2014), rain gathers downhill (flow accumulation, O’Callaghan & Mark 1984; no runoff from ice, little from deserts). Width and depth grow with discharge (Leopold & Maddock 1953). The valley is carved into the height map and the water level fills it; the bank follows the terrain pixel by pixel."),fx:"Q = Σ Regen·(T > 0),  b ∝ Q^0,5,  d ∝ Q^0,4,  h′ = h − d·(1 − q²)²"},{k:"riverAmount",mode:"plus",min:.2,max:4,step:.05,label:l("Flussdichte","River density"),regen:!0,fmt:t=>`×${t.toFixed(2)}`,help:l("Wie viel Einzugsgebiet ein Fluss braucht. Höher = mehr, auch kleinere Flüsse.","How much catchment a river needs. Higher = more rivers, including smaller ones.")},{k:"craterFill",mode:"plus",type:"select",label:l("Kraterfüllung","Crater fill"),opts:[[1,l("Kratersee (bei „eingegraben“)","Crater lake (with “carved”)")],[0,l("leer","empty")]],help:l("Was in Vulkankratern steht. Der Krater ist eine echte Senke; ob Wasser darin steht, entscheidet  = (roughness·map)²,  D_GGX = α²/(π((n·h)²(α²−1)+1)²)"},{k:"metal",mode:"orig",min:0,max:1,step:.01,label:"metalness",help:l("Wie im Original: dieselbe Karte dient auch als Metall-Karte. Deshalb glänzt das Land dort metallisch.","As in the original: the same map also serves as metalness map. That is why the land has a metallic sheen."),fx:"F₀ = mix(0,04; Albedo; metalness·map)"},{k:"gloss",mode:"plus",min:0,max:1,step:.01,label:l("Glanz (Land)","Gloss (land)"),help:l("Glanzlichter auf Fels und Hängen. Wasser glänzt immer nach seiner eigenen Physik.","Highlights on rock and slopes. Water always shines by its own physics."),fx:"α_Land = α_Material·(1 − 0,55·Glanz)"}]},{id:"light",title:l("Licht","Lighting"),items:[{k:"sunAz",min:-180,max:180,step:1,label:l("Sonne: Richtung","Sun: direction"),fmt:t=>`${Math.round(t)}°`,help:l("Seitliches Licht zeigt das Relief am stärksten. Der Planet dreht sich, die Sonne steht fest.","Side light shows the relief best. The planet turns, the sun stays fixed.")},{k:"sunEl",min:-60,max:60,step:1,label:l("Sonne: Höhe","Sun: height"),fmt:t=>`${Math.round(t)}°`},{k:"sunI",mode:"orig",min:0,max:4,step:.01,label:l("Sonnenlicht","Sun light"),help:l("Wie im Original (Lighting).","As in the original (Lighting).")},{k:"ambient",mode:"orig",min:0,max:1,step:.01,label:l("Umgebungslicht","Ambient light"),help:l("Wie im Original (Lighting): hellt auch die Nachtseite auf.","As in the original (Lighting): also lights the night side.")},{k:"exposure",mode:"plus",min:.2,max:3,step:.01,label:l("Belichtung","Exposure"),help:l("Kamera-Belichtung. Danach ACES-Filmkurve, damit Glanzlichter nicht ausfressen.","Camera exposure, followed by the ACES film curve so highlights do not clip."),fx:"c = ACES(E·L)^(1/2,2)"},{k:"ambientP",mode:"plus",min:0,max:1.5,step:.01,label:l("Himmelslicht","Skylight"),help:l("Streulicht des Himmels auf der Tagseite. Die Nachtseite bleibt dunkel, wie im All.","Scattered skylight on the day side. The night side stays dark, as in space.")}]},{id:"clouds",title:l("Wolken","Clouds"),items:[{k:"cover",min:0,max:1,step:.01,label:l("Bedeckung","Cover"),fmt:Qt,help:l("Anteil des Himmels mit Wolken. 0 schaltet die Wolken aus.","Share of the sky with clouds. 0 turns clouds off.")},{k:"cloudOpO",mode:"orig",min:0,max:1,step:.01,label:l("Deckkraft","Opacity")},{k:"cloudOp",mode:"plus",min:0,max:2,step:.01,label:l("Dichte","Density"),help:l("Optische Dicke. Am Planetenrand schaut man schräg durch die Schicht, dort werden Wolken dichter.","Optical thickness. At the limb you look through the layer at a slant, so clouds get denser there."),fx:"α = 1 − exp(−τ/μᵥ)"},{k:"cloudH",mode:"plus",min:.002,max:.04,step:.001,label:l("Höhe","Height"),help:l("Abstand der Wolkenschicht zum Boden in Planetenradien. Echte Höhe: die Schatten fallen versetzt.","Distance of the cloud layer above ground in planet radii. Real height: shadows fall offset.")},{k:"wind",mode:"plus",min:0,max:4,step:.01,label:l("Wind","Wind"),help:l("Wolken ziehen in Breitenbändern wie auf der Erde: Passat nach Westen, Westwinde in mittleren Breiten, polare Ostwinde. Sie entstehen und vergehen dabei.","Clouds drift in latitude bands as on Earth: trade winds to the west, westerlies at mid latitudes, polar easterlies. They form and dissolve on the way."),fx:"u(φ) = −0,9·sin 6|φ| + 0,35·e^(−((|φ|−0,75)/0,18)²)"},{k:"cloudShadow",mode:"plus",min:0,max:1,step:.01,label:l("Wolkenschatten","Cloud shadows")}]},{id:"atmo",title:l("Atmosphäre","Atmosphere"),items:[{k:"glow",mode:"orig",min:0,max:3,step:.01,label:l("Leuchtsaum","Glow"),help:l("Wie im Original: Fresnel-Leuchtsaum um den Planeten.","As in the original: Fresnel glow around the planet."),fx:"I = (c − n·v)^p"},{k:"atmo",mode:"plus",min:0,max:3,step:.01,label:l("Luftdichte","Air density"),help:l("Rayleigh-Streuung: kurzes Blau streut stärker, deshalb der blaue Rand und die rötliche Tag-Nacht-Grenze.","Rayleigh scattering: short blue scatters more, hence the blue limb and the reddish terminator."),fx:
