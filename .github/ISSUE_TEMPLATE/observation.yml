name: Observation / Beobachtung
description: Something you noticed while watching or tuning a planet. Not necessarily a bug.
labels: [observation]
body:
  - type: markdown
    attributes:
      value: |
        One observation per issue, please. Observations first get an explanation, then a decision (see docs/PROCESS.md).
        Eine Beobachtung pro Issue. Sie bekommt zuerst eine Erklärung, dann eine Entscheidung (docs/de/PROZESS.md).
  - type: textarea
    id: seen
    attributes:
      label: What did you see? / Was ist dir aufgefallen?
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: What was better before, or what should stay? / Was war vorher besser oder soll bleiben?
  - type: textarea
    id: evidence
    attributes:
      label: Film strip or planet code / Filmstreifen oder Planeten-Code
      description: Diagnostics → “Record film strip”, drag the PNG here. Or paste an FGP1:… code.
  - type: input
    id: device
    attributes:
      label: Device, browser, fps / Gerät, Browser, fps
  - type: dropdown
    id: when
    attributes:
      label: When? / Wann?
      options:
        - Now / jetzt
        - Later, roadmap / später, Roadmap
